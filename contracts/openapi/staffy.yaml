        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Гейт чтения ДО стражей: контекст передачи требует review или configuration (audit-only — честный 403)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
