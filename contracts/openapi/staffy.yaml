      - $ref: '#/components/parameters/CaseID'
    post:
      operationId: promiseUpdate
      summary: 'Обещать обновление клиента в раунде handoff (первый срез 2.16): deadline_word — ЕДИНСТВЕННОЕ поле запроса, слово словаря {update_15m, update_1h, update_4h, update_unknown} с МАТЕРИАЛЬНОЙ честностью unknown (CHECK-пара unknown ↔ NULL-timestamp: слово без выдуманного срока НИКОГДА не несёт времени; promised_at — СЕРВЕРНАЯ истина под advisory-локами, НЕ поле запроса — strict decode отказывает); promise_no — СЕРВЕРНАЯ истина под локами (max+1, НЕ поле запроса); якорь — ОТКРЫТЫЙ lifecycle ЭТОГО кейса {requested, assigned, overdue, acknowledged} — стражи стора зеркалом слов (declined/cancelled/returned → 400); обещание НЕ гейтится владением (долг коммуникации — оператор review|configuration при любом владельце, прецедент коррекции 2.15); append-only строка (supersede derivation-only «последняя говорит») + outbox case.update_promised идентификаторами и словом (клиентский текст НИКОГДА); обещание НЕ переводит раунд в resolved (AC-3) и НЕ заменяет ответ (обновление отправляет человек существующим путём 2-4); терминальный кейс — 400 work-rule (чтение честно отдаёт историю); PRG-форма «Обещать обновление» секции «Запрос человека» ведёт тем же контуром (303 → GET ?update_promised=1#handoff)'
