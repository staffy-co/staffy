        event_id: { type: string, format: uuid }
        channel: { type: string, enum: [phone, web_chat, telegram, whatsapp, email, max, jivo, avito, mobile_app_chat] }
        modality: { type: string, enum: [voice, text] }
        direction: { type: string, enum: [inbound] }
        provider: { type: string }
        provider_event_id: { type: string }
        state: { type: string, enum: [accepted, quarantined] }
        provider_timestamp: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        payload_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        correlation_id: { type: string, format: uuid }
    WorkOutcome:
      type: object
      required: [command, replay]
      description: 'Материальный исход команды: сохранён и повторяется идемпотентным ключом'
      properties:
        command: { type: string, enum: [create_work_item, classify_work_item, transition_work_item, split_work_item, merge_work_items, link_event, dispute_work_item, record_fact, confirm_fact_version, rescope_fact, start_verification, bind_channel, unlink_channel, resolve_duplicate, take_ownership, request_transfer, resolve_transfer, reassign_ownership, send_client_reply, propose_mode, exit_mode, record_disclosure, record_disclosure_event, submit_ai_proposal, evaluate_policy, read_owning_system, record_objection, issue_continuation_link, revoke_continuation_link, record_accommodation] }
