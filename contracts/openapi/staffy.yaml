        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'Гонка номера сводки (stale_version — проигравший локов) / тот же ключ с иным материалом — command_key_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/cases/{case_id}/facts/{fact_id}/corrections:
    parameters:
