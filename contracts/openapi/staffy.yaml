        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Гейт прав ДО стражей: команды жизненного цикла передачи требуют review или configuration', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'Активный запрос — human_active (вторая конкурирующая задача не создаётся) / гонка лестницы mode_conflict / тот же ключ с иным материалом — command_key_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
