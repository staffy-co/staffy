        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: enqueueExternalCommitment
      summary: 'Поставить ТОЧНУЮ версию в очередь (AC-2/AC-3): approval-гейт живого человека-владельца точной версии + readiness-заборы ПО ПОРЯДКУ ДО транзакции (superseded/expired/owner_stale/pin_blocked); persist-before-emit СТРУКТУРНО — одна PG-транзакция INSERT outbox, сигнатура без адаптера: сетевой вызов физически невозможен до commit, сбой БД = внешняя система нетронута; dedup = пин версии (UNIQUE вторая линия)'
      x-staffy-principal-required: true
      responses:
        '200': { description: 'В очереди: слова сохранены ДО отправки — исход это доказательство очереди, НЕ отправка', content: { application/json: { schema: { type: object, required: [enqueue], properties: { enqueue: { $ref: '#/components/schemas/ExternalEnqueueOutcome' } } } } } }
        '400': { description: 'Approval-гейт словами AC-9 / словарные отказы readiness ДО транзакции (по счётчику — транзакция не открывается)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
