        commitment_id: { type: string, format: uuid, description: 'Связь обязательства (Story 2-9, гейт ПОСЛЕ objection-гейта): только sales-класс; пара (commitment_id, commitment_version) оба-или-ни-один; версия обязана существовать и быть offered (draft-not-presentable — честный 400)' }
