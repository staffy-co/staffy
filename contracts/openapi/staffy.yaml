      responses:
        '201': { description: Решение (и передача) записаны, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '200': { description: Повтор идемпотентного ключа, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/cases/{case_id}/ownership/reassign:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/CaseID'
    post:
      operationId: reassignOwnership
      summary: 'Прямое переназначение (путь надзора — configuration; гасит висящий запрос отменой той же транзакцией)'
      x-staffy-principal-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignOwnershipRequest' }
      responses:
        '201': { description: Термин нового epoch записан, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '200': { description: Повтор идемпотентного ключа, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/cases/{case_id}/client-replies:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/CaseID'
    post:
      operationId: sendClientReply
      summary: 'Единственный клиентский исходящий путь (серверный гейт: только текущий владелец-человек; отказ машинно читаем: current_owner/epoch/permitted_path)'
      x-staffy-principal-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendClientReplyRequest' }
      responses:
        '201': { description: Подготовленный ответ записан (снимок владельца/маршрута/lineage), content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '200': { description: Повтор идемпотентного ключа, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Отказ гейта (машинно читаем: current_owner_kind, current_owner_name, current_epoch, permitted_path)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/cases/client-replies/drain:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      operationId: drainClientReplies
      summary: 'Execute-time revalidation подготовленных ответов (свежий — dispatched + outbox; устаревший — stale_needs_review; материальная идемпотентность)'
      x-staffy-principal-required: true
      responses:
        '200': { description: 'Идемпотентный исход sweep-а', content: { application/json: { schema: { $ref: '#/components/schemas/DrainRepliesResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/cases/{case_id}/duplicates/{candidate_id}/resolution:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/CaseID'
      - $ref: '#/components/parameters/CandidateID'
    post:
      operationId: resolveDuplicate
      summary: 'Решение дубля (same_client → binding duplicate_review той же транзакцией; авто-merge нет)'
      x-staffy-principal-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveDuplicateRequest' }
      responses:
        '201': { description: Решение (и связь) записаны, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '200': { description: Повтор идемпотентного ключа, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/cases/{case_id}/facts/{fact_id}/rescope:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/CaseID'
      - $ref: '#/components/parameters/FactID'
    post:
      operationId: rescopeFact
      summary: Ре-скоуп факта новой версией (строки фактов не дублируются)
      x-staffy-principal-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescopeFactRequest' }
      responses:
        '201': { description: Новая версия со скоупом-целью, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '200': { description: Повтор идемпотентного ключа, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    EmployeeID:
      name: employee_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseID:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkItemID:
      name: work_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FactID:
      name: fact_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BindingID:
      name: binding_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferRequestID:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CandidateID:
      name: candidate_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Ключ команды: точный повтор возвращает сохранённый исход; тот же ключ с другим материалом — конфликт'
      schema: { type: string, minLength: 8, maxLength: 200 }
  schemas:
    DataClassView:
      type: object
      required: [spec, status, hold]
      properties:
        spec:
          type: object
          required: [id, title, tables]
          properties:
            id: { type: string }
            title: { type: string }
            tables: { type: array, items: { type: string } }
            executor: { type: string }
            block: { $ref: '#/components/schemas/PrivacyManagedBlock' }
            audit_min_term: { type: boolean }
        status: { type: string, enum: ['complete','incomplete','undocumented'] }
        missing: { type: array, items: { type: string } }
        entry: { $ref: '#/components/schemas/DataMapEntry' }
        policy: { $ref: '#/components/schemas/RetentionPolicy' }
        hold:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: ['none','active','requires_decision'] }
            basis: { type: string }
            approver: { type: string }
            review_deadline: { type: string, format: date-time }
        reference_time: { type: string, format: date-time, nullable: true }
        deletion_due_at: { type: string, format: date-time, nullable: true }
        mandatory_due_at: { type: string, format: date-time, nullable: true }
    DataMapEntry:
      type: object
      required: [class, version, created_at]
      properties:
        tenant_id: { type: string }
        class: { type: string }
        version: { type: integer, minimum: 1 }
        purpose: { type: string }
        legal_basis: { type: string }
        controller: { type: string }
        processor: { type: string }
        recipients: { type: array, items: { type: string } }
        sub_processors: { type: array, items: { type: string } }
        locations: { type: array, items: { type: string } }
        accessible_roles: { type: array, items: { type: string } }
        known_copies: { type: array, items: { type: string } }
        retention_policy_ref: { type: string }
        deletion_method: { type: string }
        export_method: { type: string }
        actor_id: { type: string }
        created_at: { type: string, format: date-time }
    RetentionPolicy:
      type: object
      required: [class, version, purpose, legal_basis, source, terminal_event, active_use_days, archive_days, deletion_days, backup_expiry_days, legal_hold_exception, owner_note, created_at]
      properties:
        tenant_id: { type: string }
        class: { type: string }
        version: { type: integer, minimum: 1 }
        purpose: { type: string }
        legal_basis: { type: string }
        source: { type: string, enum: ['tenant_decision','legal_requirement','contract','default'] }
        terminal_event: { type: string }
        active_use_days: { type: integer }
        archive_days: { type: integer }
        deletion_days: { type: integer }
        backup_expiry_days: { type: integer }
        legal_hold_exception: { type: string }
        owner_note: { type: string }
        actor_id: { type: string }
        created_at: { type: string, format: date-time }
    LegalHoldEvent:
      type: object
      required: [event_id, event, classes, basis, approver, review_deadline, created_at]
      properties:
        tenant_id: { type: string }
        event_id: { type: string }
        event: { type: string, enum: ['activated','released'] }
        classes: { type: array, items: { type: string } }
        basis: { type: string }
        approver: { type: string }
        review_deadline: { type: string, format: date-time }
        actor_id: { type: string }
        created_at: { type: string, format: date-time }
    LifecycleReceipt:
      type: object
      required: [receipt_id, request_id, receipt_hash, authority, policy_versions, outcomes, completed_at]
      description: Квитанция хранит только идентификаторы, счётчики и хэш-доказательство; удалённое содержимое не входит никогда.
      properties:
        tenant_id: { type: string }
        receipt_id: { type: string }
        request_id: { type: string }
        receipt_hash: { type: string }
        authority: { type: string, enum: ['data_governance'] }
        policy_versions:
          type: array
          items:
            type: object
            required: [class, version, terminal_event]
            properties:
              class: { type: string }
              version: { type: integer }
              terminal_event: { type: string }
        outcomes: { type: array, items: { $ref: '#/components/schemas/DeletionOutcome' } }
        completed_at: { type: string, format: date-time }
        actor_id: { type: string }
    DeletionOutcome:
      type: object
      required: [class, outcome, affected_count, note]
      properties:
        class: { type: string }
        outcome: { type: string, enum: ['deleted','scheduled','retained_by_law','unsupported','unknown'] }
        affected_count: { type: integer, minimum: 0 }
        due_at: { type: string, format: date-time, nullable: true }
        note: { type: string }
        block: { $ref: '#/components/schemas/PrivacyManagedBlock' }
        reconciliation_owner: { type: string }
        reconciliation_deadline: { type: string, format: date-time, nullable: true }
    PrivacyManagedBlock:
      type: object
      required: [required, gate, owner]
      properties:
        required: { type: string }
        gate: { type: string }
        owner: { type: string }
    VoiceProfile:
      type: object
      required: [id, language, styles, min_tempo, max_tempo, preview_status, restrictions]
      properties:
        id: { type: string }
        language: { type: string }
        styles: { type: array, items: { type: string } }
        min_tempo: { type: integer }
        max_tempo: { type: integer }
        preview_status: { type: string, enum: [available, unavailable] }
        restrictions: { type: array, items: { type: string } }
    Pronunciation:
      type: object
      additionalProperties: false
      required: [written, language, scope, normalized, test_phrase, support_status, critical_kind, synthetic_data_confirmed]
      properties:
        written: { type: string, maxLength: 120 }
        language: { type: string }
        scope: { type: string }
        normalized: { type: string, maxLength: 240 }
        test_phrase: { type: string, maxLength: 300 }
        support_status: { type: string, enum: [unverified, unsupported] }
        critical_kind: { type: string, enum: [none, vin, oem, article, phone, address, date, amount, pack] }
        synthetic_data_confirmed: { type: boolean, const: true, description: Explicit confirmation that this entry uses fictional test data; no automatic PII detection is performed. }
        readback: { $ref: '#/components/schemas/ReadbackPlan' }
        phone_quality_approved: { type: boolean, const: false }
    ReadbackPlan:
      type: object
      additionalProperties: false
      required: [segments, confirmation, on_mismatch, phone_quality_gate]
      properties:
        segments: { type: array, minItems: 2, maxItems: 60, items: { type: string, minLength: 1, maxLength: 32 } }
        confirmation: { type: string, const: ask_customer }
        on_mismatch: { type: string, const: human_handoff }
        phone_quality_gate: { type: string, const: pending_human }
    VoiceConfig:
      type: object
      additionalProperties: false
      required: [profile_id, language, style, tempo, dictionary]
      properties:
        profile_id: { type: string }
        language: { type: string }
        style: { type: string }
        tempo: { type: integer }
        dictionary: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Pronunciation' } }
    VoiceCommand:
      type: object
      additionalProperties: false
      required: [version, config, change_summary]
      properties:
        version: { type: integer, minimum: 1 }
        config: { $ref: '#/components/schemas/VoiceConfig' }
        change_summary: { type: string, minLength: 1, maxLength: 300 }
    VoiceVersion:
      type: object
      required: [tenant_id, employee_id, version, draft_version, config, actor_id, changed_at, change_summary]
      properties:
        tenant_id: { type: string, format: uuid }
