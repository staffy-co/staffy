        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'Гонка эпохи (stale_version) / активная передача 2-4 / command_key_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/cases/{case_id}/decision-context:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/CaseID'
    get:
