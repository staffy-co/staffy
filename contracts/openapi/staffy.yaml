        owner_epoch: { type: integer, minimum: 1, description: 'Пин эпохи владельца согласия — policy-гейт сверяет с живой' }
        release_decision_no: { type: integer, minimum: 0, description: 'Снимок релиза маршрута момента согласия' }
        profile_version: { type: integer, minimum: 0 }
        partition: { $ref: '#/components/schemas/PreviewPartitionWord' }
        idempotency_key: { type: string, description: 'Клиентское слово повторов (UNIQUE (tenant, idempotency_key) — replay-дедуп структурен)' }
        business_intent_key: { type: string, description: 'Серверная keyed-HMAC идентичность мутации (UNIQUE резервации (tenant, owning_system, business_intent_key)) — два пространства ключей невзаимозаменяемы' }
        material_digest: { type: string, minLength: 64, maxLength: 64, description: 'Keyed-HMAC отпечаток пинов запроса (preview версия + confirmation пин): биекция пары = replay, другая версия = conflict' }
        state: { $ref: '#/components/schemas/OperationStateWord' }
        state_text: { type: string, description: 'Слова жизни честным текстом (словарь 6) + факт очереди словами — executed НИКОГДА не выводится (AC-11)' }
        queued: { type: boolean, description: 'Факт очереди: запись operation.queued существует в outbox (наличие — факт, не хранимое состояние)' }
        state_at: { type: string, format: date-time, description: 'Момент состояния: время последней state-bearing записи ledger (dispatch_blocked не двигает)' }
        owning_system: { type: string, description: 'Система-владелец исполнения (словарь 2-7 пиннутого определения); пусто = определение не резолвится против каталога' }
        next_step_text: { type: string, description: 'Следующий шаг честным текстом по слову жизни (AC-13/FR-28): authorized → команда drain оператора; failed → новая Confirmation 3-5; unknown → сверка 3-7' }
        block_reason_text: { type: string, description: 'Видимая причина остановки отправки: детали последней dispatch_blocked записи (операция остаётся authorized — припаркована с видимой причиной, НЕ ложный failed externally); пусто = блокировок не было' }
        external_id_absent_text: { type: string, description: '«Внешний идентификатор не выдан» — до отправки не выдумывается; появляется записью dispatch-исхода' }
        dispatch_absent_text: { type: string, description: '«Dispatch — явная команда drain: демона нет» — очередь до запуска честно копится pending' }
        reconcile_absent_text: { type: string, description: '«Reconcile — явная команда сверки: демона нет» — unknown-операции честно остаются при своих квитанциях до запуска оператора' }
        ledger:
          type: array
          items: { $ref: '#/components/schemas/OperationLedgerEntryView' }
        attempts:
          type: array
          description: 'Прогрессивный аудит попыток (≤3, закрытые details на странице — 320px без скролла аудита)'
          items: { $ref: '#/components/schemas/DispatchAttemptView' }
        receipts:
          type: array
          description: 'Версии Action Receipt (append-only, v1 неприкосновенна — позднее evidence 3-7 допишет v2+)'
          items: { $ref: '#/components/schemas/ActionReceiptView' }
        reconciliation_attempts:
          type: array
          description: 'Попытки сверки (≤3, закрытые details на странице — 320px без скролла аудита; вердикт словами словаря 4)'
          items: { $ref: '#/components/schemas/ReconciliationAttemptView' }
        recovery_trigger:
          description: 'Триггер восстановления read-time (3-8): отсутствует = операция НЕ eligible — наследное слово следующего шага продолжает говорить (смена доменного слова пинится journeys z36, правило 161)'
          oneOf:
            - $ref: '#/components/schemas/RecoveryTriggerWord'
        recovery_trigger_text: { type: string, description: 'Фиксированный текст триггера (тексты домена; отсутствует = не eligible)' }
        recovery_case_id: { type: string, format: uuid, description: 'Пин существующего Recovery Case (нулевая ссылка = кейса ещё нет — максимум один навсегда)' }
        recovery_case_no: { type: integer, minimum: 1, description: 'Номер существующего кейса (отсутствует = кейса нет)' }
        created_at: { type: string, format: date-time }
    AuthorizationOutcome:
      type: object
      additionalProperties: false
      required: [command, replay, reservation_reference, outcome_text, operation]
      properties:
        command: { type: string }
        replay: { type: boolean, description: 'Идемпотентный возврат ПЕРВОНАЧАЛЬНОЙ Operation (200): потребление не повторилось, вторая outbox запись не создана — AC-7' }
        reservation_reference: { type: boolean, description: 'Ссылка проигравшего резервной гонки (200): эквивалентное намерение уже зарезервировано, потребление проигравшего НЕ произошло — AC-9' }
        outcome_text: { type: string, description: 'Фиксированный честный текст пути возврата' }
        operation: { $ref: '#/components/schemas/OperationCardView' }
    AuthorizationView:
      type: object
      additionalProperties: false
      required: [tenant_id, case_id, confirmations, operations]
      properties:
        tenant_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        empty_text: { type: string, description: 'Честные слова пустого состояния: подтверждений и операций нет — подготовьте preview и подтвердите точную версию' }
        confirmations:
          type: array
          items: { $ref: '#/components/schemas/ConfirmationCardView' }
        operations:
          type: array
          items: { $ref: '#/components/schemas/OperationCardView' }
    DrainOperationsRequest:
      type: object
      additionalProperties: false
      description: 'Тело команды drain — ровно один ПУСТОЙ объект: параметров не существует (bounded операторная команда домена); свободное поле = 400 строгим decode'
    DispatchReportLineView:
      type: object
      additionalProperties: false
      required: [operation_id, attempt_no, text]
      properties:
        operation_id: { type: string, format: uuid }
        attempt_no: { type: integer, minimum: 1, maximum: 3, description: 'Номер попытки строки (0 — задание без попыток: фенция ДО lease)' }
        text: { type: string, description: 'Честные слова строки: точная причина парковки / пропуска / вердикта (FR-28)' }
    DispatchDrainResultView:
      type: object
      additionalProperties: false
      required: [command, considered, dispatched, blocked, skipped, reports]
      properties:
        command: { type: string, description: 'dispatch_queued_operations — имя явной команды (демона нет)' }
        considered: { type: integer, minimum: 0, description: 'Рассмотрено заданий bounded-батча (доменный предел 100)' }
        dispatched: { type: integer, minimum: 0, description: 'Отправлено с записанным вердиктом' }
        blocked: { type: integer, minimum: 0, description: 'Припарковано на фенции (dispatch_blocked с точным словом причины)' }
        skipped: { type: integer, minimum: 0, description: 'Честные пропуски (racing/replay/alarm)' }
        reports:
          type: array
          description: 'Построчный отчёт каждого рассмотренного задания — слова, не молчание'
          items: { $ref: '#/components/schemas/DispatchReportLineView' }
    DispatchAttemptView:
      type: object
      additionalProperties: false
      required: [attempt_no, lease_created_at, lease_expires_at, request_digest, outcome_recorded, outcome_text, correlation_id, guarantee_recorded]
      description: 'Одна попытка отправки: write-ahead факты lease (право и момент закреплены ДО сетевого вызова), keyed digest (redacted след — сырой payload нигде), слово исхода адаптера КОГДА записано (словарь 4) и слово resting-состояния когда нет'
      properties:
        attempt_no: { type: integer, minimum: 1, maximum: 3, description: 'Монотонный fencing-токен (предел 3 — bounded)' }
        lease_created_at: { type: string, format: date-time, description: 'Write-ahead: право и момент отправки закреплены до вызова' }
        lease_expires_at: { type: string, format: date-time, description: 'Окно lease: timeout определения + grace' }
        request_digest: { type: string, minLength: 64, maxLength: 64, description: 'Keyed-HMAC след материала (dispatch_request:v1:) — сверка повтора по следу, сырой payload НИКОГДА' }
        outcome:
          description: 'Честное слово исхода адаптера (словарь 4); отсутствует = исход не записан (write-ahead resting-состояние)'
          oneOf:
            - type: string
              enum: [accepted, committed, failed, timeout]
        outcome_recorded: { type: boolean, description: 'false = write-ahead resting-состояние краха: ответ не попал в историю, истёкшая lease покажет восстановление' }
        outcome_text: { type: string, description: 'Честный текст исхода / resting-состояния (тексты домена)' }
        correlation_id: { type: string, description: 'Корреляция провайдера; пусто = не выдана' }
        guarantee_recorded: { type: boolean, description: 'Записанная гарантия провайдера (факт аудита — вход политики повтора, никогда живое перечитывание)' }
        outcome_recorded_at: { type: string, format: date-time, description: 'Момент записи исхода (отсутствует = не записан)' }
    ActionReceiptView:
      type: object
      additionalProperties: false
      required: [receipt_version_no, outcome, outcome_text, case_id, work_item_id, preview_id, preview_version_no, confirmation_id, confirmation_version_no, definition_id, definition_version, external_object_id, external_object_version, details, created_at]
      description: 'Одна версия Action Receipt (FR-31): readback идентификаторов — решение восстанавливается БЕЗ чтения диалога; SAFE-пины и слова, чувствительный материал НИКОГДА не дублируется'
      properties:
        receipt_version_no: { type: integer, minimum: 1, description: 'Append-only версия (v1 создаётся первым решающим исходом; позднее evidence 3-7 допишет v2+ — v1 неприкосновенна)' }
        outcome: { type: string, enum: [committed, failed, unknown], description: 'Словарь исходов квитанции (3): accepted квитанции не несёт — итога ещё нет' }
        outcome_text: { type: string, description: 'Честный текст исхода квитанции (тексты домена)' }
        case_id: { type: string, format: uuid }
        work_item_id: { type: string, format: uuid }
        preview_id: { type: string, format: uuid }
        preview_version_no: { type: integer, minimum: 1 }
        confirmation_id: { type: string, format: uuid }
        confirmation_version_no: { type: integer, minimum: 1 }
        definition_id: { type: string }
        definition_version: { type: string }
        external_object_id: { type: string, description: 'Идентификатор внешнего объекта (только committed несёт тройку); пусто = не выдан' }
        external_object_version: { type: string, description: 'Версия внешнего объекта; пусто = не выдана' }
        details: { type: string, description: 'Safe-details ≤500 рун — идентификаторы и слова, материал НИКОГДА' }
        created_at: { type: string, format: date-time }
    ReconcileOperationsRequest:
      type: object
      additionalProperties: false
      description: 'Тело команды reconcile — ровно один ПУСТОЙ объект: параметров не существует (bounded операторная команда домена); свободное поле = 400 строгим decode'
    ReconciliationVerdictWord:
      type: string
      enum: [committed, no_effect, in_progress, no_answer]
      description: 'Словарь вердиктов сверки (4 слова): committed — терминальный успех с обязательным evidence-тройником (внешний объект id/версия/время); no_effect — доказанное отсутствие эффекта (только при объявленной семантике отсутствия: LIVE-слово декларации + ReconciliationQuery определения; голый 404 = no_answer); in_progress — промежуточное состояние системы-владельца (операция остаётся unknown); no_answer — честное «не отвечено» (ошибка/таймаут/чужое слово/неполные evidence) — НЕ failed и НЕ успех'
    ReconcileReportLineView:
      type: object
      additionalProperties: false
      required: [operation_id, attempt_no, text]
      properties:
        operation_id: { type: string, format: uuid }
        attempt_no: { type: integer, minimum: 0, maximum: 3, description: 'Номер попытки строки (0 — цель без попыток: фенция ДО lease)' }
        text: { type: string, description: 'Честные слова строки: записанный вердикт с фиксированным текстом / точная причина пропуска (фенция без права, гонка, тревога терминального замка) — FR-30' }
    ReconcileResultView:
      type: object
      additionalProperties: false
      required: [command, considered, queried, decided, skipped, reports]
      properties:
        command: { type: string, description: 'reconcile_unknown_operations — имя явной команды (демона нет)' }
        considered: { type: integer, minimum: 0, description: 'Рассмотрено целей bounded-батча (доменный предел 100)' }
        queried: { type: integer, minimum: 0, description: 'Запрошено у систем-владельцев (единственный сетевой вызов на попытку, вне транзакций)' }
        decided: { type: integer, minimum: 0, description: 'Записано вердиктов (попытка всегда пишет исход — guarded truth)' }
        skipped: { type: integer, minimum: 0, description: 'Честные пропуски (фенции без права, гонки, тревоги)' }
        reports:
          type: array
          description: 'Построчный отчёт каждой рассмотренной цели — слова, не молчание'
          items: { $ref: '#/components/schemas/ReconcileReportLineView' }
    RecoveryCreateRequest:
      type: object
      additionalProperties: false
      description: 'Тело команды создания Recovery Case — ровно один ПУСТОЙ объект: параметров не существует (слова назначения живыми чтениями — НИКОГДА из параметров команды); свободное поле = 400 строгим decode'
    OutboxEventWord:
      type: string
      enum: [operation.queued, receipt.created, recovery_case.created]
      description: 'Словарь событий outbox модуля action (3 слова, срез 3-8: 2→3): operation.queued — задание отправки 3-5; receipt.created — ссылка квитанции 3-6; recovery_case.created — ссылка кейса восстановления 3-8 (записи честно копятся pending — потребитель будущий: claim-режим и контур 3-9 читают событие, прецедент receipt.created)'
    RecoveryTriggerWord:
      type: string
      enum: [reconciliation_exhausted, reconciliation_unavailable, operation_failed]
      description: 'Словарь триггеров восстановления (3 слова): reconciliation_exhausted — unknown и попытки сверки исчерпаны 3/3 (записанный факт побеждает объявленность); reconciliation_unavailable — unknown и автоматического контура нет (не объявлена ИЛИ не подключена AG-4 — production-путь: человек обязателен); operation_failed — терминальный отказ без права повтора (попытки 3/3 либо политика без retry-права: «требующая человека» = автоматика исчерпана); терминальный конфликт 3-7 НЕ отдельный триггер (полный откат не оставляет записи — слово без материального события не бывает)'
    RecoveryEventKindWord:
      type: string
      enum: [created, evidence_appended]
      description: 'Словарь kind событий Recovery Case (2 слова): created — рождение кейса (ОДНО на операцию навсегда); evidence_appended — позднее terminal evidence 3-7 ОДНОЙ append-only строкой SAFE-дельты (исходный bundle и квитанции НЕ переписываются); закрывающих слов в срезе НЕТ (AC-11 будущий срез — словарь не растёт рантаймом)'
    RecoveryCaseStateWord:
      type: string
      enum: [open]
      description: 'Словарь состояний Recovery Case (1 слово, read-time): open — BY CONSTRUCTION (закрывающих событий в словаре среза нет; закрытие = осознанный рост словаря будущего среза, никогда рантайм)'
    RecoveryDecisionWord:
      type: string
      enum: [created, idempotent, evidence]
      description: 'Словарь решений команды создания (3 слова): created — новый кейс (строка + событие + outbox); idempotent — повтор с неизменённым bundle digest (существующий кейс, второй строки и события НЕТ); evidence — повтор с дельтой (ОДНА append-only строка evidence_appended)'
    RecoveryActionKindWord:
      type: string
      enum: [request_evidence, show_recorded_conditions, truthful_status_update, offer_approved_options, prepare_pause_cancel]
      description: 'Словарь видов recovery action policy (5 слов, compile-time — 3-9): стандартная recovery policy эпика FR-39; вне-словарное действие НЕВОЗМОЖНО (словарь заморожен в коде, расширение = словарный ревью, никогда рантайм); зеркала OpenAPI/домена пинятся контракт-тестом (drift = красный)'
    RecoveryHumanOnlyWord:
      type: string
      enum: [liability_or_fault, nonstandard_outcome]
      description: 'Словарь human-only решений (2 слова — класс перечислен ОТДЕЛЬНО от набора видов, AC-1): liability_or_fault — признание вины/юридический вывод; nonstandard_outcome — нестандартная компенсация/возврат/исключение; только человек (PRD FR-39 дословно)'
    RecoveryActionStateWord:
      type: string
      enum: [allowed, blocked, human_only]
      description: 'Словарь состояний вида политики (3 слова, read-time): allowed — вид в праве системы (материальный несёт Confirmation-требование, AC-13); blocked — граница блокирует (paused scoped control блокирует материальные виды ТОЧНЫМ словом, чтение остаётся — AC-10 эпика 3.7 наследуется); human_only — правило отсутствует/неоднозначно, решение за человеком (fail-closed AC-1 хвост)'
    RecoveryObservationPinView:
      type: object
      additionalProperties: false
      required: [ref, version]
      description: 'ОДИН пин supporting-observation (2-7): ссылка-версия — материал НИКОГДА (immutable-строка наблюдения остаётся у себя)'
      properties:
        ref: { type: string, format: uuid }
        version: { type: integer, minimum: 1, description: 'Пиннутая версия наблюдения превью' }
    RecoveryAssignmentView:
      type: object
      additionalProperties: false
      required: [owner_kind, owner_ref, owner_epoch, backup_owner_id, ack_deadline_minutes]
      description: 'Назначение Recovery Case — ТОЛЬКО живые чтения момента создания (AC-1): владелец = текущий терм Ownership исходного кейса (максимальная эпоха); backup и дедлайн = human coverage маршрута исходной conversation (coverageWord-канон: слова НИКОГДА из параметров команды; непрочитанное покрытие = fail-closed, кейс НЕ создаётся)'
      properties:
        owner_kind: { type: string, description: 'Вид владельца исходного кейса (human/staffy)' }
        owner_ref: { type: string, format: uuid }
        owner_epoch: { type: integer, minimum: 1, description: 'Эпоха терма владельца' }
        backup_owner_id: { type: string, format: uuid, description: 'Backup из human coverage маршрута' }
        ack_deadline_minutes: { type: integer, minimum: 1, description: 'Слово дедлайна покрытия (минуты); deadline_at карточки = момент создания + минуты' }
    RecoveryEventView:
      type: object
      additionalProperties: false
      required: [event_no, kind, details, actor_id, created_at]
      description: 'ОДНА append-only строка истории Recovery Case: монотонный номер под замком кейса, kind словаря 2, SAFE details ≤500 (слова дельты — идентификаторы/версии/счётчики, материал НИКОГДА)'
      properties:
        event_no: { type: integer, minimum: 1, description: 'Монотонный номер события кейса' }
        kind: { $ref: '#/components/schemas/RecoveryEventKindWord' }
        details: { type: string, description: 'SAFE-слова события: триггер создания / дельта изменившихся пинов (old→new)' }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    RecoveryLinksView:
      type: object
      additionalProperties: false
      required: [preview_id, preview_version_no, confirmation_id, confirmation_version_no, receipt_versions_count, latest_receipt_version_no, latest_receipt_outcome, dispatch_attempts, reconcile_attempts, external_object_id, external_object_version, owning_system, observations]
      description: 'SAFE link-bundle карточки (AD-10/AC-9 — минимальные ссылки вместо копий: чувствительный payload остаётся в immutable-строках превью): пины манифеста исполнения ТОЧНЫХ версий, ЖИВАЯ цепочка квитанций (деривация чтения — карточка всегда свежая, AC-10), счётчики попыток обоих контуров, внешняя идентичность последней квитанции (пусто = честное unknown), пины наблюдений'
      properties:
        preview_id: { type: string, format: uuid }
        preview_version_no: { type: integer, minimum: 1 }
        confirmation_id: { type: string, format: uuid }
        confirmation_version_no: { type: integer, minimum: 1 }
        receipt_versions_count: { type: integer, minimum: 0, description: 'ЖИВАЯ цепочка квитанций на момент чтения' }
        latest_receipt_version_no: { type: integer, minimum: 0, description: '0 = квитанций нет' }
        latest_receipt_outcome: { type: string, enum: ['', committed, failed, unknown], description: 'Исход последней квитанции (пусто = квитанций нет — честное слово)' }
        dispatch_attempts: { type: integer, minimum: 0, maximum: 3, description: 'Счётчик dispatch-попыток (живая деривация)' }
        reconcile_attempts: { type: integer, minimum: 0, maximum: 3, description: 'Счётчик попыток сверки (живая деривация)' }
        external_object_id: { type: string, description: 'Внешний объект последней квитанции; пусто = неизвестно — слово не выдумывается' }
        external_object_version: { type: string }
        external_object_time: { type: string, description: 'RFC3339 момента внешнего объекта; отсутствует = unknown' }
        owning_system: { type: string, description: 'Слово системы-владельца (словарь 2-7)' }
        observations:
          type: array
          description: 'Пины supporting-observations превью (bounded 8)'
          items: { $ref: '#/components/schemas/RecoveryObservationPinView' }
    RecoveryCaseView:
      type: object
      additionalProperties: false
      required: [recovery_case_id, recovery_case_no, operation_id, case_id, work_item_id, definition_id, definition_version, trigger, trigger_text, state, state_text, assignment, deadline_at, links, events, payments_unknown_text, local_projection_text, created_at]
      description: 'Карточка Recovery Case (FR-38): SAFE-пины + ЖИВАЯ деривация цепочки квитанций/попыток/внешнего состояния (карточка всегда свежая — замороженный bundle не переписывается, AC-10); назначение живыми чтениями момента создания; honest-границы словами (платежи unknown AG-4; локальная проекция — не актуальное внешнее состояние: актуальность подтверждается сверкой 3-7); материал НИКОГДА (AC-9)'
      properties:
        recovery_case_id: { type: string, format: uuid }
        recovery_case_no: { type: integer, minimum: 1, description: 'Монотонный номер кейса тенента (coalesce(max)+1 под advisory-замком)' }
        operation_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid, description: 'Пин исходного кейса (без FK — транспортная политика AD-2)' }
        work_item_id: { type: string, format: uuid }
        definition_id: { type: string }
        definition_version: { type: string }
        trigger: { $ref: '#/components/schemas/RecoveryTriggerWord' }
        trigger_text: { type: string, description: 'Фиксированный текст триггера (тексты домена)' }
        state: { $ref: '#/components/schemas/RecoveryCaseStateWord' }
        state_text: { type: string, description: 'Честный текст состояния (open — закрытие будущим срезом)' }
        assignment: { $ref: '#/components/schemas/RecoveryAssignmentView' }
        deadline_at: { type: string, format: date-time, description: 'Материализованный дедлайн: момент создания + ack-минуты покрытия' }
        links: { $ref: '#/components/schemas/RecoveryLinksView' }
        events:
          type: array
          description: 'Append-only история кейса {created, evidence_appended}'
          items: { $ref: '#/components/schemas/RecoveryEventView' }
        payments_unknown_text: { type: string, description: 'Честное слово: платёжные системы не подключены (AG-4) — ни успех, ни отказ не выдумываются' }
        local_projection_text: { type: string, description: 'Честное слово: локальная проекция — не актуальное внешнее состояние (актуальность подтверждается сверкой 3-7)' }
        created_at: { type: string, format: date-time }
    RecoveryCreateResultView:
      type: object
      additionalProperties: false
      required: [decision, text, recovery_case]
      description: 'Честный ответ команды создания: слово решения (created/idempotent/evidence) с фиксированным текстом + карточка кейса (существующий на повторах)'
      properties:
        decision: { $ref: '#/components/schemas/RecoveryDecisionWord' }
        text: { type: string, description: 'Фиксированный honest-текст исхода (тексты домена)' }
        recovery_case: { $ref: '#/components/schemas/RecoveryCaseView' }
    RecoveryActionView:
      type: object
      additionalProperties: false
      required: [kind, state, state_text, scope_text, eligibility_rule_text, required_facts_text, authority_text, confirmation_required]
      description: 'ОДИН вид recovery action policy (3-9, AC-2 дословно): DECLARED compile-time атрибуты вида (scope/eligibility/требуемые факты/authority/Confirmation) + read-time состояние {allowed/blocked/human_only} с honest-словом причины; состояние НИКОГДА не обещает успех действия (политика — граница права, не план исполнения); состояние не хранится — каждый запрос выводит заново (идемпотентность выводом)'
      properties:
        kind: { $ref: '#/components/schemas/RecoveryActionKindWord' }
        state: { $ref: '#/components/schemas/RecoveryActionStateWord' }
        state_text: { type: string, description: 'Honest-слово причины состояния (paused — ТОЧНОЕ слово scoped control режима+причины; fail-closed — нечитаемое определение/контроль, семантика не объявлена, вариантов нет; AG-4 — сверка не подключена в статусном слове)' }
        scope_text: { type: string, description: 'Область действия слова (compile-time константа вида)' }
        eligibility_rule_text: { type: string, description: 'Read-time правило вывода (compile-time константа вида)' }
        required_facts_text: { type: string, description: 'Требуемые записанные факты вида (compile-time константа)' }
        authority_text: { type: string, description: 'Чьё право: operator manage / человек' }
        confirmation_required: { type: boolean, description: 'Материальные виды true («требует отдельного явного подтверждения» — AC-13 минимум); read-only false' }
    RecoveryHumanOnlyDecisionView:
      type: object
      additionalProperties: false
      required: [kind, boundary_text]
      description: 'ОДНО human-only решение (3-9, AC-1 — класс перечислен ОТДЕЛЬНО от разрешённого набора): слова границы PRD FR-39 дословно; решения только человек — система не исполняет, не готовит и не подтверждает их'
      properties:
        kind: { $ref: '#/components/schemas/RecoveryHumanOnlyWord' }
        boundary_text: { type: string, description: 'Текст границы: «Только человек — …» (PRD FR-39 последствия)' }
    RecoveryPolicyView:
      type: object
      additionalProperties: false
      required: [recovery_case_id, actions, human_only_decisions, human_only_class_text]
      description: 'READ-TIME recovery action policy ОДНОГО кейса (3-9, FR-39): чистый вывод над живыми чтениями (кейс/факты/каталог/controls/AG-4) — НИ ОДНОЙ записи, НИ одного сетевого вызова, повторный запрос = тот же вывод байт-стабильно; «текст модели не добавляет новый вариант» СТРУКТУРНО (генеративного пути нет — AI Runtime отсутствует AG-4, набор = вывод детерминированного кода); машинный вид для будущего planner (AD-7)'
      properties:
        recovery_case_id: { type: string, format: uuid }
        actions:
          type: array
          description: 'Пять видов в порядке словаря (фиксированный порядок машинного вида и секции страницы)'
          items: { $ref: '#/components/schemas/RecoveryActionView' }
        human_only_decisions:
          type: array
          description: 'Human-only класс отдельно от набора (AC-1): 2 слова с текстами границ'
          items: { $ref: '#/components/schemas/RecoveryHumanOnlyDecisionView' }
        human_only_class_text: { type: string, description: 'Класс-текст границы PRD FR-39 дословно: признание вины, юридический вывод и нестандартный возврат/компенсация требуют человека' }
    ReconciliationAttemptView:
      type: object
      additionalProperties: false
      required: [attempt_no, lease_created_at, lease_expires_at, next_eligible_at, verdict_recorded, verdict_text, correlation_id, external_object_id]
      description: 'Одна попытка сверки: write-ahead факты lease (право и момент запроса закреплены ДО сетевого вызова), материальное окно backoff (next_eligible_at), честное слово вердикта КОГДА записано (словарь 4) и слово resting-состояния когда нет'
      properties:
        attempt_no: { type: integer, minimum: 1, maximum: 3, description: 'Монотонный номер попытки сверки (предел 3 — bounded)' }
        lease_created_at: { type: string, format: date-time, description: 'Write-ahead: право и момент запроса закреплены до вызова' }
        lease_expires_at: { type: string, format: date-time, description: 'Окно lease: timeout определения + grace' }
        next_eligible_at: { type: string, format: date-time, description: 'Материальное окно backoff: base 30000 + jitter ≤5000 — следующая команда уважает его' }
        verdict:
          description: 'Честное слово вердикта (словарь 4); отсутствует = вердикт не записан (write-ahead resting-состояние)'
          oneOf:
            - $ref: '#/components/schemas/ReconciliationVerdictWord'
        verdict_recorded: { type: boolean, description: 'false = write-ahead resting-состояние краха: ответ не попал в историю, истёкшая lease покажет восстановление' }
        verdict_text: { type: string, description: 'Честный текст вердикта / resting-состояния (тексты домена)' }
        correlation_id: { type: string, description: 'Корреляция провайдера; пусто = не выдана' }
        external_object_id: { type: string, description: 'Идентификатор внешнего объекта evidence (только committed); пусто = не выдан' }
        verdict_recorded_at: { type: string, format: date-time, description: 'Момент записи вердикта (отсутствует = не записан)' }
  responses:
    Problem:
      description: Безопасная ошибка
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
