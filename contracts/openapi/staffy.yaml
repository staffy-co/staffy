      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignHumanHandoffRequest' }
      responses:
        '201': { description: 'Раунд назначен (append-only событие, UNIQUE tenant+case+request+event_no) + карточка подтверждения назначенному', content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
