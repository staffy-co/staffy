        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgeHumanHandoffRequest' }
      responses:
        '201': { description: 'Владение передано назначенному (эпоха+1, transfer_acknowledge) + outbox case.human_acknowledged', content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '200': { description: Повтор идемпотентного ключа, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '400': { description: 'Состояние (не назначен / просрочен / закрыт) / actor не assignee / CAS-ожидание / терминальный кейс', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Гейт прав ДО стражей', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'Гонка эпохи (stale_version — проигравший подтверждения) / активная передача 2-4 (pending transfer) / command_key_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/cases/{case_id}/human-requests/decline:
