      type: object
      additionalProperties: false
      description: 'Тело запроса согласия: пин точной версии едет в пути, здесь только запрошенное окно (сервер клампит в 60..3600s — истина сервера); свободных полей НЕ существует (strict decode): уверенность модели не входит в контракт (AG-4/AC-10)'
      properties:
        lifetime_seconds: { type: integer, minimum: 0, description: 'Запрошенное окно действия в секундах; сервер ограничивает в границы 60..3600' }
    RevokeConfirmationRequest:
      type: object
      additionalProperties: false
      description: 'Тело запроса отзыва пустое: пины точной версии едут в пути, живой step-up — в сессии'
    AuthorizeOperationRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      description: 'Тело запроса авторизации: ТОЛЬКО клиентское слово повтора (FR-29 — double-click/повтор webhook/replay-задание несут ТОТ ЖЕ ключ); серверная идентичность мутации (business intent) НЕ выводится из ключа и не принимает его; свободных полей НЕ существует (strict decode: «confidence»/«assurance» = 400 — уверенность модели не заменяет Confirmation, AG-4/AC-10)'
