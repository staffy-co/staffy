        outcome: { type: string, enum: [passed, failed, expired, cancelled, ambiguous] }
        assurance_level: { type: string, enum: [none, basic, verified] }
        subject_handle: { type: string }
        evidence_event_id: { type: string, format: uuid }
        note: { type: string }
        authority_scope: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    BindingCard:
      type: object
