        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Гейт прав ДО стражей', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'Command_key_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
