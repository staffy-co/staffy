      summary: 'Отменить запрос клиента (AC-10): якорь — принятая реплика клиента-отмены ЭТОГО обращения (страж turn_ref); lifecycle обязан быть открытым (закрытый — путь возврата return_to_staffy); владелец НЕ меняется, история НЕ удаляется; режим НЕ понижается (трещотка 2-5 — выход только явный exit_mode с полномочием); append-only событие cancelled + outbox case.human_cancelled'
