openapi: 3.1.0
info:
  title: Staffy API
  version: 0.1.0
  description: >-
    Application contract behind a trusted PrincipalResolver. The external login/session
    transport is intentionally deployment-neutral and is not defined by Story 1.1.
paths:
  /v1/tenants/{tenant_id}/voice-profiles:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listVoiceProfiles
      summary: Каталог допустимых голосов и точный статус synthetic preview
      x-staffy-principal-required: true
      responses:
        '200':
          description: Tenant-scoped каталог
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles: { type: array, items: { $ref: '#/components/schemas/VoiceProfile' } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/voice:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: readVoiceVersions
      summary: Неизменяемая история голоса и словаря
      x-staffy-principal-required: true
      responses:
        '200':
          description: Версии настройки
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/VoiceVersion' } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveVoiceVersion
      summary: Сохранить новую версию голоса с CAS
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoiceCommand' }
      responses:
        '200':
          description: Новая версия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/voice/preview:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    post:
      operationId: previewVoice
      summary: Только разрешённый синтетический маршрут; ошибка capability не выдаёт аудио
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [voice_version, text, synthetic_data_confirmed]
              properties:
                voice_version: { type: integer, minimum: 1 }
                text: { type: string, minLength: 1, maxLength: 300 }
                slow: { type: boolean }
                synthetic_data_confirmed: { type: boolean, const: true, description: Explicit confirmation that this preview uses fictional test data; no automatic PII detection is performed. }
      responses:
        '200':
          description: Синтетическое аудио с точным текстом и версиями
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoicePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/voice/assessments:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: readVoiceAssessments
      summary: Оценки точных synthetic preview со статусом stale
      x-staffy-principal-required: true
      responses:
        '200':
          description: Tenant-scoped оценки
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessments: { type: array, items: { $ref: '#/components/schemas/VoiceAssessment' } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: assessVoicePreview
      summary: Оценить конкретный успешный preview текущей версии
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preview_id, voice_version, verdict]
              properties:
                preview_id: { type: string, format: uuid }
                voice_version: { type: integer, minimum: 1 }
                verdict: { type: string, enum: [approved, needs_revision] }
      responses:
        '200':
          description: Неизменяемая оценка; телефонное качество всё ещё требует человека
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceAssessment' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/behavior:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: readBehaviorVersions
      summary: Неизменяемая история поведения черновика
      x-staffy-principal-required: true
      responses:
        '200':
          description: Tenant-scoped версии поведения
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/BehaviorVersion' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveBehaviorVersion
      summary: Сохранить новую версию безопасного поведения
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BehaviorCommand' }
      responses:
        '200':
          description: Новая версия черновика; публикация не изменяется
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BehaviorVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/behavior/preview:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    post:
      operationId: previewBehavior
      summary: Синтетическая проверка правил и claims без внешних действий
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BehaviorCommand' }
      responses:
        '200':
          description: Режим, claims, блокеры и human fallback; всегда не publishable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BehaviorPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: listKnowledgeSources
      summary: Список источников знаний черновика
      x-staffy-principal-required: true
      responses:
        '200': { description: Tenant-scoped источники и состояние актуальности }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createKnowledgeSource
      summary: Создать источник в состоянии processing после выбора Domain Pack
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeSourceCreate' }
      responses:
        '201': { description: Источник создан; содержимое ещё не обработано }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/ingest:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    post:
      operationId: ingestKnowledgeSource
      summary: Зарегистрировать HTTPS-страницу или TXT/PDF; синтетическую фикстуру поставить в processing
      description: Реальная страница остаётся в карантине без сетевого запроса. Реальный файл не сохраняется и получает failed с требованием повторной загрузки после появления scanner и safe extraction. Синтетический источник переходит из processing в непубликуемый preview только через отдельный вызов ingest-fixture. MIME клиента не является основанием для допуска. Файл до 2 МиБ; TXT UTF-8 до 256 КиБ; одна публичная HTTPS-страница.
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeIngest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/KnowledgeIngestMultipart' }
      responses:
        '201': { description: Источник в quarantined, failed или синтетическом processing; publishable=false }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readKnowledgeSource
      summary: Просмотреть provenance и неизменяемые версии с фрагментами
      x-staffy-principal-required: true
      responses:
        '200': { description: Источник и версии с текстом, checksum и position }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}/process:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: processKnowledgeSource
      summary: Обработать допустимый UTF-8 текст до 256 КиБ
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, text]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                text: { type: string, maxLength: 262144 }
      responses:
        '200': { description: Текущая или новая immutable версия; replay при том же checksum }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}/ingest-fixture:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reingestSyntheticKnowledgeSource
      summary: Повторно извлечь встроенную синтетическую фикстуру, сохраняя CAS и версии
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, fixture_id]
              properties:
                version: { type: integer, minimum: 1 }
                fixture_id: { type: string, enum: [sample-v1, sample-v2] }
      responses:
        '200': { description: Replay при прежнем тексте или новая immutable версия; publishable=false }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}/conflict:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: markKnowledgeConflict
      summary: Отметить конфликт с сохранением обоих provenance
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, note, provenance]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                note: { type: string }
                provenance: { type: string }
      responses:
        '200': { description: Блокирующий конфликт }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}/retire:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retireKnowledgeSource
      summary: Вывести источник из эксплуатации
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Источник retired и исключён из будущего использования }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/domain-packs:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listDomainPacks
      summary: Каталог reference packs для настройки
      x-staffy-principal-required: true
      responses:
        '200':
          description: Доступные версии и требования
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain_packs: { type: array, items: { $ref: '#/components/schemas/DomainPackManifest' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/domain-pack/preview:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    post:
      operationId: previewDomainPackChange
      summary: Посмотреть последствия смены закреплённой версии
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainPackCommand' }
      responses:
        '200':
          description: Разница и зависимые слоты без изменения pin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainPackPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/domain-pack:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    put:
      operationId: pinDomainPack
      summary: Закрепить точную версию и разрешённые варианты
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainPackCommand' }
      responses:
        '200':
          description: Неопубликованный черновик и план
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listEmployees
      summary: Список черновиков ИИ-сотрудников
      x-staffy-principal-required: true
      responses:
        '200':
          description: Черновики Tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees: { type: array, items: { $ref: '#/components/schemas/EmployeeDraft' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createEmployee
      summary: Создать неопубликованный черновик
      x-staffy-principal-required: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 120, description: Необязательное начальное имя черновика }
      responses:
        '201':
          description: Черновик создан или воспроизведён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: readEmployee
      summary: Открыть черновик и план запуска
      x-staffy-principal-required: true
      responses:
        '200':
          description: Черновик и план
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithPlan' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/brief:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    patch:
      operationId: saveEmployeeBrief
      summary: Сохранить Brief с ожидаемой версией
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, brief]
              properties:
                version: { type: integer, minimum: 1 }
                brief: { $ref: '#/components/schemas/EmployeeBrief' }
      responses:
        '200':
          description: Сохранённый черновик и план
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/members:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listMembers
      summary: Список участников Tenant для Owner
      x-staffy-principal-required: true
      responses:
        '200':
          description: Участники и ожидающие приглашения
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      operationId: inviteMember
      summary: Создать или обновить приглашение
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteInput' }
      responses:
        '201':
          description: Новая одноразовая ссылка
          content:
            application/json:
              schema:
                type: object
                required: [membership, invitation_url]
                properties:
                  membership: { $ref: '#/components/schemas/Membership' }
                  invitation_url: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Принять приглашение подтверждённым адресом
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Активное membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/members/{principal_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: principal_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeMember
      summary: Изменить роли и области с повторным подтверждением
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeInput' }
      responses:
        '200':
          description: Изменённое membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: revokeMember
      summary: Отозвать доступ с повторным подтверждением
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { $ref: '#/components/schemas/RevokeReason' }
      responses:
        '204': { description: Доступ отозван }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants:
    post:
      operationId: createTenant
      summary: Создать изолированное пространство Tenant
      description: Требует principal, проверенный доверенным PrincipalResolver до вызова application API.
      x-staffy-principal-required: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
        - in: header
          name: X-Correlation-ID
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
      responses:
        '201':
          description: Tenant создан либо идемпотентно воспроизведён
          headers:
            Location: { schema: { type: string } }
            Idempotency-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    EmployeeID:
      name: employee_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    VoiceProfile:
      type: object
      required: [id, language, styles, min_tempo, max_tempo, preview_status, restrictions]
      properties:
        id: { type: string }
        language: { type: string }
        styles: { type: array, items: { type: string } }
        min_tempo: { type: integer }
        max_tempo: { type: integer }
        preview_status: { type: string, enum: [available, unavailable] }
        restrictions: { type: array, items: { type: string } }
    Pronunciation:
      type: object
      additionalProperties: false
      required: [written, language, scope, normalized, test_phrase, support_status, critical_kind, synthetic_data_confirmed]
      properties:
        written: { type: string, maxLength: 120 }
        language: { type: string }
        scope: { type: string }
        normalized: { type: string, maxLength: 240 }
        test_phrase: { type: string, maxLength: 300 }
        support_status: { type: string, enum: [unverified, unsupported] }
        critical_kind: { type: string, enum: [none, vin, oem, article, phone, address, date, amount, pack] }
        synthetic_data_confirmed: { type: boolean, const: true, description: Explicit confirmation that this entry uses fictional test data; no automatic PII detection is performed. }
        readback: { $ref: '#/components/schemas/ReadbackPlan' }
        phone_quality_approved: { type: boolean, const: false }
    ReadbackPlan:
      type: object
      additionalProperties: false
      required: [segments, confirmation, on_mismatch, phone_quality_gate]
      properties:
        segments: { type: array, minItems: 2, maxItems: 60, items: { type: string, minLength: 1, maxLength: 32 } }
        confirmation: { type: string, const: ask_customer }
        on_mismatch: { type: string, const: human_handoff }
        phone_quality_gate: { type: string, const: pending_human }
    VoiceConfig:
      type: object
      additionalProperties: false
      required: [profile_id, language, style, tempo, dictionary]
      properties:
        profile_id: { type: string }
        language: { type: string }
        style: { type: string }
        tempo: { type: integer }
        dictionary: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Pronunciation' } }
    VoiceCommand:
      type: object
      additionalProperties: false
      required: [version, config, change_summary]
      properties:
        version: { type: integer, minimum: 1 }
        config: { $ref: '#/components/schemas/VoiceConfig' }
        change_summary: { type: string, minLength: 1, maxLength: 300 }
    VoiceVersion:
      type: object
      required: [tenant_id, employee_id, version, draft_version, config, actor_id, changed_at, change_summary]
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        version: { type: integer }
        draft_version: { type: integer }
        config: { $ref: '#/components/schemas/VoiceConfig' }
        actor_id: { type: string, format: uuid }
        changed_at: { type: string, format: date-time }
        change_summary: { type: string }
    VoicePreview:
      type: object
      required: [text, synthesis_text, voice_version, dictionary_version, draft_version, route, capability, phone_quality_approved, stale]
      properties:
        text: { type: string }
        synthesis_text: { type: string }
        preview_id: { type: string, format: uuid }
        voice_version: { type: integer }
        dictionary_version: { type: integer }
        draft_version: { type: integer }
        route: { type: string, const: offline-test-tts }
        capability: { type: string }
        audio: { type: string, format: byte }
        audio_type: { type: string }
        phone_quality_approved: { type: boolean, const: false }
        stale: { type: boolean }
    VoiceAssessment:
      type: object
      required: [tenant_id, employee_id, preview_id, voice_version, dictionary_version, draft_version, text, synthesis_text, route, actor_id, created_at, assessment_id, verdict, assessed_by, assessed_at, stale, phone_quality_approved]
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        preview_id: { type: string, format: uuid }
        voice_version: { type: integer }
        dictionary_version: { type: integer }
        draft_version: { type: integer }
        text: { type: string }
        synthesis_text: { type: string }
        route: { type: string, const: offline-test-tts }
        slow: { type: boolean }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        assessment_id: { type: string, format: uuid }
        verdict: { type: string, enum: [approved, needs_revision] }
        assessed_by: { type: string, format: uuid }
        assessed_at: { type: string, format: date-time }
        stale: { type: boolean }
        phone_quality_approved: { type: boolean, const: false }
    BehaviorCommand:
      type: object
      additionalProperties: false
      required: [version, config, change_summary]
      properties:
        version: { type: integer, minimum: 1 }
        change_summary: { type: string, minLength: 1, maxLength: 300 }
        scenario: { type: string, enum: [general, refusal, no_contact, safety, human_requested, business_action], description: Только синтетический preview }
        pack_id: { type: string, description: Закреплённый пакет, для которого подготовлена настройка }
        pack_version: { type: string, description: Версия закреплённого пакета }
        config: { $ref: '#/components/schemas/Behavior' }
    BehaviorVersion:
      type: object
      required: [tenant_id, employee_id, version, draft_version, pack_id, pack_version, config, actor_id, changed_at, change_summary]
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        version: { type: integer }
        draft_version: { type: integer }
        pack_id: { type: string }
        pack_version: { type: string }
        config: { $ref: '#/components/schemas/Behavior' }
        actor_id: { type: string, format: uuid }
        changed_at: { type: string, format: date-time }
        change_summary: { type: string }
    BehaviorPreview:
      type: object
      required: [mode, claims, blockers, handoff, synthetic_only, publishable]
      properties:
        mode: { type: string, enum: [answer, intake, blocked] }
        claims: { type: array, items: { $ref: '#/components/schemas/AllowedClaim' } }
        blockers: { type: array, items: { type: string } }
        handoff: { type: string }
        synthetic_only: { type: boolean, const: true }
        publishable: { type: boolean, const: false }
    Behavior:
      type: object
      additionalProperties: false
      required: [role, purpose, ai_disclosure, tone, modes, allowed_claims, forbidden_phrases, confirmation, handoff, examples]
      properties:
        role: { type: string, minLength: 1, maxLength: 160 }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        ai_disclosure: { type: boolean, const: true }
        tone: { type: string, enum: [neutral, warm, formal] }
        modes: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { type: string, enum: [answer, intake, sales, handoff] } }
        allowed_claims: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/AllowedClaim' } }
        forbidden_phrases: { type: array, maxItems: 20, items: { type: string, maxLength: 300 } }
        confirmation: { type: string, const: required }
        handoff: { type: string, const: required }
        examples: { type: array, maxItems: 8, items: { type: string, maxLength: 300 } }
    AllowedClaim:
      type: object
      additionalProperties: false
      required: [text, owner, scope, channels, modes]
      properties:
        text: { type: string, minLength: 1, maxLength: 300 }
        owner: { type: string, minLength: 1, maxLength: 160 }
        scope: { type: string, minLength: 1, maxLength: 160 }
        channels: { type: array, minItems: 1, items: { type: string } }
        modes: { type: array, minItems: 1, items: { type: string, enum: [answer, intake, sales, handoff] } }
        evidence_source_id: { type: string, format: uuid }
        evidence_version: { type: integer, minimum: 1 }
        review_at: { type: string, format: date-time }
        status: { type: string, readOnly: true, const: blocked }
        block_reason: { type: string, readOnly: true }
    KnowledgeSourceCreate:
      type: object
      additionalProperties: false
      required: [type, title, owner, provenance, scope, priority, language]
      properties:
        type: { type: string, enum: [faq, regulation, dialogue] }
        title: { type: string, minLength: 1, maxLength: 160 }
        owner: { type: string, minLength: 1, maxLength: 160 }
        provenance: { type: string, minLength: 1, maxLength: 500 }
        scope: { type: string, minLength: 1, maxLength: 160 }
        priority: { type: integer, minimum: 0, maximum: 100 }
        language: { type: string, minLength: 2, maxLength: 32 }
        fresh_until: { type: string, format: date-time }
    KnowledgeIngest:
      type: object
      additionalProperties: false
      required: [type, title, owner, provenance, scope, priority, language]
      properties:
        type: { type: string, enum: [website, document] }
        title: { type: string, minLength: 1, maxLength: 160 }
        owner: { type: string, minLength: 1, maxLength: 160 }
        provenance: { type: string, minLength: 1, maxLength: 500 }
        scope: { type: string, minLength: 1, maxLength: 160 }
        priority: { type: integer, minimum: 0, maximum: 100 }
        language: { type: string, minLength: 2, maxLength: 32 }
        url: { type: string, format: uri, maxLength: 2048 }
        fixture: { type: boolean, description: Встроенный синтетический текст; произвольный payload не принимается }
    KnowledgeIngestMultipart:
      type: object
      additionalProperties: false
      required: [type, title, owner, provenance, scope, priority, language]
      properties:
        type: { type: string, enum: [website, document] }
        title: { type: string, minLength: 1, maxLength: 160 }
        owner: { type: string, minLength: 1, maxLength: 160 }
        provenance: { type: string, minLength: 1, maxLength: 500 }
        scope: { type: string, minLength: 1, maxLength: 160 }
        priority: { type: integer, minimum: 0, maximum: 100 }
        language: { type: string, minLength: 2, maxLength: 32 }
        url: { type: string, format: uri, maxLength: 2048 }
        fixture: { type: boolean }
        file: { type: string, format: binary }
    EmployeeBrief:
      type: object
      additionalProperties: false
      required: [purpose, name, languages, time_zone, working_hours, desired_channels, primary_tasks]
      properties:
        purpose: { type: string, minLength: 1, maxLength: 500 }
        name: { type: string, minLength: 1, maxLength: 120 }
        languages: { type: array, minItems: 1, maxItems: 12, items: { type: string } }
        time_zone: { type: string }
        working_hours:
          type: object
          additionalProperties: false
          required: [days, start, end]
          properties:
            days: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }
            start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        desired_channels: { type: array, uniqueItems: true, description: Желание без подтверждения capability или подключения, items: { type: string, enum: [phone, web_chat, telegram, whatsapp, email, max, jivo, avito, mobile_app_chat] } }
        primary_tasks: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
    DomainPackPin:
      type: object
      required: [id, version, variants]
      properties:
        id: { type: string }
        version: { type: string }
        variants: { type: object }
    DomainPackManifest:
      type: object
      required: [id, version, name, purpose, support_status, stage, connector_types, journeys, critical_entities, policies, capabilities, gates, schema, policy_ref, knowledge_ref, eval_ref]
      properties:
        id: { type: string }
        version: { type: string }
        name: { type: string }
        purpose: { type: string }
        support_status: { type: string }
        stage: { type: string, const: setup }
        connector_types: { type: array, items: { type: string } }
        journeys: { type: array, items: { type: string } }
        critical_entities: { type: array, items: { type: string } }
        policies: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        gates: { type: array, items: { type: string } }
        schema: { type: object }
        at_least_one_of: { type: array, items: { type: string } }
        policy_ref: { type: string }
        knowledge_ref: { type: string }
        eval_ref: { type: string }
        upgrade_from: { type: object }
    DomainPackCommand:
      type: object
      additionalProperties: false
      required: [version, pack_id, pack_version, variants]
      properties:
        version: { type: integer, minimum: 1 }
        pack_id: { type: string }
        pack_version: { type: string }
        variants: { type: object }
        confirmed: { type: boolean }
    DomainPackPreview:
      type: object
      required: [current, target, impact]
      properties:
        current: { $ref: '#/components/schemas/DomainPackPin' }
        target: { $ref: '#/components/schemas/DomainPackManifest' }
        impact:
          type: object
          required: [compatibility, changed, review_slots]
          properties:
            compatibility: { type: string }
            changed: { type: array, items: { type: string } }
            review_slots: { type: array, items: { type: string } }
    EmployeeDraft:
      type: object
      required: [tenant_id, employee_id, owner_id, status, readiness, version, current_step, brief, created_at, updated_at]
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        status: { type: string, const: draft }
        readiness: { type: string, const: incomplete }
        version: { type: integer, minimum: 1 }
        current_step: { type: string, enum: [brief, launch_plan] }
        brief:
          type: object
          description: Подтверждённо сохранённые поля или пустой незавершённый Brief
          properties:
            purpose: { type: string }
            name: { type: string }
            languages: { type: array, items: { type: string } }
            time_zone: { type: string }
            working_hours:
              type: object
              properties:
                days: { type: array, items: { type: string } }
                start: { type: string }
                end: { type: string }
            desired_channels: { type: array, items: { type: string } }
            primary_tasks: { type: array, items: { type: string } }
        domain_pack: { $ref: '#/components/schemas/DomainPackPin' }
        review_slots: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EmployeeWithPlan:
      type: object
      required: [employee, launch_plan]
      properties:
        employee: { $ref: '#/components/schemas/EmployeeDraft' }
        launch_plan:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [complete, incomplete, blocked] }
              reason: { type: string }
    Role: { type: string, enum: [owner, configurator, operator, expert_qa, integration_admin] }
    Scope: { type: string, enum: [configuration, integrations, operations, review, technical_expertise, claims, audit] }
    ChangeReason: { type: string, enum: [access_adjustment, security_response] }
    RevokeReason: { type: string, enum: [offboarding, security_response] }
    Membership:
      type: object
      required: [tenant_id, roles, scopes, status, version]
      properties:
        tenant_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        status: { type: string, enum: [pending, expired, active, revoked] }
        version: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
    InviteInput:
      type: object
      additionalProperties: false
      required: [email, roles, scopes]
      properties:
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
    ChangeInput:
      type: object
      additionalProperties: false
      required: [roles, scopes, version, reason]
      properties:
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        version: { type: integer, minimum: 1 }
        reason: { $ref: '#/components/schemas/ChangeReason' }
    TenantCreated:
      type: object
      additionalProperties: false
      required: [tenant_id, name, role, workspace_url]
      properties:
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, const: Owner }
        workspace_url: { type: string }
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string, format: uuid }
        retryable: { type: boolean }
        field_errors: { type: object, additionalProperties: { type: string } }
  responses:
    Problem:
      description: Безопасная ошибка
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
