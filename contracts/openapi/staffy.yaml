        '400': { description: 'Состояние lifecycle (закрыт/нет запроса) / assignee не участник / роль вне целевых / дедлайн чужим словом / терминальный кейс', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Гейт прав ДО стражей', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'Тот же ключ с иным материалом — command_key_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/cases/{case_id}/human-requests/acknowledgement:
