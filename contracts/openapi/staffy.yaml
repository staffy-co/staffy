    PreviewSnapshotStatus:
      type: string
      enum: [fresh, stale, conflicting, unknown, allowed_uncertain]
      description: 'ПЯТЬ слов snapshot: первые четыре от ридера, allowed_uncertain — ТОЛЬКО по явному объявлению определения (никогда из молчания)'
    PreviewReadiness:
      type: string
