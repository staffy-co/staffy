        '403': { description: 'Скоуп словами', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Не-участник / версия не найдена', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
