        '403': { description: 'Policy-гейт точным словом причины ДО транзакции; fail-closed nil-ридер «свежие данные владеющей системы недоступны» (AG-4); скоуп review|configuration', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Не-участник / мёртвые пины — ДО материала', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'Лестница отвержений ТОЧНЫМ словом (confirmation_superseded / confirmation_revoked / confirmation_expired / confirmation_exhausted — БЕЗ потребления, видимое событие authorization_blocked); конфликт идемпотентности (тот же ключ, другой материал — событие authorization_conflict видно владельцу); изменённая Confirmation (digest разошёлся); freshness честной причиной словарём 3-4; материальное условие изменилось; лестница версий двинулась параллельным прогоном', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/operations/drain:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      operationId: drainOperations
      summary: 'Дренировать очередь отправок Operations (3-6, операторная команда manage — прецедент external-commitments/drain 3-3, демона НЕТ): bounded-батч до доменного предела 100, каждое задание проходит ordered execute-time фенции (job-schema/fingerprint alarm → lease/fencing классификация → confirmation-fence {superseded, revoked, expired} БЕЗ exhausted → кейс/work_item живость → freshness словарём 3-4 → readiness → LIVE policy → материал последним); ЛЮБАЯ граница = dispatch_blocked с ТОЧНЫМ словом причины БЕЗ ложного failed externally (операция припаркована authorized); каждая рассмотренная строка отчёта говорит своим словом (FR-28); production nil-адаптер = честный отказ 403 словами AG-4 — очередь не тронута, отправок ноль'
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrainOperationsRequest' }
      responses:
        '201': { description: 'Отчёт прогона существует: счётчики considered/dispatched/blocked/skipped + построчные честные слова (парковки с точными причинами, racing/replay/alarm пропуски)', content: { application/json: { schema: { type: object, required: [drain], properties: { drain: { $ref: '#/components/schemas/DispatchDrainResultView' } } } } } }
        '400': { description: 'Строгий decode пустого тела: свободное поле = 400 — параметров drain не существует (bounded операторная команда)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AG-4 честный отказ nil-адаптера словами («исполнение не подключено — очередь не тронута, отправок ноль»); скоуп operations словами ДО чтения очереди', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Не-участник тенента — поверхность не раскрывается', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/operations/reconcile:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      operationId: reconcileOperations
      summary: 'Сверка unknown-операций (3-7, операторная команда manage — прецедент drain 3-3/3-6, демона НЕТ): bounded-батч до доменного предела 100 pending-целей (операция unknown выводом ledger: последняя версия квитанции unknown), каждая цель проходит лёгкую read-only лестницу фенций (классификация racing/exhausted/decided/waiting честными строками БЕЗ права → fingerprint integrity alarm → сверка объявлена ОБЕ половины — LIVE-слово декларации коннектора + ReconciliationQuery определения, голый 404 = no_answer → paused control живым чтением scoped controls → ServesCapability-гейт); ЛЮБАЯ фенция = honest-строка отчёта, запрос НЕ сделан, lease НЕ взята, операция остаётся при своей квитанции; зелёный путь: reconciliation lease write-ahead (attempt 1..3, fencing-токен, окно timeout+grace, backoff+jitter записан) + ledger reconciling НЕ state-bearing → запрос ЕДИНСТВЕННЫЙ раз вне транзакций (внешний idempotency key тот же что отправка, correlation последней dispatch-попытки, keyed digest — сырой материал НИКОГДА) → нормализация fail-closed → терминальный замок ДО записи (alarm человеку / skip подтверждения / append квитанции v2+) → fenced-запись вердикта; вердикты {committed с evidence-тройником, no_effect при объявленной семантике, in_progress, no_answer}; production nil-адаптер = честный отказ 403 словами AG-4 — очередь сверки не тронута, запросов ноль'
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileOperationsRequest' }
      responses:
        '201': { description: 'Отчёт прогона существует: счётчики considered/queried/decided/skipped + построчные честные слова (записанные вердикты, фенции без права, гонки, тревоги терминального замка)', content: { application/json: { schema: { type: object, required: [reconcile], properties: { reconcile: { $ref: '#/components/schemas/ReconcileResultView' } } } } } }
        '400': { description: 'Строгий decode пустого тела: свободное поле = 400 — параметров reconcile не существует (bounded операторная команда)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AG-4 честный отказ nil-адаптера словами («сверка не подключена — реальных систем-владельцев нет: очередь сверки не тронута, запросов ноль»); скоуп operations словами ДО чтения целей', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Не-участник тенента — поверхность не раскрывается', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/operations/{operation_id}/recovery-case:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      operationId: createRecoveryCase
      summary: 'Создать связанный Recovery Case (3-8, операторная команда manage — прецедент drain/reconcile, демона НЕТ): read-time eligibility-лестница по ЗАПИСАННОМУ {unknown + сверка исчерпана 3/3 | unknown + сверка недоступна (не объявлена ИЛИ AG-4 nil — production-путь: человек обязателен) | failed + повтора нет (попытки 3/3 либо политика без retry-права)}; ЛЮБОЙ газ = честный отказ 403 словом ДО записи (committed «восстановление не требуется» / в-исполнении «операция ещё в исполнении» / не-исчерпана «сначала контур сверки 3-7» / повтор-доступен «восстановление преждевременно»); назначение ТОЛЬКО живыми чтениями (владелец = текущий терм Ownership исходного кейса, backup/дедлайн = human coverage маршрута исходной conversation — слова НИКОГДА из параметров команды; непрочитанное покрытие или владелец-без-термов = честный fail-closed 403, кейс НЕ создаётся); назначение живыми чтениями — AC-1; кейс НАВСЕГДА один на операцию (keyed-HMAC recovery_key:v1: + UNIQUE (tenant, operation) — ацикличность без parent-колонки, AC-6); повтор команды = идемпотентный возврат существующего кейса (200, слово, второй строки НЕТ — AC-5), digest-дельта (позднее terminal evidence контуром 3-7) = ОДНА append-only строка evidence_appended с SAFE-дельтой (исходный bundle и квитанции НЕ переписываются — AC-10-минимум); создание ОДНОЙ транзакцией (номер coalesce(max)+1 под advisory-замком + событие created + outbox recovery_case.created); НИ ОДНОГО сетевого вызова в команде (контур локален — сеть остаётся в 3-6/3-7); SAFE link-bundle пинов точных версий — материал НИКОГДА (AD-10/AC-9)'
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryCreateRequest' }
      responses:
        '201': { description: 'Recovery Case создан: назначение живыми чтениями, SAFE-пины точных версий, событие created + outbox recovery_case.created — исходные записи не переписаны', content: { application/json: { schema: { type: object, required: [recovery_case], properties: { recovery_case: { $ref: '#/components/schemas/RecoveryCreateResultView' } } } } } }
        '200': { description: 'Повтор команды: идемпотентный возврат существующего кейса (второй строки и события НЕТ) ИЛИ дельта-доказательств (ОДНА append-only строка evidence_appended с SAFE-дельтой)', content: { application/json: { schema: { type: object, required: [recovery_case], properties: { recovery_case: { $ref: '#/components/schemas/RecoveryCreateResultView' } } } } } }
        '400': { description: 'Строгий decode пустого тела: свободное поле = 400 — параметров команды не существует (слова назначения никогда из параметров)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Честные отказы СЛОВАМИ: скоуп operations ДО материала; газы лестницы eligibility {committed / в-исполнении / сверка-не-исчерпана / повтор-доступен}; fail-closed назначения {покрытие недоступно / владелец исходного кейса неизвестен} — кейс НЕ создан, ничего не записано', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Не-участник тенента либо неизвестная операция — поверхность не раскрывается (membership-404 ДО материала)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/recovery-cases:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listRecoveryCases
      summary: 'Список Recovery Case тенента (3-8, Recovery Panel): bounded-чтение доменного предела 200, порядок по моменту создания (свежие первыми); SAFE-пины и слова — материал НИКОГДА'
      x-staffy-principal-required: true
      responses:
        '200': { description: 'Список кейсов восстановления (номер/триггер словом/владелец/backup/дедлайн/момент)', content: { application/json: { schema: { type: object, required: [recovery_cases], properties: { recovery_cases: { type: array, items: { $ref: '#/components/schemas/RecoveryCaseView' } } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Скоуп operations словами ДО чтения', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Не-участник тенента — поверхность не раскрывается', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/recovery-cases/{recovery_case_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: readRecoveryCase
      summary: 'Карточка Recovery Case (3-8): SAFE link-bundle пинов точных версий + ЖИВАЯ деривация цепочки квитанций/попыток/внешнего состояния (карточка всегда свежая — исходный bundle не переписывается, AC-10); честные unknown-слова платежей (AG-4) и локальной проекции; append-only история {created, evidence_appended}; назначение живыми чтениями момента создания'
      x-staffy-principal-required: true
      responses:
        '200': { description: 'Карточка кейса восстановления', content: { application/json: { schema: { type: object, required: [recovery_case], properties: { recovery_case: { $ref: '#/components/schemas/RecoveryCaseView' } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Скоуп operations словами ДО чтения', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Не-участник либо неизвестный кейс — поверхность не раскрывается', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/recovery-cases/{recovery_case_id}/policy:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: readRecoveryCasePolicy
      summary: 'READ-TIME recovery action policy ОДНОГО кейса (3-9, FR-39): вывод разрешённого набора видов 5 с DECLARED атрибутами AC-2 + состояния {allowed/blocked/human_only} honest-словами + human-only класс 2 ОТДЕЛЬНО (AC-1); НИ ОДНОЙ записи (идемпотентность выводом — повторный запрос = тот же вывод), НИ одного сетевого вызова (AG-4, reflect-зонд); пустое GET без тела — 400 НЕ возвращается'
      x-staffy-principal-required: true
      responses:
        '200': { description: 'Политика разрешённых действий кейса (5 видов + human-only класс 2)', content: { application/json: { schema: { type: object, required: [recovery_policy], properties: { recovery_policy: { $ref: '#/components/schemas/RecoveryPolicyView' } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Скоуп operations словами ДО чтения (права поверхности карточки reused)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Не-участник либо неизвестный кейс — membership-404 ДО материала (прецедент 3-8)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
components:
  parameters:
    EmployeeID:
      name: employee_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseID:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkItemID:
      name: work_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FactID:
      name: fact_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BindingID:
      name: binding_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferRequestID:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DisclosureID:
      name: disclosure_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CandidateID:
      name: candidate_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Ключ команды: точный повтор возвращает сохранённый исход; тот же ключ с другим материалом — конфликт'
      schema: { type: string, minLength: 8, maxLength: 200 }
  schemas:
    DataClassView:
      type: object
      required: [spec, status, hold]
      properties:
        spec:
          type: object
          required: [id, title, tables]
          properties:
            id: { type: string }
            title: { type: string }
            tables: { type: array, items: { type: string } }
            executor: { type: string }
            block: { $ref: '#/components/schemas/PrivacyManagedBlock' }
            audit_min_term: { type: boolean }
        status: { type: string, enum: ['complete','incomplete','undocumented'] }
        missing: { type: array, items: { type: string } }
        entry: { $ref: '#/components/schemas/DataMapEntry' }
        policy: { $ref: '#/components/schemas/RetentionPolicy' }
        hold:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: ['none','active','requires_decision'] }
            basis: { type: string }
            approver: { type: string }
            review_deadline: { type: string, format: date-time }
        reference_time: { type: string, format: date-time, nullable: true }
        deletion_due_at: { type: string, format: date-time, nullable: true }
        mandatory_due_at: { type: string, format: date-time, nullable: true }
    DataMapEntry:
      type: object
      required: [class, version, created_at]
      properties:
        tenant_id: { type: string }
        class: { type: string }
        version: { type: integer, minimum: 1 }
        purpose: { type: string }
        legal_basis: { type: string }
        controller: { type: string }
        processor: { type: string }
        recipients: { type: array, items: { type: string } }
        sub_processors: { type: array, items: { type: string } }
        locations: { type: array, items: { type: string } }
        accessible_roles: { type: array, items: { type: string } }
        known_copies: { type: array, items: { type: string } }
        retention_policy_ref: { type: string }
        deletion_method: { type: string }
        export_method: { type: string }
        actor_id: { type: string }
        created_at: { type: string, format: date-time }
    RetentionPolicy:
      type: object
      required: [class, version, purpose, legal_basis, source, terminal_event, active_use_days, archive_days, deletion_days, backup_expiry_days, legal_hold_exception, owner_note, created_at]
      properties:
        tenant_id: { type: string }
        class: { type: string }
        version: { type: integer, minimum: 1 }
        purpose: { type: string }
        legal_basis: { type: string }
        source: { type: string, enum: ['tenant_decision','legal_requirement','contract','default'] }
        terminal_event: { type: string }
        active_use_days: { type: integer }
        archive_days: { type: integer }
        deletion_days: { type: integer }
        backup_expiry_days: { type: integer }
        legal_hold_exception: { type: string }
        owner_note: { type: string }
        actor_id: { type: string }
        created_at: { type: string, format: date-time }
    LegalHoldEvent:
      type: object
      required: [event_id, event, classes, basis, approver, review_deadline, created_at]
      properties:
        tenant_id: { type: string }
        event_id: { type: string }
        event: { type: string, enum: ['activated','released'] }
        classes: { type: array, items: { type: string } }
        basis: { type: string }
        approver: { type: string }
        review_deadline: { type: string, format: date-time }
        actor_id: { type: string }
        created_at: { type: string, format: date-time }
    LifecycleReceipt:
      type: object
      required: [receipt_id, request_id, receipt_hash, authority, policy_versions, outcomes, completed_at]
      description: Квитанция хранит только идентификаторы, счётчики и хэш-доказательство; удалённое содержимое не входит никогда.
      properties:
        tenant_id: { type: string }
        receipt_id: { type: string }
        request_id: { type: string }
        receipt_hash: { type: string }
        authority: { type: string, enum: ['data_governance'] }
        policy_versions:
          type: array
          items:
            type: object
            required: [class, version, terminal_event]
            properties:
              class: { type: string }
              version: { type: integer }
              terminal_event: { type: string }
        outcomes: { type: array, items: { $ref: '#/components/schemas/DeletionOutcome' } }
        completed_at: { type: string, format: date-time }
        actor_id: { type: string }
    DeletionOutcome:
      type: object
      required: [class, outcome, affected_count, note]
      properties:
        class: { type: string }
        outcome: { type: string, enum: ['deleted','scheduled','retained_by_law','unsupported','unknown'] }
        affected_count: { type: integer, minimum: 0 }
        due_at: { type: string, format: date-time, nullable: true }
        note: { type: string }
        block: { $ref: '#/components/schemas/PrivacyManagedBlock' }
        reconciliation_owner: { type: string }
        reconciliation_deadline: { type: string, format: date-time, nullable: true }
    PrivacyManagedBlock:
      type: object
      required: [required, gate, owner]
      properties:
        required: { type: string }
        gate: { type: string }
        owner: { type: string }
    VoiceProfile:
      type: object
      required: [id, language, styles, min_tempo, max_tempo, preview_status, restrictions]
      properties:
        id: { type: string }
        language: { type: string }
        styles: { type: array, items: { type: string } }
        min_tempo: { type: integer }
        max_tempo: { type: integer }
        preview_status: { type: string, enum: [available, unavailable] }
        restrictions: { type: array, items: { type: string } }
    Pronunciation:
      type: object
      additionalProperties: false
      required: [written, language, scope, normalized, test_phrase, support_status, critical_kind, synthetic_data_confirmed]
      properties:
        written: { type: string, maxLength: 120 }
        language: { type: string }
        scope: { type: string }
        normalized: { type: string, maxLength: 240 }
        test_phrase: { type: string, maxLength: 300 }
        support_status: { type: string, enum: [unverified, unsupported] }
        critical_kind: { type: string, enum: [none, vin, oem, article, phone, address, date, amount, pack] }
        synthetic_data_confirmed: { type: boolean, const: true, description: Explicit confirmation that this entry uses fictional test data; no automatic PII detection is performed. }
        readback: { $ref: '#/components/schemas/ReadbackPlan' }
        phone_quality_approved: { type: boolean, const: false }
    ReadbackPlan:
      type: object
      additionalProperties: false
      required: [segments, confirmation, on_mismatch, phone_quality_gate]
      properties:
        segments: { type: array, minItems: 2, maxItems: 60, items: { type: string, minLength: 1, maxLength: 32 } }
        confirmation: { type: string, const: ask_customer }
        on_mismatch: { type: string, const: human_handoff }
        phone_quality_gate: { type: string, const: pending_human }
    VoiceConfig:
      type: object
      additionalProperties: false
      required: [profile_id, language, style, tempo, dictionary]
      properties:
        profile_id: { type: string }
        language: { type: string }
