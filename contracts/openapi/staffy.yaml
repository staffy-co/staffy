        '400': { description: 'Состояние (не назначен / просрочен / закрыт) / actor не assignee / терминальный кейс', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Гейт прав ДО стражей', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'Command_key_conflict (тот же ключ с иным материалом)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
