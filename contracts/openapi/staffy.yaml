        update_promise: { type: string, enum: [no_promise, within_1h, within_4h, within_next_business_day], description: 'Обещание времени следующего обновления (Story 2.12, гейт ПОСЛЕ commitment-link 2-9 ДО записи, БЕЗклассовый): маршрут ответа деградирован → слово ОБЯЗАТЕЛЬНО ∈ словарь утверждённой policy (400 update_promise_required со словами словаря); чужое слово → 400 update_promise_foreign; здоровый маршрут → поле обязано быть пустым — контрольная ветка байт-в-байт; слово словаря ≠ расписание: дедлайн не порождается' }
        degradation_record_id: { type: string, format: uuid, description: 'Записанная ревизия деградации маршрута (Story 2.12); номер ревизии — серверная истина, в исходе не хранится' }
        degradation_cause: { type: string, enum: [timeout, disconnect, rate_limited, capability_revoked, delivery_unknown], description: 'Причина деградации маршрута; заметка НИКОГДА не входит в исход — остаётся в строке' }
        degradation_cleared: { type: boolean, description: 'Восстановление маршрута — своей ревизией' }
        delivery_evidence_id: { type: string, format: uuid, description: 'Записанное наблюдение доставки (Story 2.12); номер события — серверная истина, в исходе не хранится; content реплая НИКОГДА не входит' }
        delivery_evidence_kind: { type: string, enum: [delivered_confirmed, delivery_unknown, provider_failed], description: 'Слово наблюдения коннектора (передаёт оператор)' }
        handoff_turn_ref: { type: string, format: uuid, description: 'Якорь просьбы/отмены — принятая реплика клиента (Story 2.13); номера запроса/события — серверная истина, в исходе не хранятся' }
        handoff_assignee: { type: string, format: uuid, description: 'Назначенный специалист раунда (назначение ≠ принятие); роль резолвит сервер из участия — оператор её НЕ вводит' }
        handoff_backup: { type: string, format: uuid, description: 'Резервный участник раунда назначения' }
        handoff_ack_deadline: { type: string, enum: [ack_15m, ack_1h, ack_4h], description: 'Слово дедлайна подтверждения раунда (утверждённая policy v0)' }
        handoff_result: { type: string, enum: [issue_resolved, handed_back], description: 'Слово результата возврата; текст причины режима НИКОГДА не входит в исход' }
        summary_kind: { type: string, enum: [ai_summary], description: 'Слово вида сводки продюсерской команды (Story 2.14) — единственное слово словаря; операторские сводки Never' }
        summary_claims: { type: integer, minimum: 1, description: 'Число утверждений записи (счётчик запросного материала); текст сводки и claims НИКОГДА не входят в исход; summary_no и watermark — серверная истина, в исходе не хранятся' }
        correction_id: { type: string, format: uuid, description: 'Идентификатор записанной коррекции (Story 2.15); correction_no — серверная истина под локами, в исходе не хранится' }
        correction_outcome: { type: string, enum: [applied, disputed], description: 'Исход матричного гейта домена (СЕРВЕРНОЕ решение по material_key якоря — запрос его НЕ несёт); applied = заливка НОВОЙ версии факта без автоподтверждения, disputed = спор матричного поля без записи факта' }
        correction_spans: { type: integer, minimum: 0, description: 'Счётчик выдержек запросного материала; предложенное значение и spans НИКОГДА не входят в исход' }
        promise_id: { type: string, format: uuid, description: 'Идентификатор записанного обещания обновления (Story 2.16); promise_no — серверная истина под локами, в исходе не хранится (читается вью ожидания)' }
        promise_deadline_word: { type: string, enum: [update_15m, update_1h, update_4h, update_unknown], description: 'Слово дедлайна обещания — ЕДИНСТВЕННЫЙ материал записи (честное unknown включено); promised_at — серверная истина, в исходе НЕ хранится' }
