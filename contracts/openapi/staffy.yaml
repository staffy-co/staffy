    PreviewFreshnessReason:
      type: string
      enum: [fact_changed, observation_changed, owner_epoch_moved, control_generation_moved, release_manifest_moved, policy_changed, capability_evidence_moved]
      description: 'СЕМЬ причин AC-9 нормативным порядком: первая несовпавшая шпилька — причина; исчезнувший источник = изменение (fail-closed); stale-вывод при КАЖДОМ чтении живыми источниками, никогда не хранимый'
    PreviewPolicyReason:
