      responses:
        '201': { description: 'Наблюдение записано (append-only, UNIQUE tenant+reply+event_no) + outbox client_reply_delivery_evidence (метаданные: reply/event_no/kind/actor — без content)', content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
