      description: 'Подтверждение точной версии: субъект UNIQUE (tenant+commitment+version+subject) — повтор субъекта 409'
      properties:
        commitment_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        confirmation_id: { type: string, format: uuid }
        subject_kind: { type: string, enum: [client] }
        subject_ref: { type: string }
        method: { type: string, enum: [explicit_text] }
        channel: { type: string }
        expires_at: { type: string, format: date-time }
        consumed_count: { type: integer, minimum: 0, description: '0 в срезе (потребление — Epic 3)' }
        consumption_limit: { type: integer, minimum: 1, maximum: 10 }
        confirmed_at: { type: string, format: date-time }
    CommitmentDeclineRecord:
      type: object
      required: [commitment_id, version_no, decline_id, outcome, created_at]
      description: 'Отказ/запрос изменения (append-only, без мутаций — AC-11)'
      properties:
        commitment_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        decline_id: { type: string, format: uuid }
        outcome: { type: string, enum: [declined, change_requested] }
        created_at: { type: string, format: date-time }
    CommitmentPresentedLink:
      type: object
      required: [commitment_id, version_no]
      description: 'Связь предъявления: пара (оба-или-ни-один) в sales-reply'
      properties:
        commitment_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
    ContinuationLinkIssueRequest:
      type: object
      required: [purposes, question, explanation, participant_ref, ttl_minutes]
      additionalProperties: false
      description: 'Команда выдачи ссылки продолжения: набор целей — подмножество словаря v1 (непуст, без повторов); короткий ttl; лимит accepted-коррекций (default 1 — «ровно одна отправка» FR-16); capability-токен генерируется сервером и НИКОГДА не поле запроса'
      properties:
        link_id: { type: string, format: uuid, description: 'Идентификатор ссылки (пусто — новая ссылка)' }
        purposes: { type: array, items: { type: string, enum: [fact_correction] }, minItems: 1, description: 'Цели ссылки: словарь v1 (fact_correction); набор ⊆ словаря, непуст, без повторов' }
        question: { type: string, minLength: 1, maxLength: 500, description: 'Открытый вопрос клиенту защищённой страницы (рунами 1..500)' }
        explanation: { type: string, minLength: 1, maxLength: 1000, description: 'Объяснение перехода — зачем клиенту открыть защищённую страницу (рунами 1..1000)' }
        participant_ref: { type: string, minLength: 1, maxLength: 128, description: 'Адрес участника (канал клиента, которому вплетается URL)' }
        ttl_minutes: { type: integer, minimum: 5, maximum: 120, description: 'Срок жизни ссылки в минутах (короткоживущая: 5..120)' }
        consumption_limit: { type: integer, minimum: 1, maximum: 10, default: 1, description: 'Сколько принятых исправлений потребляет ссылка (1..10; события human/return не расходуют)' }
    ContinuationLinkRevokeRequest:
      type: object
      required: [reason]
      additionalProperties: false
      description: 'Команда отзыва ссылки: честная причина «прекратить ожидание»; строка append-only, мутаций нет'
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }
    ContinuationIssuance:
      type: object
      required: [outcome]
      description: 'Ответ выдачи: сохранённый исход команды плюс одноразовый материал возможности — url/token существуют ТОЛЬКО в первом ответе (no-store/no-referrer); replay-ответ несёт пустые url/token с честной маской: preimage невосстановим из хеша'
      properties:
        outcome: { $ref: '#/components/schemas/WorkOutcome' }
        url: { type: string, description: 'Путь публичной защищённой страницы /continue/{token} — только в свежем ответе' }
        token: { type: string, description: 'base64url(tenant 16B ‖ random 32B), 64 символа, без padding — только в свежем ответе' }
        expires_at: { type: string, format: date-time }
    ContinuationView:
      type: object
      required: [panel_text, links, uses]
      description: 'Секция «Ссылки продолжения» (Story 2.10): ссылки с read-time деривацией состояний, delivered-связкой исходящих ответов и учётом лимита + лента событий клиента; токен нигде — маска «выдан»'
      properties:
        panel_text: { type: string }
        links: { type: array, items: { $ref: '#/components/schemas/ContinuationLinkView' } }
        uses: { type: array, items: { $ref: '#/components/schemas/ContinuationUseView' } }
    ContinuationLinkView:
      type: object
      required: [link_id, work_item_id, purposes, state, delivered, accepted_uses, consumption_limit, question, participant_ref, expires_at]
      properties:
        link_id: { type: string, format: uuid }
        work_item_id: { type: string, format: uuid }
        purposes: { type: array, items: { type: string, enum: [fact_correction] } }
        state: { type: string, enum: [valid, expired, revoked, consumed, owner_stale], description: 'Read-time деривация (никогда хранимое слово): expired > revoked > consumed > owner_stale > valid' }
        delivered: { type: boolean, description: 'FR-16 «доставлена»: существование связанной sales-reply (client_replies.link_id)' }
        accepted_uses: { type: integer, minimum: 0, description: 'Принятые data-submission (исправление факта и подтверждение автомобиля Story 4.2; события human/return не считаются)' }
        consumption_limit: { type: integer, minimum: 1, maximum: 10 }
        question: { type: string }
        participant_ref: { type: string }
        expires_at: { type: string, format: date-time }
    ContinuationUseView:
      type: object
      required: [use_id, link_id, use_kind, submitted_at]
      description: 'Событие клиента ленты: исправление потребляет лимит; human/return — события без материала'
      properties:
        use_id: { type: string, format: uuid }
        link_id: { type: string, format: uuid }
        use_kind: { type: string, enum: [fact_correction_submitted, human_requested, returned_to_conversation, vehicle_confirmation_submitted], description: 'Словарь use-kind (Story 4.2: +vehicle_confirmation_submitted — SQL-зеркало миграции cases/00018); data-submission потребляют лимит, события human/return — нет' }
        fact_id: { type: string, format: uuid, description: 'Только data-submission (fact_correction_submitted / vehicle_confirmation_submitted)' }
        fact_version_no: { type: integer, minimum: 2, description: 'Номер новой неподтверждённой версии факта' }
        submitted_at: { type: string, format: date-time }
    VehiclePanelView:
      type: object
      required: [schema_defined, profile]
      additionalProperties: false
      description: 'Секция «Идентификация автомобиля» (Story 4.2): схема идентификации приходит из закреплённого пака auto-parts@3.0.0 через порт PackTaxonomy — никогда хардкод; schema_defined=false несёт честное слово отсутствия (note)'
      properties:
        schema_defined: { type: boolean }
        note: { type: string, description: 'Честное слово отсутствия схемы («Схема идентификации пака не определена…») — пусто при schema_defined=true' }
        profile: { $ref: '#/components/schemas/VehicleProfileView' }
    VehicleProfileView:
      type: object
      required: [attributes, completeness, profile_digest]
      additionalProperties: false
      description: 'Read-time профиль автомобиля (Story 4.2): вывод над append-only фактами 2-2, идемпотентный байт-стабильным JSON; ProfileDigest = SHA-256 канонического {ключ: {версия, value-digest}} подтверждённого набора — «точная версия профиля» (AC-12); подтверждение новой версией честно устаревает (AC-8); конфликт значений = conflicting — Staffy не выбирает вариант (AC-7); подтверждение НЕ разрешает заказ/внешнее действие (контур Epic 3 не активируется)'
      properties:
        attributes: { type: array, items: { $ref: '#/components/schemas/VehicleAttributeView' } }
        completeness: { $ref: '#/components/schemas/VehicleCompletenessView' }
        profile_digest: { type: string, description: 'SHA-256 hex (64 символа) подтверждённого набора' }
        stale_note: { type: string, description: 'Агрегатное слово устаревания: часть подтверждений относится к прежним версиям фактов' }
    VehicleCompletenessView:
      type: object
      required: [satisfied_by, missing_keys]
      additionalProperties: false
      description: 'Полнота по альтернативным наборам схемы пака (AC-1: любой ОДИН набор достаточен); MissingKeys — только не-confirmed (подтверждённые не перезапрашиваются, AC-2)'
      properties:
        satisfied_by: { type: array, items: { type: string }, description: 'Собранные альтернативные наборы (ключи через +)' }
        missing_keys: { type: array, items: { type: string, enum: [vehicle.vin, vehicle.make, vehicle.model, vehicle.year_of_manufacture, vehicle.trim, vehicle.engine], description: 'Материал-ключи схемы пака — enum-зеркало (drift = красный)' } }
    VehicleAttributeView:
      type: object
      required: [fact_id, material_key, label, kind, raw_value, fact_version, observed_at, received_at, source_type, channel, status]
      additionalProperties: false
      description: 'Один признак профиля: значение с полным provenance и read-time статусом 2-2; полный VIN — только операторская карточка (review) и защищённая форма клиента (FR-55); подтверждение привязано к ТОЧНОЙ версии'
      properties:
        fact_id: { type: string, format: uuid }
        material_key: { type: string, enum: [vehicle.vin, vehicle.make, vehicle.model, vehicle.year_of_manufacture, vehicle.trim, vehicle.engine], description: 'Материал-ключ схемы пака — enum-зеркало 6 слов (drift = красный)' }
        label: { type: string }
        kind: { type: string, enum: [vin, text, integer] }
        raw_value: { type: string, description: 'Исходное значение факта дословно (JSON-строка декодирована)' }
        normalized_value: { $ref: '#/components/schemas/VINNormalizationView', description: 'Только kind=vin: нормализованное представление и флаги — НИКОГДА не подменяет raw' }
        fact_version: { type: integer, minimum: 1 }
        observed_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        source_type: { type: string, enum: [channel_event, operator, connector, system] }
        channel: { type: string }
        status: { type: string, enum: [confirmed, unverified, conflicting], description: 'Read-time деривация 2-2 (DeriveFactStatus — замороженный канон)' }
        confirmation: { $ref: '#/components/schemas/VehicleConfirmationView' }
    VehicleConfirmationView:
      type: object
      required: [confirmer_type, version_no, at]
      additionalProperties: false
      description: 'Подтверждение ТОЧНОЙ версии: confirmer=client — зарезервированное слово 2-2, первый продюсер — защищённое продолжение (Story 4.2); stale_word при новой версии после подтверждения (AC-8)'
      properties:
        confirmer_type: { type: string, enum: [client, owning_system, operator_relay] }
        version_no: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        stale_word: { type: string, description: '«подтверждение относилось к прежней версии (vN)»' }
    VINNormalizationView:
      type: object
      required: [raw, normalized, length, length_ok, forbidden_chars, cyrillic_ambiguities, check_digit, words]
      additionalProperties: false
      description: 'Флаги нормализации VIN (AC-3): НИ ОДНОГО молчаливого исправления — raw сохранён дословно, normalized = trim+upper+выкид ASCII-разделителей; I/O/Q и омоглифы — флаги со словами; ISO 3779 контрольная цифра позиции 9 (Applicable честно — ложных verdicts нет)'
      properties:
        raw: { type: string }
        normalized: { type: string }
        length: { type: integer, minimum: 0 }
        length_ok: { type: boolean }
        forbidden_chars: { type: array, items: { type: integer }, description: '0-based позиции I/O/Q' }
        cyrillic_ambiguities: { type: array, items: { $ref: '#/components/schemas/VINAmbiguityView' } }
        check_digit: { $ref: '#/components/schemas/VINCheckDigitView' }
        words: { type: array, items: { type: string }, description: 'Honest-слова каждого флага текстом (AC-14)' }
    VINAmbiguityView:
      type: object
      required: [position, rune, look_alike]
      additionalProperties: false
      description: 'Кириллический омоглиф: детект БЕЗ замены — переспрос единственное честное разрешение'
      properties:
        position: { type: integer, minimum: 0 }
        rune: { type: string }
        look_alike: { type: string }
    VINCheckDigitView:
      type: object
      required: [applicable, expected, computed, match]
      additionalProperties: false
      description: 'ISO 3779: expected — хранимая позиция 9, computed — взвешенная сумма транслитерации; несовпадение = флаг + слово «сверьте посимвольно», НЕ отбрасывание'
      properties:
        applicable: { type: boolean }
        expected: { type: string }
        computed: { type: string }
        match: { type: boolean }
    DrainRepliesResult:
      type: object
      required: [considered, dispatched, stale_needs_review]
      properties:
        considered: { type: integer }
        dispatched: { type: integer }
        stale_needs_review: { type: integer }
    ProposeModeRequest:
      type: object
      required: [conversation_id, mode, scope, expected_mode_version, signal_source]
      additionalProperties: false
      properties:
        conversation_id: { type: string, format: uuid, description: 'Собственный диалог обращения (лестница режимов живёт на нём)' }
        mode: { type: string, enum: [safety, claim, cancellation, privacy_no_contact, human_requested, unclassified, sales], description: 'Предложение только поднимает: понижение невозможно как класс (GuardProposeMode отказывает)' }
        scope: { type: string, enum: [conversation, work_item] }
        work_item_id: { type: string, format: uuid, description: 'Якорь контекста задачи (обязателен для scope=work_item)' }
        expected_mode_version: { type: integer, minimum: 1, description: 'CAS-слово лестницы: сверяется под advisory-локом' }
        reason: { type: string, maxLength: 200 }
        signal_source: { type: string, enum: [turn_event, operator, policy_rule] }
        turn_ref: { type: string, format: uuid, description: 'Принятое событие кейса (обязателен для signal_source=turn_event)' }
    ExitModeRequest:
      type: object
      required: [conversation_id, mode, expected_mode_version, reason]
      additionalProperties: false
      properties:
        conversation_id: { type: string, format: uuid }
        mode: { type: string, enum: [safety, claim, cancellation, privacy_no_contact, human_requested, unclassified, sales], description: 'Цель выхода — только ниже активного; полномочие решает сервер (safety — только configuration)' }
        expected_mode_version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 200, minLength: 1, description: 'Честная причина выхода обязательна' }
    RecordDisclosureRequest:
      type: object
      required: [conversation_id, channel, text]
      additionalProperties: false
      properties:
        conversation_id: { type: string, format: uuid }
        channel: { type: string, enum: [phone, web_chat, telegram, whatsapp, email, max, jivo, avito, mobile_app_chat] }
        text: { type: string, maxLength: 2000, minLength: 1, description: 'Точный текст раскрытия: живёт только в записи' }
        parent_ref: { type: string, format: uuid, description: 'Родительская запись повторного раскрытия (после прерывания)' }
    RecordDisclosureEventRequest:
      type: object
      required: [conversation_id, kind]
      additionalProperties: false
      properties:
        conversation_id: { type: string, format: uuid }
        kind: { type: string, enum: [generated, sent, playback_acknowledged, playback_estimated, customer_confirmed, interrupted], description: 'Одно событие — один kind; последнее событие записи — её статус; interrupted гасит действие' }
    ModeView:
      type: object
      required: [ladder, terms, item_contexts, disclosures, forbidden_text, neutral_rule]
      description: 'Секция режима карточки: лестница, термины, контексты задач, записи раскрытий со статусами доставки'
      properties:
        active: { $ref: '#/components/schemas/ModeTerm' }
        ladder: { type: array, items: { type: string } }
        terms: { type: array, items: { $ref: '#/components/schemas/ModeTerm' } }
        item_contexts: { type: array, items: { type: object, required: [work_item_id, term], properties: { work_item_id: { type: string, format: uuid }, term: { $ref: '#/components/schemas/ModeTerm' } } } }
        forbidden_text: { type: string }
        neutral_rule: { type: string }
        disclosures: { type: array, items: { $ref: '#/components/schemas/DisclosureCard' } }
    AIProposalRequest:
      type: object
      required: [conversation_id, work_item_id, turn_ref, intent, proposer]
      additionalProperties: false
      description: 'Типизированная схема ai-proposal-v1: притязание подателя, не Policy Outcome и не доказательство факта'
      properties:
        conversation_id: { type: string, format: uuid, description: 'Собственный диалог обращения' }
        work_item_id: { type: string, format: uuid, description: 'Скоуп предложения (WI-принадлежность)' }
        turn_ref: { type: string, format: uuid, description: 'Принятое событие кейса, на которое отвечает предложение' }
        intent: { type: string, minLength: 1, maxLength: 64, description: 'Строка ≤64: словарь интентов проверяет ПОЛИТИКА (не сабмит) — неизвестное слово доходит до оценки и fail_closed исходом' }
        candidate_answer: { type: string, maxLength: 2000, description: 'Кандидат ответа (может быть пустым — базиса нет); текст живёт в предложении и панели, не в конвертах' }
        missing_facts:
          type: array
          items:
            type: object
            required: [material_key, reason]
            additionalProperties: false
            properties:
              material_key: { type: string, minLength: 1, maxLength: 64, description: 'Нормализованный ключ материала 2-2' }
              reason: { type: string, enum: [mandatory, readback], description: 'readback — единственная причина повторного вопроса подтверждённого факта в v1' }
        extracted_facts:
          type: array
          description: 'Притязания извлечённых фактов со source span — аудит; факты из них НЕ записываются (запись факта — команда 2-2)'
          items:
            type: object
            required: [material_key, value_digest, source_event_id]
            additionalProperties: false
            properties:
              material_key: { type: string, minLength: 1, maxLength: 64 }
              value_digest: { type: string, minLength: 1, maxLength: 128 }
              source_event_id: { type: string, format: uuid }
        proposer: { type: string, enum: [synthetic_port, operator] }
    EvaluatePolicyRequest:
      type: object
      required: [proposal_ref, expected_mode_version, expected_owner_epoch, expected_facts_digest, expected_work_item_version]
      additionalProperties: false
      properties:
        proposal_ref: { type: string, format: uuid, description: 'Оцениваемое предложение этого кейса' }
        expected_mode_version: { type: integer, minimum: 1, description: 'Якорь лестницы режимов 2-5' }
        expected_owner_epoch: { type: integer, minimum: 1, description: 'Якорь владения 2-4' }
        expected_facts_digest: { type: string, minLength: 64, maxLength: 64, description: 'Дайджест подтверждённого факт-набора кейса (SHA-256) — TOCTOU чтения фактов закрыт стейл-конфликтом' }
        expected_work_item_version: { type: integer, minimum: 1, description: 'Якорь элемента работы 2-2' }
    PolicyView:
      type: object
      required: [items, intent_words, commercial_intents, class_words, rule_version, panel_text, facts_digest, owner_epoch, mode_version]
      description: 'Секция Progressive Intake / Policy карточки: предложения и исходы по элементам работы; действующий исход — последний номер'
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PolicyWorkItemView' } }
        intent_words: { type: array, items: { type: string, enum: [general_question, service_request, price_inquiry, booking_request, human_request] } }
        commercial_intents: { type: array, items: { type: string, enum: [service_request, price_inquiry, booking_request] } }
        class_words: { type: array, items: { type: string, enum: [commercial_answer, informational_answer, clarify, mode_blocked, degraded_mode, fail_closed] } }
        rule_version: { type: string, enum: [intake-policy-v1, intake-policy-v2, intake-policy-v3] }
        panel_text: { type: string }
        facts_digest: { type: string, description: 'Текущий дайджест подтверждённых фактов (якорь формы оценки)' }
        owner_epoch: { type: integer }
        mode_version: { type: integer }
    PolicyWorkItemView:
      type: object
      required: [work_item_id, proposals, outcomes]
      properties:
        work_item_id: { type: string, format: uuid }
        proposals: { type: array, items: { $ref: '#/components/schemas/AIProposal' } }
        outcomes: { type: array, items: { $ref: '#/components/schemas/PolicyOutcomeView' } }
        current: { $ref: '#/components/schemas/PolicyOutcomeView' }
    AIProposal:
      type: object
      required: [proposal_id, schema_version, intent, proposer, owner_epoch, mode_version, actor_id, created_at]
      properties:
        proposal_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        work_item_id: { type: string, format: uuid }
        turn_ref: { type: string, format: uuid }
        schema_version: { type: string, enum: [ai-proposal-v1] }
        intent: { type: string }
        candidate_answer: { type: string }
        missing_facts: { type: array, items: { type: object, required: [material_key, reason], properties: { material_key: { type: string }, reason: { type: string, enum: [mandatory, readback] } } } }
        extracted_facts: { type: array, items: { type: object, required: [material_key, value_digest, source_event_id], properties: { material_key: { type: string }, value_digest: { type: string }, source_event_id: { type: string, format: uuid } } } }
        proposer: { type: string, enum: [synthetic_port, operator] }
        owner_epoch: { type: integer }
        mode_version: { type: integer }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    PolicyOutcomeView:
      type: object
      required: [outcome_id, outcome_no, outcome_class, reason, rule_version, intent, input_snapshot, decision_digest, actor_id, created_at]
      properties:
        outcome_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        work_item_id: { type: string, format: uuid }
        proposal_id: { type: string, format: uuid }
        outcome_no: { type: integer, minimum: 1, description: 'Монотонный номер; действующий исход — максимальный' }
        outcome_class: { type: string, enum: [commercial_answer, informational_answer, clarify, mode_blocked, degraded_mode, fail_closed] }
        reason: { type: string, enum: [ok_commercial, ok_informational, mandatory_missing, no_answer_basis, mode_blocks_commercial_path, unknown_intent, no_alternative_path, degraded_route], description: 'no_alternative_path (2-11): у media-ключа пакета нет разрешённых альтернатив — честная остановка с human_handoff; degraded_route (2-12): маршрут диалога деградирован — разрешённые пути вместо коммерческого ответа' }
        rule_version: { type: string, enum: [intake-policy-v1, intake-policy-v2, intake-policy-v3], description: 'v3 (Story 2.12): 5-й вход — карта деградаций маршрутов + маршрут диалога; v2 (2.11): 4-й вход — предпочтения связи; исторические строки v1/v2 читаемы, не пересчитываются' }
        active_alternatives: { type: array, items: { type: string, enum: [text_description, range_estimate, callback, human_handoff] }, description: 'Активные альтернативы (Story 2.11): пара «media-usual факт не подтверждён ∧ no_photo активен» — весь словарь альтернатив пака; вопрос факта остаётся в next_steps; пустой словарь пака → fail_closed no_alternative_path' }
        degraded_permitted_paths: { type: array, items: { type: string, enum: [accept_info_no_promise, verified_channel_switch, human_handoff, agree_callback, stop_path] }, description: 'Разрешённые пути degraded-режима (Story 2.12): маршрут диалога WI деградирован ∧ коммерческий интент → класс degraded_mode + reason degraded_route + весь словарь путей пака (5 слов AC-3 — набор не расширяется, модель не может расширить); вопрос-план остаётся; commercial_answer не выдаётся — гейт 2-6 закрывает продажный путь машинно; пустой словарь → fail_closed no_alternative_path' }
        intent: { type: string, description: 'Снимок намерения предложения' }
        mandatory_facts: { type: array, items: { type: object, required: [material_key, source, state], properties: { material_key: { type: string }, source: { type: string, enum: [rule, proposal] }, state: { type: string, enum: [reused, ask] } } } }
        next_steps: { type: array, items: { type: object, required: [step], properties: { step: { type: string, enum: [ask_fact, await_confirmation, human_handoff] }, material_key: { type: string } } } }
        reused_facts: { type: array, items: { type: object, required: [material_key, fact_id, version_no, value_digest, source], properties: { material_key: { type: string }, fact_id: { type: string, format: uuid }, version_no: { type: integer }, value_digest: { type: string }, source: { type: string, enum: [rule, proposal] } } } }
        suppressed_questions: { type: array, items: { type: object, required: [material_key, source], properties: { material_key: { type: string }, source: { type: string, enum: [rule, proposal] } } } }
        input_snapshot: { $ref: '#/components/schemas/PolicyInputSnapshot' }
        decision_digest: { type: string, description: 'Канонический SHA-256 входов+решения: те же якоря → тот же дайджест (детерминизм)' }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    PolicyInputSnapshot:
      type: object
      required: [proposal_id, schema_version, mode_version, owner_epoch, facts_digest, facts_digest_hash, work_item_version, rule_version, preferences, degradations]
      properties:
        proposal_id: { type: string, format: uuid }
        schema_version: { type: string, enum: [ai-proposal-v1] }
        mode_version: { type: integer }
        owner_epoch: { type: integer }
        facts_digest: { type: object, description: 'Карта material_key → {version_no, value_digest} подтверждённых фактов', additionalProperties: { type: object, required: [version_no, value_digest], properties: { version_no: { type: integer }, value_digest: { type: string } } } }
        facts_digest_hash: { type: string }
        work_item_version: { type: integer }
        rule_version: { type: string, enum: [intake-policy-v1, intake-policy-v2, intake-policy-v3] }
        preferences: { type: object, description: 'Каноническая карта preferences (Story 2.11): key → {revision, cleared} — advisory 4-й вход, изменение = честный supersede дайджеста', additionalProperties: { type: object, required: [revision, cleared], properties: { revision: { type: integer }, cleared: { type: boolean } } } }
        degradations: { type: object, description: 'Каноническая карта деградаций маршрутов (Story 2.12): route (connection:channel) → {cause, revision, cleared} — advisory 5-й вход, изменение = честный supersede дайджеста; восстановленный маршрут честно остаётся в карте', additionalProperties: { type: object, required: [cause, revision, cleared], properties: { cause: { type: string, enum: [timeout, disconnect, rate_limited, capability_revoked, delivery_unknown] }, revision: { type: integer }, cleared: { type: boolean } } } }
    OwningSystemReadRequest:
      type: object
      required: [material_key]
      additionalProperties: false
      description: 'Типизированный Read Request (Story 2.7): материальное поле фиксированной матрицы State/Authority v1 — поле вне словаря честно отказано field_not_in_matrix (unknown как класс, строка не пишется)'
      properties:
        material_key: { type: string, enum: [price, availability, order_status], description: 'Материальное поле матрицы v1 (Domain Pack v0; словарь полей — доменный, не конфигурация)' }
    ObservationView:
      type: object
      required: [items, field_words, matrix_version, panel_text]
      description: 'Секция «Материальные поля Owning System» карточки: карточки полей по WI; действующее наблюдение — максимальный номер; свежесть — read-time деривация; конфликт-бейдж — байтовое сравнение с подтверждённым фактом 2-2 (решение за человеком)'
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ObservationWorkItemView' } }
        field_words: { type: array, items: { type: string, enum: [price, availability, order_status] } }
        matrix_version: { type: string, enum: [state-authority-matrix-v1] }
        panel_text: { type: string }
    ObservationWorkItemView:
      type: object
      required: [work_item_id, fields, observation_count]
      description: 'Карточки всех полей матрицы одного WI (изоляция per-field: отказ одной системы не маскирует другие поля — AC-9)'
      properties:
        work_item_id: { type: string, format: uuid }
        fields: { type: array, items: { $ref: '#/components/schemas/ObservationCard' } }
        observation_count: { type: integer, minimum: 0, description: 'Число строк наблюдений WI (якорь формы чтения — защита от двойного сабмита PRG)' }
    ObservationCard:
      type: object
      required: [material_key, owning_system, projection, freshness_seconds]
      description: 'Карточка одного материального поля: строка матрицы, действующее наблюдение, read-time состояние свежести и конфликт-бейдж'
      properties:
        material_key: { type: string, enum: [price, availability, order_status] }
        owning_system: { type: string, enum: [catalog, erp] }
        projection: { type: string, enum: [price_quote, stock_count, status_word] }
        freshness_seconds: { type: integer, minimum: 1 }
        current: { $ref: '#/components/schemas/ObservationRecord' }
        state: { type: string, enum: [fresh, stale, failed, unknown], description: 'fresh/stale — только ok (age против окна матрицы, от observed_at провайдера); failed/unknown не приукрашиваются' }
        conflict_badge: { type: string, enum: [equal, differs, no_fact], description: 'equal — байты совпадают с подтверждённым фактом; differs — честное «расхождение» (решение за человеком); no_fact — факта нет' }
    ObservationRecord:
      type: object
      required: [observation_id, observation_no, status, received_at, actor_id]
      description: 'Append-only строка одного чтения: ok несёт value/внешний ID/версию/observed_at; failed/unknown — value NULL, причина словарём (предполагаемое значение не пишется никогда)'
      properties:
        observation_id: { type: string, format: uuid }
        observation_no: { type: integer, minimum: 1, description: 'Монотонный номер (WI, material_key); действующее — максимальный' }
        material_key: { type: string, enum: [price, availability, order_status] }
        owning_system: { type: string, enum: [catalog, erp] }
        projection: { type: string, enum: [price_quote, stock_count, status_word] }
        status: { type: string, enum: [ok, failed, unknown] }
        reason: { type: string, enum: [provider_timeout, malformed_response, insufficient_scope, read_error] }
        value: { type: object, additionalProperties: true, description: 'Каноническая проекция (только ok; ≤2048 байт)' }
        external_id: { type: string, description: 'Внешний ID носителя (только ok)' }
        external_version: { type: string, description: 'Версия провайдера (только ok)' }
        observed_at: { type: string, format: date-time, description: 'Время провайдера (только ok)' }
        received_at: { type: string, format: date-time, description: 'Наше время приёма (никогда не смешивается с observed_at)' }
        actor_id: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    AccommodationRecordRequest:
      type: object
      required: [accommodation_key]
      additionalProperties: false
      description: 'Запись одной ревизии предпочтения связи: ключ фиксированного словаря Domain Pack v0; флаги не несут значение, значимые требуют; снятие — своей ревизией, никогда вместе со значением; ревизию назначает сервер под локами'
      properties:
        accommodation_key: { type: string, enum: [no_photo, no_web, no_voice, text_first, slowed_pace, mandatory_readback, preferred_channel, available_time], description: 'Ключ предпочтения (словарь фиксирован compile-time — не конфигурация тенанта)' }
        value: { type: string, maxLength: 100, description: 'Значение значимого ключа: preferred_channel — слово словаря каналов 2-1; available_time — свободная операционная строка 1..100 рун (не расписание, машиной не парсится)' }
        cleared: { type: boolean, description: 'Снятие предпочтения: ревизия без значения; ключ покидает текущий набор (деривация чтения)' }
        note: { type: string, maxLength: 500, description: 'Заметка оператора: остаётся в строке, никогда не покидает таблицу (outbox — только key/revision/cleared)' }
    AccommodationView:
      type: object
      required: [current, history, key_words, channel_words, records_count, panel_text]
      description: 'Секция «Предпочтения связи» (Story 2.11): текущий набор — read-time деривация последней ревизии каждого ключа (cleared убирает ключ из активного набора, оставаясь в состоянии честно); история — append-only, включая снятия; операционная настройка, не факт'
      properties:
        current: { type: array, items: { type: object, required: [key, revision, cleared], properties: { key: { type: string, enum: [no_photo, no_web, no_voice, text_first, slowed_pace, mandatory_readback, preferred_channel, available_time] }, revision: { type: integer }, cleared: { type: boolean }, value: { type: string } } } }
        history: { type: array, items: { type: object, required: [key, revision, cleared, actor_id, recorded_at], properties: { key: { type: string }, revision: { type: integer }, value: { type: string }, cleared: { type: boolean }, note: { type: string }, actor_id: { type: string, format: uuid }, recorded_at: { type: string, format: date-time } } } }
        key_words: { type: array, items: { type: string } }
        channel_words: { type: array, items: { type: string } }
        records_count: { type: integer, description: 'Число строк истории — якорь формы записи (защита двойного сабмита PRG)' }
        panel_text: { type: string }
    RouteDegradationRecordRequest:
      type: object
      required: [connection_id, channel, cause]
      additionalProperties: false
      description: 'Запись одной ревизии деградации маршрута: маршрут (подключение + канал 2-1), причина словаря, восстановление своей ревизией; ревизия НЕ поле запроса — серверная истина под локами; заметка остаётся в строке — не покидает таблицу в outbox'
      properties:
        connection_id: { type: string, format: uuid, description: 'Подключение маршрута (обязан существовать в разговорах кейса — страж маршрута)' }
        channel: { type: string, enum: [phone, web_chat, telegram, whatsapp, email, max, jivo, avito, mobile_app_chat], description: 'Канал маршрута (словарь 2-1)' }
        cause: { type: string, enum: [timeout, disconnect, rate_limited, capability_revoked, delivery_unknown], description: 'Причина деградации (словарь AC-1: таймаут, обрыв, предел частоты, отзыв возможности, неоднозначный результат доставки)' }
        cleared: { type: boolean, description: 'Восстановление маршрута — своей ревизией (маршрут покидает текущие деградации, история честно несёт строку восстановления)' }
        note: { type: string, maxLength: 500, description: 'Заметка оператора (остаётся в строке — не покидает таблицу)' }
    DeliveryEvidenceRecordRequest:
      type: object
      required: [kind]
      additionalProperties: false
      description: 'Запись одного наблюдения доставки: слово словаря наблюдений коннектора; event_no НЕ поле запроса — серверная истина под локами; content реплая никогда не покидает строку'
      properties:
        kind: { type: string, enum: [delivered_confirmed, delivery_unknown, provider_failed], description: 'Наблюдение коннектора (передаёт оператор): квитанция подтверждена / результат неизвестен / терминальный отказ провайдера' }
    RouteDegradationView:
      type: object
      required: [current, history, cause_words, channel_words, records_count, panel_text]
      description: 'Секция «Состояние маршрутов» (Story 2.12): текущие деградации — read-time деривация последней ревизии каждого маршрута (cleared восстанавливает маршрут); история — append-only, включая восстановления; операционная запись, не факт'
      properties:
        current: { type: array, items: { type: object, required: [connection_id, channel, cause, cause_text, revision], properties: { connection_id: { type: string, format: uuid }, channel: { type: string }, cause: { type: string, enum: [timeout, disconnect, rate_limited, capability_revoked, delivery_unknown] }, cause_text: { type: string, description: 'Честный текст причины — рендер панели, в БД/outbox только слова' }, revision: { type: integer } } } }
        history: { type: array, items: { type: object, required: [connection_id, channel, cause, revision, cleared, actor_id, recorded_at], properties: { connection_id: { type: string, format: uuid }, channel: { type: string }, cause: { type: string }, revision: { type: integer }, cleared: { type: boolean }, note: { type: string }, actor_id: { type: string, format: uuid }, recorded_at: { type: string, format: date-time } } } }
        cause_words: { type: array, items: { type: string, enum: [timeout, disconnect, rate_limited, capability_revoked, delivery_unknown] } }
        channel_words: { type: array, items: { type: string } }
        records_count: { type: integer, description: 'Число строк истории — якорь формы записи (защита двойного сабмита PRG)' }
        panel_text: { type: string }
    ReplyDeliveryView:
      type: object
      required: [reply_id, state]
      description: 'Честное состояние доставки исходящего ответа (Story 2.12, read-time деривация): dispatched без событий = unknown — «результат становится unknown, а не delivered» (слово delivered только у evidence-наблюдения delivered_confirmed); без исхода drain = prepared (истина 2-4); последнее событие решает'
      properties:
        reply_id: { type: string, format: uuid }
        state: { type: string, enum: [prepared, unknown, confirmed, failed], description: 'prepared — ещё не отправлен; unknown — отправлен без квитанции; confirmed — квитанция есть; failed — терминальный отказ провайдера' }
        last_event_no: { type: integer, description: 'Номер последнего evidence-события (монотонная история наблюдений читаема)' }
        last_kind: { type: string, enum: [delivered_confirmed, delivery_unknown, provider_failed] }
        last_event_at: { type: string, format: date-time, description: 'Время последнего события — якорь таймлайна AC-9' }
    RequestHumanRequest:
      type: object
      required: [turn_ref, expected_mode_version, target_roles, ack_deadline]
      additionalProperties: false
      description: 'Безусловная просьба клиента о человеке (Story 2.13): причина НЕ поле запроса — системная константа словаря client_request (оператор причину НЕ вводит); номера запроса/события НЕ поля запроса — серверная истина под локами; request_no/события запрос не несёт'
      properties:
        turn_ref: { type: string, format: uuid, description: 'Принятая реплика клиента ЭТОГО обращения — якорь безусловной просьбы (страж стора: событие кейса)' }
        expected_mode_version: { type: integer, minimum: 1, description: 'CAS-ожидание версии лестницы режимов (гонка режима — честный 409 mode_conflict)' }
        target_roles: { type: array, minItems: 1, items: { type: string, enum: [operator, supervision] }, description: 'Целевые роли запроса (непустой набор слов словаря без дублей — кого адресует просьба)' }
        ack_deadline: { type: string, enum: [ack_15m, ack_1h, ack_4h], description: 'Слово дедлайна подтверждения (утверждённая policy v0)' }
    AssignHumanHandoffRequest:
      type: object
      required: [assignee, backup, ack_deadline]
      additionalProperties: false
      description: 'Назначение раунда подтверждения (назначение ≠ принятие): роль назначаемого НЕ поле запроса — серверная резолюция машинерией участия (review → operator, configuration → supervision; страж целевых ролей запроса под локами)'
      properties:
        assignee: { type: string, format: uuid, description: 'Назначаемый специалист (активный участник тенента)' }
        backup: { type: string, format: uuid, description: 'Резервный участник раунда' }
        ack_deadline: { type: string, enum: [ack_15m, ack_1h, ack_4h], description: 'Слово дедлайна раунда (утверждённая policy v0; переназначение — новое событие с новым дедлайном)' }
    AcknowledgeHumanHandoffRequest:
      type: object
      required: [expected_epoch]
      additionalProperties: false
      description: 'Подтверждение принятия назначения (только assignee — серверная истина): ОДНА транзакция с механикой передачи 2-4; гонка двух подтверждений — ровно один победитель (UNIQUE + CAS + локи)'
      properties:
        expected_epoch: { type: integer, minimum: 1, description: 'CAS-ожидание текущей эпохи владения (проигравший — честный stale_version)' }
    CancelHumanRequestRequest:
      type: object
      required: [turn_ref]
      additionalProperties: false
      description: 'Отмена запроса клиента: якорь — принятая реплика клиента-отмены ЭТОГО обращения; владелец не меняется, история не удаляется, режим не понижается (трещотка 2-5)'
      properties:
        turn_ref: { type: string, format: uuid, description: 'Принятая реплика клиента-отмены (страж стора: событие кейса)' }
    ReturnToStaffyRequest:
      type: object
      required: [result, expected_epoch]
      additionalProperties: false
      description: 'Возврат обращения цифровому сотруднику (после подтверждения): результат — слово словаря; ОДНА транзакция с механикой передачи 2-4 (владелец=staffy, external_inbox, эпоха+1); режим не тронут'
      properties:
        result: { type: string, enum: [issue_resolved, handed_back], description: 'Слово результата возврата (свободный материал не существует)' }
        expected_epoch: { type: integer, minimum: 1, description: 'CAS-ожидание текущей эпохи владения' }
    HandoffView:
      type: object
      required: [requests, requests_count, role_words, deadline_words, result_words, panel_text]
      description: 'Секция «Запрос человека» (Story 2.13): append-only запросы с read-time состояниями (просрочка — деривация дедлайна раунда, не запись), клиентские статусы честны (назначение ≠ принятие — два слова); карточка назначенного видна только назначенному; запись жизненного цикла, не факт'
