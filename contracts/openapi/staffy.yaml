        material_unknowns: { type: array, maxItems: 7, items: { type: string, enum: [scope, service_items, price, payee, warranty_role, next_step, consequences] }, description: 'Честные неизвестные обязательных терминов: неизвестный обязательный термин блокирует готовность (AC-2)' }
