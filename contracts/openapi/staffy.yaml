    OperationalException:
      type: object
      required: [tenant_id, exception_id, kind, summary, correlation_id, event_id, created_at]
      properties:
        tenant_id: { type: string, format: uuid }
        exception_id: { type: string, format: uuid }
        kind: { type: string, enum: [digest_conflict, ambiguous_employee, idempotency_key_conflict, work_item_dispute] }
        summary: { type: string, description: 'Безопасный текст: payload не раскрывается' }
        correlation_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid, nullable: true, description: 'Спор рабочего элемента не имеет события: NULL' }
        original_event_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    SealedPayloadView:
      type: object
      required: [event_id, payload_digest, seal_ok, payload]
      properties:
        event_id: { type: string, format: uuid }
        payload_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        seal_ok: { type: boolean, description: 'HMAC-печать проверена при чтении' }
        payload: { description: 'Только под полномочиями review/audit; любое одно JSON-значение' }
    RecordCorrectionRequest:
      type: object
      required: [version_no, value, reason]
      additionalProperties: false
      description: 'Операторская коррекция факта (Story 2.15): пин ТОЧНОЙ версии факта этого обращения (оптимистическая конкурентность AC-8), proposed_value — материальная дисциплина фактов 2.2, spans 0..8 байт-в-байт выдержки источника, reason обязателен. ИСХОД — НЕ поле запроса: матричный гейт домена решает по material_key якоря (strict decode отказывает полю outcome). correction_no — НЕ поле запроса: серверная истина под advisory-локами (зонд контракта пиннит отсутствие)'
      properties:
        version_no: { type: integer, minimum: 1, description: 'Пин ТОЧНОЙ исправляемой версии [1..версий] факта этого обращения (страж стора: чужой факт/версия — 400)' }
        summary_no: { type: integer, minimum: 0, description: 'Связь с ТОЧНОЙ версией сводки этого обращения: 0 = выдержки из принятых событий кейса; >=1 = текст сводки — источник спанов (страж стора: чужая сводка — 400)' }
        value: { description: 'Предложенное значение — одно JSON-значение материальной дисциплины фактов 2.2 (каноническая форма, 2048 байта, цифровые литералы; экспоненциальные — отказ)' }
        spans: { type: array, maxItems: 8, items: { type: string, minLength: 1, maxLength: 600 }, description: 'Выдержки-доказательства: байт-в-байт строки источника (события ИЛИ сводки) — анти-фантазийный зонд 2.8 (1..200 рун каждая)' }
        reason: { type: string, minLength: 1, maxLength: 600, description: 'Причина коррекции — акт осознанный (1..200 рун, обязательна)' }
    PromiseUpdateRequest:
      type: object
      required: [deadline_word]
      additionalProperties: false
      description: 'Обещание обновления (первый срез Story 2.16): deadline_word — ЕДИНСТВЕННОЕ поле запроса, слово словаря с МАТЕРИАЛЬНОЙ честностью unknown (FR-41: отсутствие подтверждённого ETA называется прямо, выдуманный срок НИКОГДА). promised_at / promise_no / request_no / actor_id — НЕ поля запроса (серверные истины под локами; якорь раунда резолвит стор; strict decode отказывает — зонд контракта пиннит отсутствие)'
      properties:
        deadline_word: { type: string, enum: [update_15m, update_1h, update_4h, update_unknown], description: 'Слово дедлайна следующего обновления: известное окно {15 минут, час, 4 часа} ЛИБО честное «срок неизвестен» — без выдуманного обещания' }
    RecordCaseSummaryRequest:
      type: object
      required: [kind, text, claims]
      additionalProperties: false
      description: 'Запись AI-сводки (продюсерский путь, Story 2.14): kind — единственное слово словаря; claims 1..32, каждое утверждение либо связано (ref_type словаря ∧ ref_id непусто), либо честно помечено disputed; текст утверждения — байт-в-байт подстрока текста сводки (анти-фантазийный зонд). summary_no и watermark — НЕ поля запроса: серверная истина под advisory-локами (зонд контракта пиннит отсутствие)'
      properties:
        kind: { type: string, enum: [ai_summary], description: 'Слово вида сводки — единственное слово среза (операторские сводки Never: оператор пишет ноты 2-3, PRG-форм нет)' }
        text: { type: string, minLength: 1, maxLength: 3000, description: 'Текст сводки (1..1000 рун; байтовый потолок таблицы 16384)' }
        claims:
          type: array
          minItems: 1
          maxItems: 32
          description: 'Утверждения сводки — каждое связано ссылкой на материал ЭТОГО кейса либо помечено спорным (дисциплина AD-7/AD-8)'
          items:
            type: object
            required: [text]
            additionalProperties: false
            properties:
              ref_type: { type: string, enum: [fact_version, observation], description: 'Тип якоря утверждения (словарь среза)' }
              ref_id: { type: string, format: uuid, description: 'Якорь факта или наблюдения ЭТОГО обращения (страж стора: чужой/несуществующий ref — 400)' }
              disputed: { type: boolean, description: 'Честная пометка спорного утверждения (без ссылки)' }
              text: { type: string, minLength: 1, maxLength: 600, description: 'Текст утверждения — байт-в-байт строка текста сводки (1..200 рун)' }
    DecisionContextView:
      type: object
      required: [present, panel_text, handoff, work_items, mode, assurance, owner, facts, observations, deliveries, commitments, preferences, recommendation, summary]
      description: 'Составной контекст передачи (Story 2.14): двенадцать read-time блоков поверх дериваций 2-2..2-13 — ОДНА транзакция согласованного снимка, без advisory-локов чтения; ничего не мутируется; секция появляется только при матери (открытый handoff ИЛИ записанная сводка) — честное отсутствие рендерит пустой present=false'
      properties:
        present: { type: boolean, description: 'Материал контекста существует (открытая передача или записанная сводка) — секция рендерится только при true' }
        panel_text: { type: string }
        handoff:
          type: object
          required: [present, reason, reason_text, state, state_text, turn_ref, ack_deadline, ack_deadline_text, deadline_at]
          properties:
            present: { type: boolean }
            reason: { type: string, enum: [client_request] }
            reason_text: { type: string }
            state: { type: string, enum: [requested, assigned, overdue, acknowledged, declined, cancelled, returned], description: 'Read-time состояние lifecycle открытой передачи' }
            state_text: { type: string }
            turn_ref: { type: string, format: uuid, description: 'Якорь просьбы — принятая реплика клиента' }
            ack_deadline: { type: string, enum: [ack_15m, ack_1h, ack_4h] }
            ack_deadline_text: { type: string }
            deadline_at: { type: string, format: date-time, description: 'Дедлайн живого раунда (деривация просрочки читает его)' }
        work_items: { type: array, items: { type: object, required: [work_item_id, title, type, state], properties: { work_item_id: { type: string, format: uuid }, title: { type: string }, type: { type: string }, state: { type: string, enum: [untriaged, in_work, waiting], description: 'Только не-терминальные слова лестницы (терминальные — история, не рабочий материал)' } } } }
        mode: { type: object, required: [present, mode, mode_version], properties: { present: { type: boolean }, mode: { type: string, description: 'Активное слово лестницы режимов 2-5' }, mode_version: { type: integer, minimum: 0, description: 'Версия лестницы (CAS-истина propose/exit)' } } }
        assurance: { type: object, required: [identity_level, identity_method, identity_expires_at, authority_level, authority_method, authority_scope, authority_expires_at], description: 'DeriveAssuranceState 2-3: честное none отсутствия никогда не становится подтверждённой личностью', properties: { identity_level: { type: string }, identity_method: { type: string }, identity_expires_at: { type: string, format: date-time }, authority_level: { type: string }, authority_method: { type: string }, authority_scope: { type: string }, authority_expires_at: { type: string, format: date-time } } }
        owner: { type: object, required: [present, owner_kind, owner_ref, epoch], properties: { present: { type: boolean }, owner_kind: { type: string }, owner_ref: { type: string, format: uuid }, epoch: { type: integer, minimum: 0, description: 'Эпоха текущего терма владения 2-4' } } }
        facts:
          type: object
          required: [confirmed, unconfirmed, conflicting]
          description: 'ТРИ раздельные группы (никогда один смешанный список); conflicting — рендер read-time деривации, НЕ хранимый статус; unconfirmed — рендер-зеркало unverified'
          properties:
            confirmed: { type: array, items: { $ref: '#/components/schemas/DecisionContextFactRow' } }
            unconfirmed: { type: array, items: { $ref: '#/components/schemas/DecisionContextFactRow' } }
            conflicting: { type: array, items: { $ref: '#/components/schemas/DecisionContextFactRow' } }
        observations: { type: array, items: { type: object, required: [work_item_id, material_key, owning_system, observed_at, freshness, conflict_rule, evidence_status, projection, external_id, external_version], description: 'Текущее наблюдение группы (WI, ключ): freshness — слово матричного окна от provider-observed времени; провайдер-техника за прогрессивным раскрытием', properties: { work_item_id: { type: string, format: uuid }, material_key: { type: string }, owning_system: { type: string }, observed_at: { type: string, format: date-time }, freshness: { type: string, description: 'Слово свежести матрицы (fresh|stale|failed — окно FreshnessSeconds)' }, conflict_rule: { type: string }, evidence_status: { type: string }, projection: { type: string }, external_id: { type: string }, external_version: { type: string } } } }
        deliveries: { type: array, items: { type: object, required: [reply_id, state], description: 'Слова доставки 2-12 отдельными строками: принятие каналом ≠ доставка ≠ деловое завершение', properties: { reply_id: { type: string, format: uuid }, state: { type: string }, last_kind: { type: string }, last_event_at: { type: string, format: date-time } } } }
        commitments: { type: array, items: { type: object, required: [commitment_id, version_no, status, valid_until, terms_known, terms_unknown, receipt_text], description: 'Текущая версия каждого обязательства: confirmed = деривация валидного подтверждения точной версии 2-9; квитанции честно нет (Action Gateway — Epic 3)', properties: { commitment_id: { type: string, format: uuid }, version_no: { type: integer, minimum: 1 }, status: { type: string, enum: [draft, offered, confirmed], description: 'confirmed — рендер-деривация валидного подтверждения, НЕ хранимый статус' }, valid_until: { type: string, format: date-time }, confirmation_status: { type: string }, terms_known: { type: array, items: { type: string } }, terms_unknown: { type: array, items: { type: string }, description: 'MaterialUnknowns — честные дыры обязательных условий' }, receipt_text: { type: string, description: 'Честная строка отсутствия квитанции' } } } }
        preferences: { type: object, required: [accommodation_keys, alternative_paths, usual_modalities], description: 'Предпочтения видны ДО первого ответа назначенного (AC-4)', properties: { accommodation_keys: { type: array, items: { type: string } }, alternative_paths: { type: array, items: { type: string }, description: 'Активные альтернативы последнего исхода + разрешённые деградированные пути' }, usual_modalities: { type: array, items: { type: object, required: [material_key, word], properties: { material_key: { type: string }, word: { type: string, description: 'Обычный способ установления ключа (pack-данные v0)' } } } } } }
        recommendation: { type: object, required: [present, steps, reason, checks, deadline_at, mode, mode_version, projection_text], description: 'ПРОЕКЦИЯ слов плана последнего исхода политики: НЕ команда, НЕ полномочие — исполнение только существующими командами 2-1..2-13 (AC-7)', properties: { present: { type: boolean }, steps: { type: array, items: { type: string }, description: 'Слова NextSteps последнего outcome (StepHumanHandoff и т.д.)' }, reason: { type: string }, checks: { type: array, items: { type: object, required: [material_key, state], properties: { material_key: { type: string }, state: { type: string, description: 'Слово состояния обязательного материала (ask|reused…)' } } } }, ack_deadline: { type: string, enum: [ack_15m, ack_1h, ack_4h] }, ack_deadline_text: { type: string }, deadline_at: { type: string, format: date-time, description: 'Дедлайн открытого handoff (нуль при отсутствии)' }, mode: { type: string, description: 'Ограничения эффективного режима' }, mode_version: { type: integer }, projection_text: { type: string, description: 'Честная граница: рекомендация — проекция' } } }
        summary: { $ref: '#/components/schemas/SummaryView' }
    DecisionContextFactRow:
      type: object
      required: [fact_id, material_key, status, status_text, version_no, source_type, source_id, channel, observed_at]
      description: 'Одна строка факта контекста: статус рендер-словаря, версия и provenance (источник-событие/канал)'
      properties:
        fact_id: { type: string, format: uuid }
        material_key: { type: string }
        status: { type: string, enum: [confirmed, unconfirmed, conflicting], description: 'Рендер-словарь зеркала дериваций work.go (unverified → unconfirmed; conflicting — рендер, не запись)' }
        status_text: { type: string, description: 'Честный текст статуса — рендер, в БД/outbox только слова' }
        version_no: { type: integer, minimum: 1 }
        source_type: { type: string }
        source_id: { type: string }
        channel: { type: string }
        observed_at: { type: string, format: date-time }
        has_correction: { type: boolean, description: 'Story 2.15: коррекционное состояние факта существует (маркеры появляются ТОЛЬКО с материалом — контрольная ветка рендерит байт-в-байт)' }
        correction_marker_text: { type: string, description: 'Маркер «исправлено» либо «оспорено (значение системы не изменено)» — read-time деривация последней коррекции' }
        correction_source_text: { type: string, description: 'Строка «источник исправления: событие/сводка» (деривация из summary_no: 0 = событие, >=1 = сводка)' }
        correction_no: { type: integer, minimum: 1, description: 'Номер последней коррекции факта (серверная истина под локами; маркер читается, не запрашивается)' }
        correction_outcome: { type: string, enum: [applied, disputed], description: 'Исход матричного гейта — СЕРВЕРНОЕ решение домена по material_key якоря (НЕ поле запроса: strict decode отказывает)' }
        correction_at: { type: string, format: date-time, description: 'Время коррекции (created_at строки)' }
        correction_spans: { type: array, items: { type: string }, maxItems: 8, description: 'Байт-точные выдержки источника (2.8); панель раскрывает по запросу' }
        correction_reason: { type: string, description: 'Причина коррекции оператора (акт осознанный)' }
    SummaryView:
      type: object
      required: [present, summary_no, kind, marking_text, text, claims, staleness, staleness_text, staleness_counters_text]
      description: 'Сводка AI (AC-5/AC-6): последняя append-only строка с read-time staleness — actual|stale + честные счётчики; stale сводка НЕ отображается как актуальная (источники рендерятся рядом); сводка не заменяет источники (AD-8)'
      properties:
        present: { type: boolean }
        summary_no: { type: integer, minimum: 1, description: 'Монотонный номер (серверная истина; новое владение — новая строка, append-only)' }
        kind: { type: string, enum: [ai_summary] }
        marking_text: { type: string, description: 'Честная маркировка AI-производного представления (сверяйтесь с источниками)' }
        text: { type: string, description: 'Текст сводки (материал продюсера; 1..1000 рун)' }
        claims: { type: array, items: { $ref: '#/components/schemas/ClaimView' } }
        staleness: { type: string, enum: [actual, stale], description: 'Read-time сравнение watermark сводки с текущими счётчиками — никогда не хранимый статус; сводка не мутируется' }
        staleness_text: { type: string }
        staleness_counters_text: { type: string, description: 'Честные счётчики новизны («новых событий: N; новых версий фактов: N; владелец сменился; режим сменился»)' }
    ClaimView:
      type: object
      required: [ref_type, disputed, text]
      description: 'Одно утверждение сводки: связано якорем (словарь ref-типов) либо честно помечено спорным; текст — байт-в-байт строка сводки (span-дисциплина 2-8)'
      properties:
        ref_type: { type: string, enum: [fact_version, observation] }
        ref_id: { type: string, format: uuid, description: 'Якорь факта/наблюдения ЭТОГО обращения (пусто у спорного)' }
        disputed: { type: boolean, description: 'Честная пометка спорности (спорное утверждение не несёт ссылку)' }
        text: { type: string, minLength: 1, description: 'Текст утверждения — байт-в-байт подстрока текста сводки' }
    ActionDefinitionView:
      type: object
      additionalProperties: false
      required: [id, version, name, purpose, typed_input_schema, typed_output_schema, pack_ref, required_capability, owning_system, conditions, delivery_contract]
      description: 'Разрешённое Business Action (3.1, первый срез): декларация без исполнения. Словарная система условий fail-closed — «отсутствие обязательного условия = запрет»; классификация delivery свёрена с CapabilityDeclaration провайдера (AC-3); пин-пара (id, version) неизменяема (AC-8). Секретных значений НЕТ: Secret только помечает поле схемы'
      properties:
        id: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9._-]+$' }
        version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$', description: 'Числовая тройка — порядок версий тотален, List отдаёт только новейшую' }
        name: { type: string, minLength: 1 }
        purpose: { type: string, minLength: 1 }
        typed_input_schema: { type: array, items: { $ref: '#/components/schemas/ActionFieldSchemaView' } }
        typed_output_schema: { type: array, items: { $ref: '#/components/schemas/ActionFieldSchemaView' } }
        pack_ref: { $ref: '#/components/schemas/ActionPackRefView' }
        required_capability: { $ref: '#/components/schemas/ActionCapabilityRefView' }
        owning_system: { type: string, enum: [catalog, erp], description: 'Зеркало словаря 2-7' }
        conditions: { $ref: '#/components/schemas/ActionConditionsView' }
        delivery_contract: { $ref: '#/components/schemas/ActionDeliveryContractView' }
    ActionFieldSchemaView:
      type: object
      additionalProperties: false
      required: [name, label, type, required, secret, description]
      description: 'Одно декларированное поле схемы (зеркало паттерна 1-8): декларация без значения; secret=true только помечает'
      properties:
        name: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        type: { type: string, enum: [text, url] }
        required: { type: boolean }
        secret: { type: boolean }
        description: { type: string }
    ActionPackRefView:
      type: object
      additionalProperties: false
      required: [pack_id, pack_version]
      description: 'Обязательная ссылка на опубликованный Domain Pack — резолвится живым каталогом employee (пин-пара, не «новейшая»); домен гейтит структуру, app-слой — резолюцию'
      properties:
        pack_id: { type: string, minLength: 1 }
        pack_version: { type: string, minLength: 1 }
    ActionCapabilityRefView:
      type: object
      additionalProperties: false
      required: [connector_id, connector_version, capability_id]
      description: 'Обязательная ссылка на точную capability коннектора — резолвится против CapabilityDeclaration 1-8 (Complete-дисциплина: неполная = unsupported, на действие опереться нельзя)'
      properties:
        connector_id: { type: string, minLength: 1 }
        connector_version: { type: string, minLength: 1 }
        capability_id: { type: string, minLength: 1 }
    ActionConditionsView:
      type: object
      additionalProperties: false
      required: [risk_class, autonomy_class, allowed_conversation_modes, allowed_roles, required_facts, confirmation, required_gates, timeout_ms, materiality_class, consumption_rule, allowed_stages]
      description: 'Полная типизированная система условий — каждое поле обязано быть словом compile-time словаря (расширение рантаймом/конфигом тенанта NEVER)'
      properties:
        risk_class: { type: string, enum: [low, medium, high, critical] }
        autonomy_class: { type: string, enum: [shadow, copilot, assisted, auto, exception], description: 'Словарь FR-42' }
        allowed_conversation_modes: { type: array, minItems: 1, items: { type: string, enum: [safety, claim, cancellation, privacy_no_contact, human_requested, unclassified, sales] }, description: 'Непустое подмножество лестницы 2-5 (зеркало ModeOrder, пиннится контракт-тестом)' }
        allowed_roles: { type: array, minItems: 1, items: { type: string, enum: [owner, configurator, operator, expert_qa, integration_admin] }, description: 'Непустое подмножество ролей identity' }
        required_facts: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ActionFactRequirementView' } }
        confirmation: { type: string, enum: [required, not_required], description: 'Confirm-before-mutate AD-6: мутирующие классы — только required; unsafe — всегда required' }
        required_gates: { type: array, minItems: 1, items: { type: string, enum: [OQ-1, OQ-2, OQ-3, OQ-4, OQ-5, OQ-6, OQ-7A, OQ-7B, OQ-8, OQ-9, OQ-10, OQ-11, OQ-12, OQ-13A, OQ-13B, OQ-14, OQ-15, OQ-16, OQ-17, OQ-18, OQ-19, AG-1, AG-2, AG-3, AG-4] }, description: 'Слова GATE-REGISTRY (25 ID, пиннятся контракт-тестом против машинного реестра)' }
        timeout_ms: { type: integer, minimum: 1, maximum: 600000 }
        materiality_class: { type: string, enum: [immaterial, material, critical] }
        consumption_rule: { type: string, enum: [single_use, bounded, unlimited] }
        allowed_stages: { type: array, minItems: 1, items: { type: string, enum: [synthetic, closed_account_test, controlled_real_customer, live, scale] }, description: 'Непустое подмножество стадий GATE-REGISTRY' }
    ActionFactRequirementView:
      type: object
      additionalProperties: false
      required: [material_field, freshness]
      description: 'Одна материальная зависимость действия: поле 2-7 + слово свежести'
      properties:
        material_field: { type: string, enum: [price, availability, order_status] }
        freshness: { type: string, enum: [fresh, stale, failed, unknown] }
    ActionDeliveryContractView:
      type: object
      additionalProperties: false
      required: [capability_class, idempotency_scope, terminal_evidence, reconciliation_query, cancel_compensation_semantics]
      description: 'Классификация delivery (AC-3): класс НЕ самосогласен — свёрен с CapabilityDeclaration провайдера (provider_idempotent требует Idempotent=true; query_reconcilable требует непустой Reconciliation). unsafe остаётся в человеческом контуре: confirmation required + single_use'
      properties:
        capability_class: { type: string, enum: [provider_idempotent, query_reconcilable, compensatable, unsafe] }
        idempotency_scope: { type: string, minLength: 1, description: 'Отсутствие слова = запрет' }
        terminal_evidence: { type: string, minLength: 1, description: 'Отсутствие слова = запрет' }
        reconciliation_query: { type: string, minLength: 1, description: 'Идентификатор capability сверки' }
        cancel_compensation_semantics: { type: string, minLength: 1, description: 'Отсутствие слова = запрет' }
    ScopedControlView:
      type: object
      additionalProperties: false
      required: [scope_kind, scope_ref, mode, corrupted, reason, actor_id, prev_mode, generation, scheduled_start_at, expires_at, state, updated_at]
      description: 'Контрольная точка (3.2): scope-пара + режим + причина + владелец + монотонное поколение + чтение-временное окно + состояние; снятая точка — история, не отсутствие; mode — SAFE-чтение: испорченное значение читается paused (наиболее безопасный применимый, fail-closed), пометка corrupted честна'
      properties:
        scope_kind: { type: string, enum: [tenant, connector, channel, service, policy_outcome, autonomy_class, campaign], description: 'Закрытый словарь семи слов (порядок = детерминированный tie-break)' }
        scope_ref: { type: string, minLength: 1, maxLength: 120, description: 'По виду: tenant — материальное равенство собственного тенента (AC-1); connector — слово живого реестра 1-8; channel — ControlScopeRefChannel; policy_outcome — ControlScopeRefPolicyOutcome; autonomy_class — ControlScopeRefAutonomyClass; service/campaign — форма [a-z0-9._-] честной границей без реестра' }
        mode: { type: string, enum: [accept, intake_only/no_promises, human_only, paused], description: 'Слова AD-12 ДОСЛОВНО: слэш intake_only/no_promises — часть слова, переименование запрещено зеркальной дисциплиной; порядок перечисления нормативен (accept наименее, paused наиболее безопасный)' }
        corrupted: { type: boolean, description: 'Хранимое слово вне словаря: чтение отдало paused — повреждение НИКОГДА не расширяет допуск' }
        reason: { type: string, minLength: 1, maxLength: 500, description: 'Причина последнего изменения дословно (обязательна на каждой мутации)' }
        actor_id: { type: string, format: uuid, description: 'Оператор последнего изменения' }
        prev_mode: { type: string, enum: ['', accept, intake_only/no_promises, human_only, paused], description: 'Режим до последнего изменения; пусто при первой установке; resume сохраняет снятое слово как материал истории' }
        generation: { type: integer, format: int64, minimum: 1, description: 'Монотонная версия СОСТОЯНИЯ: растёт на установку И снятие, НИКОГДА не сбрасывается — переустановка не притворяется старым поколением (stale-детекция будущего не обманывается)' }
        scheduled_start_at: { type: string, format: date-time, nullable: true, description: 'Окно [start, expires): null = без границы; чтение-временная семантика — запланированное будущее не действует' }
        expires_at: { type: string, format: date-time, nullable: true, description: 'Истёкший не действует; истечение идемпотентно by construction (пересчёт по оставшимся, снимков нет)' }
        state: { type: string, enum: [active, removed], description: 'Снятие НЕ удаление: removed — живое состояние истории' }
        updated_at: { type: string, format: date-time, description: 'UTC, RFC3339' }
    EffectiveControlView:
      type: object
      additionalProperties: false
      required: [mode, influencing, reason, intersection, corrupted]
      description: 'Итоговый режим маршрута (AC-3): наиболее ограничивающее пересечение (ранг-максимум); провенанс ВСЕХ повлиявших, НЕ только победителя; отсутствующие controls = accept (маршрут не ограничен — честное пустое состояние)'
      properties:
        mode: { type: string, enum: [accept, intake_only/no_promises, human_only, paused], description: 'Пересечение ранг-максимум: более узкое разрешение НЕ отменяет более широкую блокировку' }
        influencing: { type: array, items: { $ref: '#/components/schemas/ScopedControlView' }, description: 'Каждая действующая в момент чтения точка маршрута (окно-фильтр)' }
        reason: { type: string, description: 'Причина самого ограничивающего правила (пусто, когда ничего не ограничивает)' }
        intersection: { type: array, items: { type: string, enum: [accept, intake_only/no_promises, human_only, paused] }, description: 'Слова пересечения в порядке лестницы, без повторов — читатель видит ЧТО встретилось, не только победителя' }
        corrupted: { type: boolean, description: 'Хотя бы одна повлиявшая точка хранит испорченное слово: читается paused, допуск не расширяется' }
    SetScopedControlRequest:
      type: object
      additionalProperties: false
      required: [scope_kind, scope_ref, mode, reason, expected_generation]
      description: 'Установка/переустановка точки: словарная валидация ДО транзакции (отказ = 400 без аудита); expected_generation 0 адресует несуществующую точку (первая установка); конкурентность оптимистичная — несовпадение = 409 с материалом актуального состояния (AC-11)'
      properties:
        scope_kind: { type: string, enum: [tenant, connector, channel, service, policy_outcome, autonomy_class, campaign] }
        scope_ref: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9._-]+$', description: 'По видам: tenant — собственный id; connector — живой реестр; channel/policy_outcome/autonomy_class — словарные слова (зеркала-схемы ниже); service/campaign — форма без реестра' }
        mode: { type: string, enum: [accept, intake_only/no_promises, human_only, paused] }
        reason: { type: string, minLength: 1, maxLength: 500, description: 'Причина обязательна: пустая = отказ' }
        expected_generation: { type: integer, format: int64, minimum: 0, description: '0 = первая установка; ненулевое ожидание несуществующей точки = честный 404' }
        scheduled_start_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true, description: 'Окно обязано быть непустым неперевёрнутым [start, expires)' }
    ResumeScopedControlRequest:
      type: object
      additionalProperties: false
      required: [scope_kind, scope_ref, reason, expected_generation]
      description: 'Снятие точки (resume): состояние removed, поколение растёт, история/аудит остаются; точка обязана существовать (404 иначе); повторное снятие уже-removed = словарный 400'
      properties:
        scope_kind: { type: string, enum: [tenant, connector, channel, service, policy_outcome, autonomy_class, campaign] }
        scope_ref: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9._-]+$' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expected_generation: { type: integer, format: int64, minimum: 1, description: 'Точка материальна: ожидание обязано адресовать существующее поколение' }
    ControlScopeRefChannel:
      type: string
      enum: [phone, web_chat, telegram, whatsapp, email, max, jivo, avito, mobile_app_chat]
      description: 'Допустимые scope_ref вида channel: зеркало девяти каналов cases (пиннится контракт-тестом против живого словаря — дрейф = красный тест)'
    ControlScopeRefPolicyOutcome:
      type: string
      enum: [commercial_answer, informational_answer, clarify, mode_blocked, degraded_mode, fail_closed]
      description: 'Допустимые scope_ref вида policy_outcome: зеркало классов исходов 2-6 (живой источник, degraded_mode вошёл в 2-12)'
    ControlScopeRefAutonomyClass:
      type: string
      enum: [shadow, copilot, assisted, auto, exception]
      description: 'Допустимые scope_ref вида autonomy_class: пять слов FR-42 (зеркало против action-домена 3-1)'
    ControlAuditOutcome:
      type: string
      enum: [applied, conflict]
      description: 'Исходы append-only аудита миграции control/00001 (слова CHECK): КОНФЛИКТ тоже первая строка истории — обе конкурентные попытки материальны (AC-11); read-поверхность аудита — будущие срезы'
    ExternalCommitmentView:
      type: object
      additionalProperties: false
      required: [items, purpose_words, recipient_words, ack_words, relay_words, channel_words, state_words, panel_text, empty_text]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExternalCommitmentWorkItemView' }, description: 'Секции по Work Item; пустой массив — честное состояние кейса без конвертов' }
        purpose_words: { type: array, items: { type: string }, description: 'Словарь назначений эпика (4 слова)' }
        recipient_words: { type: array, items: { type: string }, description: 'Словарь получателей (2 слова; executor — честный Never, реестры Epic 5)' }
        ack_words: { type: array, items: { type: string }, description: 'Словарь требования квитанции (2 слова)' }
        relay_words: { type: array, items: { type: string }, description: 'Словарь наблюдений оператора (3 слова — 2-12 ConfirmerOperatorRelay)' }
        channel_words: { type: array, items: { type: string }, description: 'Зеркало девяти слов каналов cases' }
        state_words: { type: array, items: { type: string }, description: 'Семь слов доставки AC-7' }
        panel_text: { type: string, description: 'Фиксированный интро панели: дисциплины среза' }
        empty_text: { type: string, description: 'Честная причина пустоты — читаемое состояние, не дефект' }
    ExternalCommitmentWorkItemView:
      type: object
      additionalProperties: false
      required: [work_item_id, versions]
      properties:
        work_item_id: { type: string, format: uuid }
        versions: { type: array, items: { $ref: '#/components/schemas/ExternalCommitmentVersionCard' } }
    ExternalCommitmentVersionCard:
      type: object
      additionalProperties: false
      required: [version, enqueued, delivery, readiness, readiness_text, current, approved, approver_id, events]
      properties:
        version: { $ref: '#/components/schemas/ExternalCommitmentVersionWire' }
        enqueued: { type: boolean, description: 'Доказательство очереди: outbox запись пинит точную версию — слова не уходили by construction (AC-3); события уточняют состояние, доказательство не исчезает' }
        delivery: { $ref: '#/components/schemas/ExternalDeliveryWire' }
        readiness: { $ref: '#/components/schemas/ExternalReadinessWord' }
        readiness_text: { type: string, description: 'Текст отказа неготовности (пустая строка = ready); слово решает забор ПО ПОРЯДКУ' }
        current: { type: boolean, description: 'Максимальный номер версии конверта wins — superseded назван текстом, не цветом' }
        approved: { type: boolean, description: 'Approval строка ТОЧНОЙ версии (append-only)' }
        approver_id: { type: string, description: 'Утвердивший (пустая строка — не утверждена)' }
        events: { type: array, items: { $ref: '#/components/schemas/ExternalDispatchEventWire' }, description: 'Append-only история диспетчеризации версии' }
    ExternalCommitmentVersionWire:
      type: object
      additionalProperties: false
      required: [case_id, work_item_id, ext_commitment_id, version_no, purpose, recipient_kind, channel, content_text, valid_until, expected_next_step, ack_requirement, pin, owner_kind, owner_ref, owner_epoch, decision_no, profile_version, policy_outcome_no, content_token, actor_id, created_at]
      properties:
        case_id: { type: string, format: uuid }
        work_item_id: { type: string, format: uuid }
        ext_commitment_id: { type: string, format: uuid, description: 'Стабильный идентификатор конверта' }
        version_no: { type: integer, minimum: 1, description: 'Монотонная лестница: изменённый текст = новая строка, прежние не мутируют' }
        purpose: { $ref: '#/components/schemas/ExternalPurpose' }
        recipient_kind: { $ref: '#/components/schemas/ExternalRecipientKind' }
        channel: { $ref: '#/components/schemas/ExternalChannel' }
        content_text: { type: string, minLength: 1, maxLength: 2000, description: 'Материал конверта (домен 2000 рун; миграция байт-бэкстоп 8000)' }
        valid_until: { type: string, format: date-time, description: 'Окно строго будущее на записи; истёкшее = readiness expired' }
        expected_next_step: { type: string, minLength: 1, maxLength: 200 }
        ack_requirement: { $ref: '#/components/schemas/ExternalAckRequirement' }
        pin: { $ref: '#/components/schemas/ExternalCommitmentPinWire' }
        owner_kind: { type: string, enum: [human, staffy] }
        owner_ref: { type: string, format: uuid }
        owner_epoch: { type: integer, minimum: 1, description: 'Снимок epoch на записи; двинувшийся владелец = readiness owner_stale' }
        decision_no: { type: integer, minimum: 0, description: 'Lineage-числа (0 — честно нет)' }
        profile_version: { type: integer, minimum: 0 }
        policy_outcome_no: { type: integer, minimum: 0 }
        content_token: { type: string, pattern: '^[0-9a-f]{64}$', description: 'HMAC материала точной версии (пространство external_commitment:v1: отделено от 2.9)' }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ExternalCommitmentPinWire:
      type: object
      additionalProperties: false
      required: [commitment_id, version_no, content_token]
      properties:
        commitment_id: { type: string, description: 'Пустая строка — пин отсутствует (all-or-nothing: тройка либо полна, либо нулевая)' }
        version_no: { type: integer, description: '0 — пин отсутствует' }
        content_token: { type: string, description: 'Токен точной версии 2.9' }
    ExternalDeliveryWire:
      type: object
      additionalProperties: false
      required: [state, state_text, last_event_no, last_kind, last_reason, last_attempt_no, last_external_correlation_id, last_event_at]
      properties:
        state: { $ref: '#/components/schemas/ExternalDeliveryState' }
        state_text: { type: string, description: 'Фиксированный доменный текст: submitted НЕ доставка, delivered НЕ принятие, unknown называет reconciliation (AC-7)' }
        last_event_no: { type: integer, description: '0 — событий нет (persisted/queued)' }
        last_kind: { type: string, description: 'Слово последнего события (пустое — событий нет)' }
        last_reason: { type: string, description: 'Причина cancelled_stale (слова не ушли)' }
        last_attempt_no: { type: integer }
        last_external_correlation_id: { type: string, description: 'Корреляция AC-8' }
        last_event_at: { type: string, format: date-time, nullable: true, description: 'null — событий нет' }
    ExternalDispatchEventWire:
      type: object
      additionalProperties: false
      required: [event_no, kind, reason, reason_text, attempt_no, external_correlation_id, idempotent_guarantee, details, actor_id, created_at]
      properties:
        event_no: { type: integer, minimum: 1, description: 'Монотонная лестница append-only истории' }
        kind: { $ref: '#/components/schemas/ExternalDispatchKind' }
        reason: { $ref: '#/components/schemas/ExternalStaleReason' }
        reason_text: { type: string, description: 'Фиксированный текст причины гашения («слова не ушли»)' }
        attempt_no: { type: integer, description: '1..3 для attempt-событий; 0 — receipt/gasp' }
        external_correlation_id: { type: string, maxLength: 200, description: 'Корреляция провайдера AC-8' }
        idempotent_guarantee: { type: boolean, description: 'ЗАПИСАННОЕ слово capability-гарантии попытки — политика повтора читает запись, не угадывает' }
        details: { type: string, maxLength: 500, description: 'Safe-текст: корреляция, исход, причина — НИКОГДА содержание (AC-10)' }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    CreateExternalCommitmentRequest:
      type: object
      additionalProperties: false
      required: [purpose, recipient_kind, channel, content_text, valid_until, expected_next_step, ack_requirement]
      properties:
        ext_commitment_id: { type: string, format: uuid, description: 'Необязателен: пусто — сервер минтит новый; существующий продолжает лестницу версий конверта' }
        purpose: { $ref: '#/components/schemas/ExternalPurpose' }
        recipient_kind: { $ref: '#/components/schemas/ExternalRecipientKind' }
        channel: { $ref: '#/components/schemas/ExternalChannel' }
        content_text: { type: string, minLength: 1, maxLength: 2000 }
        valid_until: { type: string, format: date-time, description: 'RFC3339; строго будущее — гвард отказывает границу мгновения fail-closed' }
        expected_next_step: { type: string, minLength: 1, maxLength: 200 }
        ack_requirement: { $ref: '#/components/schemas/ExternalAckRequirement' }
        pin: { $ref: '#/components/schemas/ExternalCommitmentPinInput' }
    ExternalCommitmentPinInput:
      type: object
      additionalProperties: false
      required: [commitment_id, version_no, content_token]
      properties:
        commitment_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        content_token: { type: string, pattern: '^[0-9a-f]{64}$' }
      description: 'Пин 2.9 all-or-nothing: offer ТРЕБУЕТ полную тройку; частичная тройка — словарный 400 гварда; живая сверка STORED токена — в app'
    RelayExternalReceiptRequest:
      type: object
      additionalProperties: false
      required: [observation]
      properties:
        observation: { type: string, enum: [delivered, acknowledged, failed], description: 'Наблюдение канала словами 2-12: человек передаёт, машина не изобретает' }
    ExternalCommitmentOutcome:
      type: object
      additionalProperties: false
      required: [command, ext_commitment_id, version_no]
      properties:
        command: { type: string }
        ext_commitment_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        content_token: { type: string, description: 'Токен материала точной версии (опционально на проводе)' }
    ExternalApprovalOutcome:
      type: object
      additionalProperties: false
      required: [ext_commitment_id, version_no, approval_recorded]
      properties:
        ext_commitment_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        approval_recorded: { type: boolean, description: 'false — молчаливая идемпотентность повтора того же approver (UNIQUE)' }
    ExternalEnqueueOutcome:
      type: object
      additionalProperties: false
      required: [ext_commitment_id, version_no, queued]
      properties:
        ext_commitment_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        queued: { type: boolean, description: 'true — outbox запись создана; слова сохранены ДО отправки' }
    ExternalRelayOutcome:
      type: object
      additionalProperties: false
      required: [ext_commitment_id, version_no, kind]
      properties:
        ext_commitment_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        kind: { type: string, enum: [receipt_delivered, receipt_acknowledged, receipt_failed], description: 'Квитанционное слово истории; состояние чтения решает последнее событие, не этот ответ' }
    ExternalDrainResult:
      type: object
      additionalProperties: false
      required: [considered, gassed, submitted, delivered, failed_retry, unknown_parked, skipped, reports]
      properties:
        considered: { type: integer, description: 'Bound 500 за запуск; остальные ждут следующего прогона' }
        gassed: { type: integer, description: 'Гашения cancelled_stale — слова не ушли' }
        submitted: { type: integer }
        delivered: { type: integer }
        failed_retry: { type: integer, description: 'Предотправочные отказы — повтор в bound тем же ключом' }
        unknown_parked: { type: integer, description: 'Timeout без гарантии — парковка reconciliation 3-7, слепой повтор структурно исключён' }
        skipped: { type: integer, description: 'Токен-тревога (reconciliation), raced twins, bound-парковки' }
        reports: { type: array, items: { $ref: '#/components/schemas/ExternalDrainReport' } }
    ExternalDrainReport:
      type: object
      additionalProperties: false
      required: [ext_commitment_id, version_no, text]
      properties:
        ext_commitment_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        text: { type: string, description: 'Честный построчный отказ прогона' }
