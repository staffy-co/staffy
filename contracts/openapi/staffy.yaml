        basis: { type: string, description: 'Дата, основание и подтвердивший участник (FR-85)' }
        limits_check: { type: string, enum: [ok, exceeded, no_budget], description: 'Результат перепроверки лимитов при resume' }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    BudgetVersion:
      type: object
      required: [version, amount, currency, period_start, period_end, warning_threshold_percent, limit_policy, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        warning_threshold_percent: { type: integer, minimum: 1, maximum: 100 }
        hard_limit: { type: number, description: 'Оценивается только подтверждённым расходом' }
        limit_policy: { type: string, enum: [block_new_admissions, degraded, notify_only] }
        anomaly_thresholds: { type: array, items: { $ref: '#/components/schemas/AnomalyThreshold' } }
        note: { type: string }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    AnomalyThreshold:
      type: object
      required: [category, max_quantity]
      properties:
        category: { type: string }
        max_quantity: { type: number }
        unit: { type: string }
    UsageSource:
      type: object
      required: [registration_id, name, categories, freshness_minutes, retired, created_at]
      properties:
        registration_id: { type: string, format: uuid }
        name: { type: string }
        categories: { type: array, items: { type: string } }
        freshness_minutes: { type: integer }
        retired: { type: boolean }
        note: { type: string }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    UsageEvent:
      type: object
      required: [event_id, event_key, source, category, quantity, unit, is_estimate, period_start, period_end, occurred_at, ingested_at, provenance, agg_rule_version]
      properties:
        event_id: { type: string, format: uuid }
        event_key: { type: string, description: 'Tenant-scoped идемпотентный ключ события' }
        payload_hash: { type: string, description: 'Материальный payload: тот же ключ с иным hash — конфликт' }
        source: { type: string }
        category: { type: string }
        quantity: { type: number }
        unit: { type: string }
        amount: { type: number }
        currency: { type: string }
        is_estimate: { type: boolean, description: 'Оценка отделяется от подтверждённого начисления' }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        occurred_at: { type: string, format: date-time }
        ingested_at: { type: string, format: date-time }
        employee_id: { type: string, description: 'Идентификатор, не содержимое' }
        channel: { type: string }
        release_version: { type: string }
        provenance: { type: string }
        agg_rule_version: { type: string, description: 'Версия правил агрегации штампуется при приёме' }
        actor_id: { type: string, format: uuid }
    BudgetMeter:
      type: object
      required: [level, data_status, agg_rule_version, budget_quality]
      properties:
        level: { type: string, enum: [full, summary] }
        data_status: { type: string, enum: [complete, partial, stale, unknown], description: 'Неизвестный расход не заменяется нулём' }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        last_ingested_at: { type: string, format: date-time }
        agg_rule_version: { type: string }
        categories: { type: array, items: { $ref: '#/components/schemas/CategoryMeter' } }
        missing_categories: { type: array, items: { type: string }, description: 'Категории без зарегистрированного источника' }
        confirmed_total: { type: object, additionalProperties: { type: number }, description: 'Подтверждённые суммы по валютам' }
        estimate_total: { type: object, additionalProperties: { type: number }, description: 'Оценки по валютам — отдельно от подтверждённого' }
        budget: { $ref: '#/components/schemas/BudgetRelation' }
        budget_quality: { type: string, enum: [budget_not_set, within_budget, near_threshold, over_budget] }
        breakdowns: { type: array, items: { $ref: '#/components/schemas/BreakdownRow' } }
    CategoryMeter:
      type: object
      required: [category, title, unit, status, status_note]
      properties:
        category: { type: string }
        title: { type: string }
        unit: { type: string }
        event_count: { type: integer }
        quantity: { type: number }
        money_confirmed: { type: object, additionalProperties: { type: number } }
        money_estimate: { type: object, additionalProperties: { type: number } }
        status: { type: string, enum: [complete, partial, stale, unknown] }
        status_note: { type: string }
        sources: { type: array, items: { type: string } }
        last_ingested_at: { type: string, format: date-time }
    BudgetRelation:
      type: object
      required: [version, amount, currency]
      properties:
        version: { type: integer }
        amount: { type: number }
        currency: { type: string }
        ratio: { type: number, description: 'Отношение подтверждённого расхода к бюджету; конвертации валют нет' }
        ratio_note: { type: string }
        warned: { type: boolean }
        over: { type: boolean }
    BreakdownRow:
      type: object
      required: [dimension, value, quantity]
      properties:
        dimension: { type: string, enum: [employee, channel, release] }
        value: { type: string, description: 'Идентификатор, не содержимое разговоров' }
        quantity: { type: number }
        money: { type: number }
    AdmissionState:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [ok, blocked_new_admissions, degraded] }
        reason: { type: string }
        policy: { type: string }
        continues: { type: array, items: { type: string }, description: 'Что продолжает работать: safety, handoff, reconciliation, принятые обязательства' }
        owner: { type: string, description: 'Ответственный за следующий шаг' }
    UsageExceptionsView:
      type: object
      required: [level, exceptions]
      properties:
        level: { type: string, enum: [full, summary] }
        exceptions: { type: array, items: { $ref: '#/components/schemas/UsageException' } }
    UsageException:
      type: object
      required: [exception_id, cause, message, data_status, recommended_action, created_at]
      properties:
        exception_id: { type: string, format: uuid }
        cause: { type: string, enum: [budget_threshold, hard_limit_reached, data_gap, anomaly_tool_calls, anomaly_retry_storm, anomaly_manual_minutes, manual_entry] }
        message: { type: string, description: 'При неполных данных точная сумма не утверждается' }
        data_status: { type: string, enum: [complete, partial, stale, unknown] }
        affected_employee: { type: string }
        affected_route: { type: string }
        recommended_action: { type: string }
        acknowledged: { $ref: '#/components/schemas/ExceptionAck' }
    ExceptionAck:
      type: object
      required: [ack_id, exception_id, created_at]
      properties:
        ack_id: { type: string, format: uuid }
        exception_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        note: { type: string }
        created_at: { type: string, format: date-time }
    ReleaseView:
      type: object
      required: [employee_id, can_manage, view_scope, versions, manifests]
      properties:
        employee_id: { type: string, format: uuid }
        draft: { $ref: '#/components/schemas/ReleaseDraft' }
        versions: { type: array, items: { $ref: '#/components/schemas/ConfigVersion' } }
        manifests: { type: array, items: { $ref: '#/components/schemas/ManifestSummary' } }
        latest: { $ref: '#/components/schemas/ManifestView' }
        can_manage: { type: boolean }
        view_scope: { type: string, enum: [configuration, review-or-audit], description: 'Управление — только configuration' }
    ReleaseDraft:
      type: object
      required: [tenant_id, employee_id, revision, refs, actor_id, updated_at]
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        revision: { type: integer, description: 'CAS-ревизия mutable черновика' }
        refs: { $ref: '#/components/schemas/ConfigRefs' }
        restored_from:
          type: object
          required: [version, version_id, created_at]
          properties:
            version: { type: integer }
            version_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    ConfigVersion:
      type: object
      required: [tenant_id, employee_id, version_id, version, description, refs, actor_id, created_at]
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        version: { type: integer, description: 'Монотонный номер на Employee' }
        description: { type: string, minLength: 1, maxLength: 300 }
        refs: { $ref: '#/components/schemas/ConfigRefs' }
        actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ConfigRefs:
      type: object
      required: [brief, domain_pack, behavior, knowledge, voice]
      description: 'Честные ссылки на версии компонентов: отсутствие — явная запись с пояснением, не пустота'
      properties:
        brief:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [present, absent] }
            draft_version: { type: integer }
            note: { type: string }
        domain_pack:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [present, absent] }
            id: { type: string }
            version: { type: string }
            variants: { type: object, additionalProperties: true }
            note: { type: string }
        behavior:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [present, absent] }
            version: { type: integer }
            note: { type: string }
        knowledge:
          type: object
          required: [status, sources]
          properties:
            status: { type: string, enum: [present, absent] }
            sources:
              type: array
              items:
                type: object
                required: [source_id, version]
                properties:
                  source_id: { type: string, format: uuid }
                  version: { type: integer }
            note: { type: string }
        voice:
          type: object
          required: [status]
          description: 'Голос обязателен iff Brief включает канал phone: для текстового сотрудника — not_applicable'
          properties:
            status: { type: string, enum: [present, absent, not_applicable] }
            version: { type: integer }
            note: { type: string }
    ManifestSummary:
      type: object
      required: [config_version, manifest_id, status, digest, schema_version, sealed_at]
      properties:
        config_version: { type: integer }
        manifest_id: { type: string, format: uuid }
        status: { type: string, enum: [candidate, incomplete] }
        digest: { type: string, pattern: '^[0-9a-f]{64}$', description: 'sha256 канонического JSON' }
        schema_version: { type: integer }
        sealed_at: { type: string, format: date-time }
    ManifestView:
      type: object
      required: [config_version, manifest_id, status, digest, schema_version, sealed_at, quarantine]
      description: 'Чтение манифеста: digest перепроверяется; неизвестная схема/поля или несовпадение digest — явный quarantine с сохранённым payload'
      properties:
        config_version: { type: integer }
        manifest_id: { type: string, format: uuid }
        status: { type: string, enum: [candidate, incomplete] }
        digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        schema_version: { type: integer }
        sealed_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        content: { $ref: '#/components/schemas/ManifestContent' }
        quarantine: { type: string, enum: ['', schema_version, unknown_field, digest_mismatch] }
        quarantine_reason: { type: string }
        raw: { type: string, description: 'Сохранённый payload — не отбрасывается молчаливочно' }
    ReleaseManifest:
      type: object
      required: [tenant_id, employee_id, manifest_id, config_version, schema_version, status, digest, actor_id, sealed_at, content]
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        manifest_id: { type: string, format: uuid }
        config_version: { type: integer }
        schema_version: { type: integer }
        status: { type: string, enum: [candidate, incomplete] }
        digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        actor_id: { type: string, format: uuid }
        sealed_at: { type: string, format: date-time }
        content: { $ref: '#/components/schemas/ManifestContent' }
    ManifestContent:
      type: object
      required: [schema_version, configuration, connections, runtime_components]
      description: 'Канонический payload: фиксированный порядок полей, отсортированные массивы; только идентификаторы, версии, состояния и времена — никогда секреты и PII'
      properties:
        schema_version: { type: integer }
        configuration:
          type: object
          required: [employee_id, version_id, version, description, actor_id, created_at, refs]
          properties:
            employee_id: { type: string, format: uuid }
            version_id: { type: string, format: uuid }
            version: { type: integer }
            description: { type: string }
            actor_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            refs: { $ref: '#/components/schemas/ConfigRefs' }
        connections:
          type: array
          description: 'Отсортированы по connection_id'
          items:
            type: object
            required: [connection_id, connector_id, contract_version, adapter_build, environment, status, capabilities]
            properties:
              connection_id: { type: string, format: uuid }
              connector_id: { type: string }
              contract_version: { type: string }
              adapter_build: { type: string }
              environment: { type: string, enum: [sandbox, test] }
              status: { type: string }
              capabilities:
                type: array
                description: 'Отсортированы по capability; непроверенная/просроченная capability — явный gap, не подменяемый другим аккаунтом'
                items:
                  type: object
                  required: [capability, state, state_reason, gap, reconciliation_owner]
                  properties:
                    capability: { type: string }
                    state: { type: string, enum: [unverified, verifying, verified, unsupported, failed, unknown, stale] }
                    state_reason: { type: string }
                    evidence:
                      type: object
                      required: [evidence_id, outcome, checked_at, expires_at]
                      properties:
                        evidence_id: { type: string, format: uuid }
                        outcome: { type: string, enum: [verified, failed, unknown] }
                        checked_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                    gap: { type: boolean }
                    reconciliation_owner: { type: string }
        runtime_components:
          type: array
          description: 'Фиксированный словарь домена; в этом срезе каждый компонент честно отсутствует'
          items:
            type: object
            required: [component, present, owner, responsible]
            properties:
              component: { type: string, enum: [model_route, media_route, prompt_assembly, tool_schemas, policy_bundle, eval_set, runtime_build, autonomy_envelope] }
              present: { type: boolean }
              ref: { type: string }
              owner: { type: string }
              responsible: { type: string }
              note: { type: string }
    RestoreResult:
      type: object
      required: [draft, issues]
      properties:
        draft: { $ref: '#/components/schemas/ReleaseDraft' }
        issues:
          type: array
          description: 'Честный отчёт несовместимостей против текущих фактов; восстановление не блокируется, но ничего не скрывает'
          items:
            type: object
            required: [area, subject, problem]
            properties:
              area: { type: string, enum: [brief, domain_pack, knowledge, behavior, voice, connection, capability] }
              subject: { type: string }
              problem: { type: string }
    ProfileView:
      type: object
      required: [employee_id, readiness, applicability, route_states, matrix_coverage, threshold_states, can_manage, view_scope]
      description: 'Operating Profile — правила и границы работы; профиль никогда не «допускает» маршрут: состояния выводятся для будущего admission (Story 1.14)'
      properties:
        employee_id: { type: string, format: uuid }
        draft: { $ref: '#/components/schemas/ProfileDraft' }
        readiness:
          type: array
          description: 'Перечень незаполненного/невалидного, ведущий к конкретному разделу и полю; пустой список — черновик готов к утверждению'
          items: { $ref: '#/components/schemas/ProfileRuleError' }
        approved: { $ref: '#/components/schemas/ProfileVersion' }
        applicability:
          type: object
          required: [state, reason]
          properties:
            state: { type: string, enum: [none, current, stale, unapproved_changes], description: 'stale — запечатан новый манифест; unapproved_changes — черновик изменён после утверждения' }
            reason: { type: string }
        route_states:
          type: array
          items:
            type: object
            required: [route, state]
            properties:
              route: { $ref: '#/components/schemas/ProfileRoute' }
              state: { type: string, enum: [clear, blocked], description: 'clear — «не заблокирован этим профилем», не разрешение на трафик' }
              reason: { type: string }
              unlock_owner: { type: string }
              unlock_owner_id: { type: string, format: uuid }
        matrix_coverage:
          type: array
          description: 'Декартово произведение journeys Pack × маршруты × режимы × классы; пустая ячейка — явный gap, «не допущено» отображается, а не исключается; wildcards отсутствуют'
          items:
            type: object
            required: [journey, route, conversation_mode, autonomy_class, state]
            properties:
              journey: { type: string }
              route: { $ref: '#/components/schemas/ProfileRoute' }
              conversation_mode: { type: string }
              autonomy_class: { type: string }
              state: { type: string, enum: [covered, gap, not_admitted] }
              cell:
                type: object
                properties:
                  not_admitted: { type: boolean }
                  not_admitted_reason: { type: string }
                  eval_ref: { type: string }
                  gate_refs: { type: array, items: { type: string } }
                  human_fallback: { type: string }
        threshold_states:
          type: array
          items: { $ref: '#/components/schemas/ThresholdState' }
        latest_manifest:
          type: object
          required: [manifest_id, config_version, digest]
          properties:
            manifest_id: { type: string, format: uuid }
            config_version: { type: integer }
            digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        can_manage: { type: boolean }
        view_scope: { type: string, enum: [configuration, review-or-audit] }
    ProfileDraft:
      type: object
      required: [tenant_id, employee_id, revision, manifest, content, actor_id, updated_at]
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        revision: { type: integer, description: 'CAS-ревизия единственного mutable черновика' }
        approved_revision: { type: integer, description: 'Ревизия, чьё содержание утверждено; больше — есть неутверждённые изменения' }
        manifest:
          type: object
          required: [manifest_id, config_version, digest]
          description: 'Точная ссылка на запечатанный манифест; сверяется с записанной строкой при каждой записи'
          properties:
            manifest_id: { type: string, format: uuid }
            config_version: { type: integer, minimum: 1 }
            digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        content: { $ref: '#/components/schemas/ProfileContent' }
        actor_id: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    ProfileVersion:
      type: object
      required: [tenant_id, employee_id, version, manifest, content, digest, approver_id, approver_roles, step_up_verified, description, evidence_refs, approved_at]
      description: 'Неизменяемая утверждённая версия: монотонный номер, канонический sha256-digest, approver-роли на момент утверждения'
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        version: { type: integer, description: 'Монотонный номер под блокировкой черновика' }
        manifest:
          type: object
          required: [manifest_id, config_version, digest]
          properties:
            manifest_id: { type: string, format: uuid }
            config_version: { type: integer }
            digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        content: { $ref: '#/components/schemas/ProfileContent' }
        digest: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Канонический sha256-digest содержания; никогда не пересчитывается для «миграции»' }
        approver_id: { type: string, format: uuid }
        approver_roles: { type: array, items: { type: string }, description: "Роли approver-а на момент утверждения" }
        step_up_verified: { type: boolean, description: 'CHECK-ограничение true: утверждения без step-up не существует' }
        description: { type: string, minLength: 1, maxLength: 300 }
        evidence_refs: { type: array, items: { type: string } }
        approved_at: { type: string, format: date-time }
    ProfileContent:
      type: object
      description: 'Содержание профиля по разделам; идентификаторы, ссылки и решения — секреты, raw PII, transcripts и защищённые медиа структурно не входят'
      required: [work_scope, human_coverage, privacy_assignments, operational_level, measurement_dictionary, gate_declarations, coverage_matrix, conversation_modes, autonomy_classes]
      properties:
        work_scope:
          type: object
          required: [routes, forbidden_routes, languages, window, limits, admission_stop_conditions]
          properties:
            routes: { type: array, items: { $ref: '#/components/schemas/ProfileRoute' } }
            forbidden_routes:
              type: array
              items:
                type: object
                required: [route, reason]
                properties:
                  route: { $ref: '#/components/schemas/ProfileRoute' }
                  reason: { type: string, minLength: 1, maxLength: 300 }
            languages: { type: array, minItems: 1, maxItems: 12, items: { type: string } }
            window:
              type: object
              required: [days, start, end, time_zone]
              properties:
                days: { type: array, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }
                start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                time_zone: { type: string, description: 'IANA-таймзона (проверяется загрузкой зоны)' }
            limits:
              type: object
              required: [max_concurrent_conversations_tenant, max_concurrent_calls_tenant, per_route]
              properties:
                max_concurrent_conversations_tenant: { type: integer, minimum: 1 }
                max_concurrent_calls_tenant: { type: integer, minimum: 1 }
                per_route:
                  type: array
                  items:
                    type: object
                    required: [route, max_concurrent_conversations]
                    properties:
                      route: { $ref: '#/components/schemas/ProfileRoute' }
                      max_concurrent_conversations: { type: integer, minimum: 1 }
                      max_concurrent_calls: { type: integer, description: 'Только для голосовых маршрутов' }
            admission_stop_conditions: { type: array, minItems: 1, maxItems: 32, items: { type: string, minLength: 1, maxLength: 300 } }
        human_coverage:
          type: array
          description: 'Обязательное покрытие каждого разрешённого маршрута; voicemail/queue/technical_transfer — не подтверждённый handoff без capability evidence'
          items:
            type: object
            required: [route, response_owner_id, backup_owner_id, days, start, end, ack_deadline_minutes, fallback]
            properties:
              route: { $ref: '#/components/schemas/ProfileRoute' }
              response_owner_id: { type: string, format: uuid }
              backup_owner_id: { type: string, format: uuid }
              days: { type: array, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }
              start: { type: string }
              end: { type: string }
              ack_deadline_minutes: { type: integer, minimum: 1 }
              fallback: { type: string, enum: [human_callback, voicemail, queue, technical_transfer] }
              fallback_evidence: { type: string, maxLength: 300 }
        privacy_assignments:
          type: array
          description: 'Назначения per (маршрут × цель из 5) с раздельными параметрами: общий consent-флаг структурно невозможен; OQ-11 open блокирует только затронутый маршрут'
          items:
            type: object
            required: [route, purpose, in_use, oq11_state]
            properties:
              route: { $ref: '#/components/schemas/ProfileRoute' }
              purpose: { type: string, enum: [recording, stt_model_processing, media_processing, transfer, marketing_contact] }
              in_use: { type: boolean, description: 'false — явное «не используется»' }
              legal_basis: { type: string, maxLength: 300 }
              consent_ref: { type: string, maxLength: 300 }
              disclosure: { type: string, maxLength: 300 }
              retention: { type: string, maxLength: 300 }
              deletion: { type: string, maxLength: 300 }
              withdrawal_behavior: { type: string, maxLength: 300 }
              oq11_state: { type: string, enum: [open, pass] }
              oq11_evidence: { type: string, maxLength: 300 }
        operational_level:
          type: object
          required: [level]
          description: 'RTO/RPO — цели, не доказательства: «не доказаны до drill» — постоянная честная пометка'
          properties:
            level: { type: string, enum: [best_effort, commercial] }
            rto_goal: { type: string, maxLength: 300 }
            rpo_goal: { type: string, maxLength: 300 }
            responsible_ids: { type: array, items: { type: string, format: uuid } }
            service_impact: { type: string, maxLength: 300 }
        pilot_cohort:
          type: object
          description: 'Опционален до пилота; изменение состава — только новая версия профиля с объяснением'
          required: [eligibility, intent_to_treat_denominator, assignment, attrition_policy]
          properties:
            eligibility: { type: array, items: { type: string } }
            exclusions: { type: array, items: { type: string } }
            intent_to_treat_denominator: { type: string, maxLength: 300 }
            assignment: { type: string, maxLength: 300 }
            attrition_policy: { type: string, maxLength: 300 }
        measurement_dictionary:
          type: array
          minItems: 1
          description: 'Срезы обязаны включать journey, modality, conversation_mode, release_version, autonomy_class; видимость route-blocking failure обязательна'
          items:
            type: object
            required: [id, name, business_meaning, numerator, denominator, source_of_truth, terminal_timing, slices, owner_id, dispute_resolution, route_failure_visibility]
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              name: { type: string, maxLength: 300 }
              business_meaning: { type: string, maxLength: 300 }
              numerator: { type: string, maxLength: 300 }
              denominator: { type: string, maxLength: 300 }
              source_of_truth: { type: string, maxLength: 300 }
              terminal_timing: { type: string, maxLength: 300 }
              slices: { type: array, items: { type: string } }
              owner_id: { type: string, format: uuid }
              dispute_resolution: { type: string, maxLength: 300 }
              route_failure_visibility: { type: string, maxLength: 300, description: 'Маршрут-блокирующий сбой нельзя скрыть средним показателем' }
        gate_declarations:
          type: array
          minItems: 1
          description: 'Числовой порог системой не задаётся: до решения evidence owner — честный pending baseline'
          items:
            type: object
            required: [gate_id, evidence_owner_id, decision_deadline, fail_closed_fallback, allow_role_coincidence]
            properties:
              gate_id: { type: string, minLength: 1, maxLength: 64 }
              title: { type: string, maxLength: 300 }
              evidence_owner_id: { type: string, format: uuid }
              decision_deadline: { type: string, maxLength: 300 }
              fail_closed_fallback: { type: string, enum: [block_route, block_stage, degraded] }
              allow_role_coincidence: { type: boolean, default: false }
        coverage_matrix:
          type: array
          description: 'Ячейки (journey × маршрут × режим × класс); пустая ячейка декартова произведения — явный gap; wildcards отсутствуют'
          items:
            type: object
            required: [journey, route, modality, conversation_mode, autonomy_class]
            properties:
              journey: { type: string }
              route: { $ref: '#/components/schemas/ProfileRoute' }
              modality: { type: string, enum: [voice, text], description: 'Хранится явно и согласуется с каналом маршрута: phone → voice, остальные → text; голос и текст измеряются раздельно' }
              conversation_mode: { type: string, enum: [sales, service_status, safety, claim, cancellation, privacy_no_contact, human_requested] }
              autonomy_class: { type: string, maxLength: 64 }
              not_admitted: { type: boolean }
              not_admitted_reason: { type: string, maxLength: 300 }
              eval_ref: { type: string, maxLength: 300, description: 'Ссылка без исполнения: eval-прогонов в системе нет' }
              gate_refs: { type: array, items: { type: string } }
              human_fallback: { type: string, maxLength: 300 }
        conversation_modes:
          type: array
          minItems: 1
          items: { type: string, enum: [sales, service_status, safety, claim, cancellation, privacy_no_contact, human_requested] }
        autonomy_classes:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 64 }
    ProfileRoute:
      type: object
      required: [channel, direction]
      properties:
        channel: { type: string, enum: [phone, web_chat, telegram, whatsapp, email, max, jivo, avito, mobile_app_chat] }
        direction: { type: string, enum: [inbound, outbound] }
    ProfileRuleError:
      type: object
      required: [section, field, reason, kind]
      description: 'Находитка, ведущая к конкретному разделу и полю; kind задаёт честную реакцию'
      properties:
        section: { type: string }
        field: { type: string }
        reason: { type: string }
        kind: { type: string, enum: [invalid, missing, advisory], description: 'invalid — сохранение отклонено; missing — блокирует утверждение; advisory — блокирует маршрут, не утверждение' }
        problems: { type: array, items: { $ref: '#/components/schemas/ProfileRuleError' } }
    ThresholdState:
      type: object
      required: [gate_id, state, evidence_owner_id, decision_deadline, fail_closed_fallback, allow_role_coincidence, note]
      description: 'pending_baseline до решения evidence owner; система не заявляет машинной сверки с controlled baseline'
      properties:
        gate_id: { type: string }
        state: { type: string, enum: [pending_baseline, decided] }
        value: { type: string }
        evidence_owner_id: { type: string, format: uuid }
        decision_deadline: { type: string }
        fail_closed_fallback: { type: string, enum: [block_route, block_stage, degraded] }
        allow_role_coincidence: { type: boolean }
        last_decision: { $ref: '#/components/schemas/GateThresholdVersion' }
        note: { type: string }
    GateThresholdVersion:
      type: object
      required: [tenant_id, employee_id, gate_id, threshold_version, value, actor_id, decision, evidence_refs, decided_at]
      description: 'Append-only решение порога: история не переписывается; supersedes ссылается на предыдущую версию'
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        gate_id: { type: string }
        threshold_version: { type: integer, minimum: 1 }
        value: { type: string }
        actor_id: { type: string, format: uuid }
        decision: { type: string }
        evidence_refs: { type: array, items: { type: string } }
        supersedes:
          type: object
          required: [threshold_version, decided_at]
          properties:
            threshold_version: { type: integer }
            decided_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
    ThresholdHistoryView:
      type: object
      required: [employee_id, gate_id, decisions]
      properties:
        employee_id: { type: string, format: uuid }
        gate_id: { type: string }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/GateThresholdVersion' }
    ReadinessView:
      type: object
      required: [employee_id, stage, readiness, applicability, admission_history, can_manage, view_scope]
      description: 'Dry-run деривация стадии: панель никогда не направляет трафик, enforcement — Epic 2'
      properties:
        employee_id: { type: string, format: uuid }
        stage: { type: string, enum: [synthetic, closed_account_test, controlled_real_customer, live] }
        readiness: { $ref: '#/components/schemas/ReadinessReport' }
        applicability: { type: object, description: 'Применимость утверждённого профиля к последнему манифесту (деривация 1-13)' }
        active_release: { $ref: '#/components/schemas/ReleaseAdmission' }
        admission_history: { type: array, items: { $ref: '#/components/schemas/ReleaseAdmission' } }
        can_manage: { type: boolean, description: 'configuration — true; review/audit — false (просмотр)' }
        view_scope: { type: string, enum: [configuration, review-or-audit] }
    ReadinessReport:
      type: object
      required: [stage, status, status_text, elements, routes]
      description: 'Чистая деривация живых фактов: ничего не кэшируется, stale-факты видны при следующем чтении'
      properties:
        stage: { type: string }
        status: { type: string, enum: [incomplete, blocked, ready], description: 'incomplete — обязательный элемент отсутствует; blocked — элементы заполнены, но есть блокировки (заблокированный элемент или ноль допущенных маршрутов; исключение — entitlement на synthetic); ready — все элементы pass/not_applicable и минимум один маршрут допущен' }
        status_text: { type: string }
        elements: { type: array, items: { $ref: '#/components/schemas/ReadinessElement' } }
        routes: { type: array, items: { $ref: '#/components/schemas/RouteAdmission' } }
    ReadinessElement:
      type: object
      required: [key, title, state, reason, source]
      description: 'Один обязательный элемент: 12-элементный словарь спеки; технический успех компонента не становится готовностью целого'
      properties:
        key: { type: string, enum: [operating_profile, release_manifest, brief, domain_pack, knowledge, behavior, voice, connections, capabilities, entitlement, human_coverage, consent, eval, gates] }
        title: { type: string }
        state: { type: string, enum: [missing, not_applicable, pass, blocked, linked_not_executed] }
        reason: { type: string }
        source: { type: string }
    RouteAdmission:
      type: object
      required: [route, modality, autonomy_classes, state]
      description: 'Допуск per-route: разрешение одного маршрута не расширяет остальные'
      properties:
        route: { $ref: '#/components/schemas/ProfileRoute' }
        modality: { type: string, enum: [voice, text] }
        autonomy_classes: { type: array, items: { type: string } }
        state: { type: string, enum: [admitted, blocked] }
        reasons: { type: array, items: { $ref: '#/components/schemas/RouteBlock' } }
    RouteBlock:
      type: object
      required: [cause, reason, unlock_owner, required_evidence, next_step]
      description: 'Честная блокировка маршрута: причина, владелец разблокирования, требуемое доказательство, следующий шаг'
      properties:
        cause: { type: string, description: 'route_state | capability | entitlement | eval | gate:<ID>' }
        reason: { type: string }
        unlock_owner: { type: string }
        required_evidence: { type: string }
        next_step: { type: string }
    GateInstancesView:
      type: object
      required: [employee_id, definitions, instances, can_manage, view_scope]
      properties:
        employee_id: { type: string, format: uuid }
        definitions: { type: array, items: { $ref: '#/components/schemas/GateDefinition' } }
        instances: { type: array, items: { $ref: '#/components/schemas/GateInstance' } }
        can_manage: { type: boolean }
        view_scope: { type: string }
    GateDefinition:
      type: object
      required: [definition_id, criticality, required_approver_roles, evidence_requirement, safe_state, allow_role_coincidence, route_scoped]
      description: 'Фиксированный словарь реестра: 8 платформенных определений + 6 пилотных спеки 4-1 (OQ-1..OQ-5, OQ-19; AG-4 пилотного набора — то же платформенное определение); расширение — новая версия спеки, не настройка Tenant'
      properties:
        definition_id: { type: string, enum: [OQ-1, OQ-2, OQ-3, OQ-4, OQ-5, OQ-7B, OQ-11, OQ-12, OQ-13B, OQ-14, OQ-19, AG-1, AG-2, AG-4] }
        criticality: { type: string, enum: [critical, high] }
        required_approver_roles: { type: array, items: { type: string } }
        evidence_requirement: { type: string }
        safe_state: { type: string, description: 'Fail-closed fallback до PASS' }
        allow_role_coincidence: { type: boolean }
        route_scoped: { type: boolean }
    GateInstance:
      type: object
      required: [tenant_id, employee_id, instance_id, definition_id, state, approved_by, evidence_refs, actor_id, recorded_at]
      description: 'Append-only запись жизненного цикла: INSERT/SELECT, UPDATE/DELETE грантов нет; supersedes-цепочка с одним преемником'
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        definition_id: { type: string }
        route: { $ref: '#/components/schemas/ProfileRoute' }
        modality: { type: string }
        state: { type: string, enum: [open, in_test, pass, fail, expired, not_applicable] }
        approved_by: { type: array, items: { $ref: '#/components/schemas/GateApproval' } }
        evidence_refs: { type: array, items: { type: string } }
        evidence_hash: { type: string }
        not_applicable_reason: { type: string }
        tested_at: { type: string, format: date-time }
        expiry_trigger: { type: string }
        supersedes_instance_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        recorded_at: { type: string, format: date-time }
    GateApproval:
      type: object
      required: [participant_id, role]
      properties:
        participant_id: { type: string, format: uuid }
        role: { type: string }
    PilotAdmissionView:
      type: object
      required: [tenant_id, pilot_admission, can_manage, view_scope]
      description: 'Реестр допуска пилота (спека 4-1): read-time вывод над живыми фактами — НИ ОДНОЙ записи, идемпотентность выводом; повторное чтение неизменного мира байт-стабильно'
      properties:
        tenant_id: { type: string, format: uuid }
        pilot_admission: { $ref: '#/components/schemas/PilotAdmissionReport' }
        can_manage: { type: boolean, description: 'configuration — true; review/audit — false (просмотр)' }
        view_scope: { type: string, enum: [configuration, review-or-audit] }
    PilotAdmissionReport:
      type: object
      required: [pack_pinned, pack_word, routes, matrix]
      description: 'Пин Domain Pack «Автозапчасти» (fail-closed до auto-parts@>=2.0.0), маршрутная матрица 6 слов и матрица ABCP→1С 8 материальных полей (live-состояние полей unknown — источника терминальных доказательств в срезе нет)'
      properties:
        pack_pinned: { type: boolean }
        pack_word: { type: string }
        routes: { type: array, items: { $ref: '#/components/schemas/PilotRouteView' } }
        matrix: { type: array, items: { $ref: '#/components/schemas/PilotMatrixFieldView' } }
    PilotRouteView:
      type: object
      required: [route_id, title, stage, stage_word]
      description: 'Один маршрут фиксированного словаря 6 слов: стадия min по вкладам (pack/capabilities/матрица/гейты), honest-слово стадии, требуемые capabilities и гейты с их состояниями, blockers с точными словами, fence-слова заказа (AC-9)'
      properties:
        route_id: { type: string, enum: [text_jivo, voice_sip, parts_catalog_abcp, parts_order_abcp, abcp_1c_sync, human_fallback] }
        title: { type: string }
        stage: { type: string, enum: [candidate, verified, admitted], description: 'candidate — заявлен, capabilities не доказаны; verified — capabilities доказаны, гейты не закрыты; admitted — конъюнкция всего' }
        stage_word: { type: string }
        capabilities: { type: array, items: { $ref: '#/components/schemas/PilotCapabilityView' } }
        gates: { type: array, items: { $ref: '#/components/schemas/GateRequirementView' } }
        blockers: { type: array, items: { $ref: '#/components/schemas/PilotBlockerView' } }
        fence_words: { type: array, items: { type: string }, description: 'Только parts_order_abcp: автоматическая отправка поставщику не выполняется; pending_manager_verification и явное одобрение менеджера' }
        fallback_words: { type: array, items: { type: string }, description: 'Только human_fallback: слова FR-83/OQ-17-связки минимальной операторской поверхности' }
    PilotCapabilityView:
      type: object
      required: [id, connector_id, state]
      description: 'Одна требуемая capability маршрута с производным состоянием DERIVED-словаря 1-9 (verified/unverified/…/stale); слово — точное honest-слово непроверенного состояния'
      properties:
        id: { type: string, description: 'Словарный ID каталога connector (зеркалится каталогом — drift = красный)' }
        connector_id: { type: string }
        state: { type: string, enum: [verified, unproven] }
        word: { type: string }
    PilotBlockerView:
      type: object
      required: [source, id, word, next_owner]
      description: 'Одна честная блокировка маршрута: источник (pack/capability/matrix/gate), точное слово, safe state и следующий владелец проверки; блокировка не расширяется на другие маршруты (AC-12)'
      properties:
        source: { type: string, enum: [pack, capability, matrix, gate] }
        id: { type: string }
        word: { type: string }
        safe_state: { type: string }
        next_owner: { type: string }
    GateRequirementView:
      type: object
      required: [id, state]
      description: 'Один требуемый гейт маршрута: производное состояние инстанса (pass/open/in_test/fail/expired/missing), точное слово закрытия, русское safe state и следующий владелец проверки словами владельцев канона'
      properties:
        id: { type: string, enum: [OQ-1, OQ-2, OQ-3, OQ-4, OQ-5, OQ-11, OQ-12, OQ-13B, OQ-19, AG-1, AG-2, AG-4], description: 'Гейты пилотного набора 7 (AG-4 — платформенное определение)' }
        state: { type: string }
        word: { type: string }
        safe_state: { type: string }
        next_owner: { type: string }
    PilotMatrixFieldView:
      type: object
      required: [field, title, owning_system, external_id_text, version_time_text, allowed_projection_text, conflict_rule_text, reconcile_query_text, terminal_evidence_text, state_word]
      description: 'Одно материальное поле обмена ABCP→кастомная 1С (OQ-19, AC-10): владелец системы и дисциплины; live-состояние unknown — терминального доказательства в срезе нет, успех не заявляется'
      properties:
        field: { type: string, enum: [client_order_state, client_order_id, external_1c_id, state_version_time, staffy_projection, conflict_rule, reconcile_query, terminal_evidence] }
        title: { type: string }
        owning_system: { type: string, enum: [ABCP, 1C, Staffy-Case] }
        external_id_text: { type: string }
        version_time_text: { type: string }
        allowed_projection_text: { type: string }
        conflict_rule_text: { type: string }
        reconcile_query_text: { type: string }
        terminal_evidence_text: { type: string }
        state_word: { type: string }
    ReleaseAdmission:
      type: object
      required: [tenant_id, employee_id, decision_no, stage, manifest, profile_version, profile_digest, routes, actor_id, approver_roles, step_up_verified, decided_at, digest]
      description: 'Append-only решение о допуске: монотонный номер, точные digest''ы кандидата, per-route результаты, канонический sha256-digest; секреты, raw PII и transcripts не входят'
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        decision_no: { type: integer, minimum: 1 }
        stage: { type: string, enum: [synthetic, closed_account_test, controlled_real_customer, live] }
        manifest:
          type: object
          required: [manifest_id, config_version, digest]
          properties:
            manifest_id: { type: string, format: uuid }
            config_version: { type: integer }
            digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        profile_version: { type: integer, minimum: 1 }
        profile_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        routes: { type: array, items: { $ref: '#/components/schemas/RouteAdmission' } }
        actor_id: { type: string, format: uuid }
        approver_roles: { type: array, items: { type: string }, description: 'Роли approver-а на момент решения' }
        step_up_verified: { type: boolean, description: 'CHECK-ограничение true: публикаций без step-up не существует' }
        decided_at: { type: string, format: date-time }
        digest: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Канонический sha256-digest решения (поле digest из канонических байтов исключено)' }
    AdmissionHistoryView:
      type: object
      required: [employee_id, admissions]
      properties:
        employee_id: { type: string, format: uuid }
        active_release: { $ref: '#/components/schemas/ReleaseAdmission' }
        admissions: { type: array, items: { $ref: '#/components/schemas/ReleaseAdmission' } }
    IngressEnvelope:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, connection_id, provider, provider_event_id, provider_session_id, direction, modality, channel, provider_timestamp, payload]
      properties:
        schema_version: { type: integer, enum: [1] }
        tenant_id: { type: string, format: uuid, description: 'Заявленный тенант (-routing claim); доверенный скоуп строится из верифицированного connection' }
        connection_id: { type: string, format: uuid }
        provider: { type: string, minLength: 1, maxLength: 64 }
        provider_event_id: { type: string, minLength: 1, maxLength: 128 }
        provider_session_id: { type: string, minLength: 1, maxLength: 128, description: 'Единственная доказанная связь событий — продолжение channel session' }
        direction: { type: string, enum: [inbound] }
        modality: { type: string, enum: [voice, text] }
        channel: { type: string, enum: [phone, web_chat, telegram, whatsapp, email, max, jivo, avito, mobile_app_chat] }
        provider_timestamp: { type: string, format: date-time, description: 'Время провайдера; временем приёма не считается' }
        payload: { description: 'Материальный payload — любое одно JSON-значение (объект, массив, строка, число, логическое или null); канонизируется без потери точности чисел, запечатывается, наружу — только digest' }
    IngestResult:
      type: object
      required: [event_id, case_id, conversation_id, case_no, conversation_no, response_owner_id, employee_id, new_case, replay]
      properties:
        event_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        case_no: { type: integer, minimum: 1 }
        conversation_no: { type: integer, minimum: 1 }
        response_owner_id: { type: string, format: uuid, description: 'Первоначальный владелец из human coverage запечатленной версии профиля' }
        employee_id: { type: string, format: uuid }
        new_case: { type: boolean }
        replay: { type: boolean }
    IngestOutcome:
      type: object
      description: 'Один из трёх исходов доставки: accepted (в т.ч. replay), refused (лестница; bounded — с counter) или quarantined (с исключением)'
      properties:
        accepted: { $ref: '#/components/schemas/IngestResult' }
        refused: { $ref: '#/components/schemas/IngestRefusal' }
        quarantined: { $ref: '#/components/schemas/IngestQuarantine' }
    IngestRefusal:
      type: object
      required: [kind, message, bounded]
      properties:
        kind: { type: string, enum: [malformed, unknown_connection, revoked_connection, production_forbidden, channel_mismatch, route_not_admitted, no_active_release, no_response_owner, entitlement_blocked, envelope_exceeded] }
        message: { type: string, description: 'Безопасный текст: payload не раскрывается' }
        counter: { type: integer, description: 'Счётчик bounded-исхода (байты или in-flight)' }
        bounded: { type: boolean }
    IngestQuarantine:
      type: object
      required: [kind, exception_id, event_id]
      properties:
        kind: { type: string, enum: [digest_conflict, ambiguous_employee] }
        exception_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
    CasesView:
      type: object
      required: [tenant_id, cases, operational_exceptions, can_view, view_scope]
      properties:
        tenant_id: { type: string, format: uuid }
        cases: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } }
        operational_exceptions: { type: array, items: { $ref: '#/components/schemas/OperationalException' } }
        can_view: { type: boolean }
        view_scope: { type: string }
    CaseSummary:
      type: object
      required: [case_id, case_no, employee_id, state, created_at, conversations, events, last_event_at, owner_id]
      properties:
        case_id: { type: string, format: uuid }
        case_no: { type: integer, minimum: 1 }
        employee_id: { type: string, format: uuid }
        state: { type: string, enum: [open] }
        created_at: { type: string, format: date-time }
        conversations: { type: integer }
        events: { type: integer }
        last_event_at: { type: string, format: date-time }
        owner_id: { type: string, format: uuid }
    CaseView:
      type: object
      required: [tenant_id, case, conversations, timeline, work_items, operational_exceptions, untriaged_note, no_auto_reply_note, can_view_payload, can_view_facts, can_manage_work, view_scope]
      properties:
        tenant_id: { type: string, format: uuid }
        case: { $ref: '#/components/schemas/CaseRecord' }
        conversations: { type: array, items: { $ref: '#/components/schemas/ConversationRecord' } }
        timeline: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
        work_items: { type: array, items: { $ref: '#/components/schemas/WorkItemRecord' } }
        operational_exceptions: { type: array, items: { $ref: '#/components/schemas/OperationalException' } }
        untriaged_note: { type: string }
        no_auto_reply_note: { type: string }
        can_view_payload: { type: boolean }
        can_view_facts: { type: boolean, description: 'Значения фактов — граница review/audit как payload' }
        can_manage_work: { type: boolean, description: 'Команды рабочих элементов — только review' }
        view_scope: { type: string }
        taxonomy_types: { type: array, items: { type: string }, description: 'Journeys закреплённого пака (словарь типов)' }
        critical_entities: { type: array, items: { type: string }, description: 'CriticalEntities закреплённого пака (словарь материальных ключей — подсказки форм фактов)' }
        vehicle: { $ref: '#/components/schemas/VehiclePanelView', description: 'Секция «Идентификация автомобиля» (Story 4.2): read-time профиль по схеме пака; schema_defined=false — честное слово отсутствия схемы (без хардкода)' }
        assurance: { $ref: '#/components/schemas/AssuranceView' }
        bindings: { type: array, items: { $ref: '#/components/schemas/BindingCard' } }
        duplicates: { type: array, items: { $ref: '#/components/schemas/DuplicateCard' } }
        ownership: { $ref: '#/components/schemas/OwnershipView' }
        mode: { $ref: '#/components/schemas/ModeView' }
        policy: { $ref: '#/components/schemas/PolicyView' }
        observations: { $ref: '#/components/schemas/ObservationView', description: 'Секция Owning System (Story 2.7): карточки материальных полей по WI со свежестью и конфликт-бейджем' }
        objections: { $ref: '#/components/schemas/ObjectionView', description: 'Секция «Возражения и бюджет убеждения» (Story 2.8): записи возражений по WI с производным состоянием останова убеждения' }
        commitments: { $ref: '#/components/schemas/CommitmentView', description: 'Секция «Обязательства и подтверждения» (Story 2.9): версии по WI с производной готовности, подтверждения с производной действительности, отказы' }
        continuations: { $ref: '#/components/schemas/ContinuationView', description: 'Секция «Ссылки продолжения» (Story 2.10): ссылки с read-time состояниями, delivered-связкой и лентой событий' }
        accommodations: { $ref: '#/components/schemas/AccommodationView', description: 'Секция «Предпочтения связи» (Story 2.11): текущий набор (read-time деривация), append-only история ревизий, словари формы записи' }
        route_degradations: { $ref: '#/components/schemas/RouteDegradationView', description: 'Секция «Состояние маршрутов» (Story 2.12): текущие деградации (read-time деривация), append-only история включая восстановления, словари формы записи' }
        handoff: { $ref: '#/components/schemas/HandoffView', description: 'Секция «Запрос человека» (Story 2.13): append-only запросы и события lifecycle (состояния/клиентские статусы — read-time деривации, назначение ≠ принятие), карточка назначенного, словари форм' }
        waiting: { $ref: '#/components/schemas/WaitingUpdateView', description: 'Секция «Ожидание человека» (Story 2.16): клиентский статус ожидания последнего раунда тремя различениями AC-1 + состояние последнего обещания обновления (read-time деривации над согласованным снимком; блок появляется ТОЛЬКО с материалом обещаний — контрольная ветка рендерит байт-в-байт)' }
    WaitingUpdateView:
      type: object
      required: [has_promise]
      description: 'Правдивое ожидание (первый срез Story 2.16): клиентский статус ожидания тремя различениями AC-1 (ищем специалиста / назначен, ожидаем принятия / специалист принял) + честная просрочка принятия и завершение ожидания; последнее обещание раунда — слово дедлайна, обещанный срок (NULL у честного unknown — выдуманный срок НИКОГДА), read-time состояние {pending, missed, unknown, superseded, closed} — «последняя говорит» derivation-only; персоналия/эпохи/UUID НИКОГДА в клиентских текстах (анти-раскрытие AC-1: ответственный живёт в строке и конверте, не в проекции клиента)'
      properties:
        has_promise: { type: boolean, description: 'Материал обещаний существует — блок «Ожидание человека» рендерится только с материалом (контрольная ветка: без обещаний страница байт-в-байт прежняя)' }
        client_status: { type: string, enum: [waiting_searching, waiting_assigned, waiting_accepted, waiting_overdue, waiting_cancelled, waiting_returned], description: 'Клиентский статус ожидания последнего раунда — словарь, деривация состояния раунда 2-13' }
        client_status_text: { type: string, description: 'Честный текст статуса — рендер словаря, в БД/outbox только слова' }
        promise_no: { type: integer, minimum: 1, description: 'Номер последнего обещания раунда (серверная истина под локами; читается, не запрашивается)' }
        deadline_word: { type: string, enum: [update_15m, update_1h, update_4h, update_unknown], description: 'Слово дедлайна последнего обещания — ЕДИНСТВЕННЫЙ материал записи' }
        deadline_text: { type: string, description: 'Честный текст слова дедлайна (рендер словаря)' }
        promised_at: { type: string, format: date-time, description: 'Обещанный срок: known-слово → now + окно (СЕРВЕРОМ под локами); update_unknown → отсутствует (NULL — материальная пара честности FR-41)' }
        state: { type: string, enum: [pending, missed, unknown, superseded, closed], description: 'Read-time состояние последнего обещания: missed = now > promised_at при живом раунде (латентность чтения, строка НИКОГДА не мутируется); closed = раунд закрыт; superseded — только прежние строки' }
        state_text: { type: string, description: 'Честный текст состояния — рендер словаря' }
        promise_line_text: { type: string, description: 'Клиентская строка обещания (композиция словаря: слово дедлайна + состояние + честный следующий шаг при missed)' }
        missed_next_step_text: { type: string, description: 'Честный следующий шаг просрочки: обновление отправляет человек существующим ответом 2-4 — таймеров/автоотправки/эскалации Never' }
        deadline_words: { type: array, items: { type: string, enum: [update_15m, update_1h, update_4h, update_unknown] }, description: 'Словарь дедлайн-слов формы обещания (compile-time)' }
    AssuranceView:
      type: object
      required: [state, records, allowed_methods, fallback_options, step_up_text]
      description: 'Производная секция доверия: личность/полномочия раздельно, окно порога, разрешённые методы канала'
      properties:
        state:
          type: object
          required: [StepUp, StepUpFailures]
          properties:
            IdentityLevel: { type: string, enum: [none, basic, verified] }
            IdentityMethod: { type: string }
            IdentitySubject: { type: string }
            IdentityExpiresAt: { type: string, format: date-time }
            AuthorityLevel: { type: string, enum: [none, verified] }
            AuthorityScope: { type: string }
            AuthorityExpiresAt: { type: string, format: date-time }
            StepUp: { type: boolean }
            StepUpFailures: { type: integer }
        records: { type: array, items: { $ref: '#/components/schemas/VerificationRecord' } }
        allowed_methods: { type: array, items: { type: string } }
        fallback_options: { type: array, items: { type: string } }
        step_up_text: { type: string }
    VerificationRecord:
      type: object
      required: [verification_id, kind, method, outcome, assurance_level, subject_handle, issued_at, expires_at]
      description: 'Append-only запись проверки: канонический исход, уровень, участник, evidence, оба времени; поля для секрета не существует'
      properties:
