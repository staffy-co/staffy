openapi: 3.1.0
info:
  title: Staffy API
  version: 0.1.0
  description: >-
    Application contract behind a trusted PrincipalResolver. The external login/session
    transport is intentionally deployment-neutral and is not defined by Story 1.1.
paths:
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: listKnowledgeSources
      summary: Список текстовых источников знаний черновика
      x-staffy-principal-required: true
      responses:
        '200': { description: Tenant-scoped источники и состояние актуальности }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createKnowledgeSource
      summary: Создать источник в состоянии processing после выбора Domain Pack
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeSourceCreate' }
      responses:
        '201': { description: Источник создан; содержимое ещё не обработано }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readKnowledgeSource
      summary: Просмотреть provenance и неизменяемые версии с фрагментами
      x-staffy-principal-required: true
      responses:
        '200': { description: Источник и версии с текстом, checksum и position }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}/process:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: processKnowledgeSource
      summary: Обработать допустимый UTF-8 текст до 256 КиБ
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, text]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                text: { type: string, maxLength: 262144 }
      responses:
        '200': { description: Текущая или новая immutable версия; replay при том же checksum }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}/conflict:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: markKnowledgeConflict
      summary: Отметить конфликт с сохранением обоих provenance
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, note, provenance]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                note: { type: string }
                provenance: { type: string }
      responses:
        '200': { description: Блокирующий конфликт }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}/retire:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retireKnowledgeSource
      summary: Вывести источник из эксплуатации
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Источник retired и исключён из будущего использования }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/domain-packs:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listDomainPacks
      summary: Каталог reference packs для настройки
      x-staffy-principal-required: true
      responses:
        '200':
          description: Доступные версии и требования
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain_packs: { type: array, items: { $ref: '#/components/schemas/DomainPackManifest' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/domain-pack/preview:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    post:
      operationId: previewDomainPackChange
      summary: Посмотреть последствия смены закреплённой версии
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainPackCommand' }
      responses:
        '200':
          description: Разница и зависимые слоты без изменения pin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainPackPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/domain-pack:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    put:
      operationId: pinDomainPack
      summary: Закрепить точную версию и разрешённые варианты
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainPackCommand' }
      responses:
        '200':
          description: Неопубликованный черновик и план
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listEmployees
      summary: Список черновиков ИИ-сотрудников
      x-staffy-principal-required: true
      responses:
        '200':
          description: Черновики Tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees: { type: array, items: { $ref: '#/components/schemas/EmployeeDraft' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createEmployee
      summary: Создать неопубликованный черновик
      x-staffy-principal-required: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 120, description: Необязательное начальное имя черновика }
      responses:
        '201':
          description: Черновик создан или воспроизведён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: readEmployee
      summary: Открыть черновик и план запуска
      x-staffy-principal-required: true
      responses:
        '200':
          description: Черновик и план
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithPlan' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/brief:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    patch:
      operationId: saveEmployeeBrief
      summary: Сохранить Brief с ожидаемой версией
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, brief]
              properties:
                version: { type: integer, minimum: 1 }
                brief: { $ref: '#/components/schemas/EmployeeBrief' }
      responses:
        '200':
          description: Сохранённый черновик и план
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/members:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listMembers
      summary: Список участников Tenant для Owner
      x-staffy-principal-required: true
      responses:
        '200':
          description: Участники и ожидающие приглашения
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      operationId: inviteMember
      summary: Создать или обновить приглашение
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteInput' }
      responses:
        '201':
          description: Новая одноразовая ссылка
          content:
            application/json:
              schema:
                type: object
                required: [membership, invitation_url]
                properties:
                  membership: { $ref: '#/components/schemas/Membership' }
                  invitation_url: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Принять приглашение подтверждённым адресом
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Активное membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/members/{principal_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: principal_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeMember
      summary: Изменить роли и области с повторным подтверждением
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeInput' }
      responses:
        '200':
          description: Изменённое membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: revokeMember
      summary: Отозвать доступ с повторным подтверждением
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { $ref: '#/components/schemas/RevokeReason' }
      responses:
        '204': { description: Доступ отозван }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants:
    post:
      operationId: createTenant
      summary: Создать изолированное пространство Tenant
      description: Требует principal, проверенный доверенным PrincipalResolver до вызова application API.
      x-staffy-principal-required: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
        - in: header
          name: X-Correlation-ID
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
      responses:
        '201':
          description: Tenant создан либо идемпотентно воспроизведён
          headers:
            Location: { schema: { type: string } }
            Idempotency-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    EmployeeID:
      name: employee_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    KnowledgeSourceCreate:
      type: object
      additionalProperties: false
      required: [type, title, owner, provenance, scope, priority, language]
      properties:
        type: { type: string, enum: [faq, regulation, dialogue] }
        title: { type: string, minLength: 1, maxLength: 160 }
        owner: { type: string, minLength: 1, maxLength: 160 }
        provenance: { type: string, minLength: 1, maxLength: 500 }
        scope: { type: string, minLength: 1, maxLength: 160 }
        priority: { type: integer, minimum: 0, maximum: 100 }
        language: { type: string, minLength: 2, maxLength: 32 }
        fresh_until: { type: string, format: date-time }
    EmployeeBrief:
      type: object
      additionalProperties: false
      required: [purpose, name, languages, time_zone, working_hours, desired_channels, primary_tasks]
      properties:
        purpose: { type: string, minLength: 1, maxLength: 500 }
        name: { type: string, minLength: 1, maxLength: 120 }
        languages: { type: array, minItems: 1, maxItems: 12, items: { type: string } }
        time_zone: { type: string }
        working_hours:
          type: object
          additionalProperties: false
          required: [days, start, end]
          properties:
            days: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }
            start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        desired_channels: { type: array, uniqueItems: true, description: Желание без подтверждения capability или подключения, items: { type: string, enum: [phone, web_chat, telegram, whatsapp, email, max, jivo, avito, mobile_app_chat] } }
        primary_tasks: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
    DomainPackPin:
      type: object
      required: [id, version, variants]
      properties:
        id: { type: string }
        version: { type: string }
        variants: { type: object }
    DomainPackManifest:
      type: object
      required: [id, version, name, purpose, support_status, stage, connector_types, journeys, critical_entities, policies, capabilities, gates, schema, policy_ref, knowledge_ref, eval_ref]
      properties:
        id: { type: string }
        version: { type: string }
        name: { type: string }
        purpose: { type: string }
        support_status: { type: string }
        stage: { type: string, const: setup }
        connector_types: { type: array, items: { type: string } }
        journeys: { type: array, items: { type: string } }
        critical_entities: { type: array, items: { type: string } }
        policies: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        gates: { type: array, items: { type: string } }
        schema: { type: object }
        at_least_one_of: { type: array, items: { type: string } }
        policy_ref: { type: string }
        knowledge_ref: { type: string }
        eval_ref: { type: string }
        upgrade_from: { type: object }
    DomainPackCommand:
      type: object
      additionalProperties: false
      required: [version, pack_id, pack_version, variants]
      properties:
        version: { type: integer, minimum: 1 }
        pack_id: { type: string }
        pack_version: { type: string }
        variants: { type: object }
        confirmed: { type: boolean }
    DomainPackPreview:
      type: object
      required: [current, target, impact]
      properties:
        current: { $ref: '#/components/schemas/DomainPackPin' }
        target: { $ref: '#/components/schemas/DomainPackManifest' }
        impact:
          type: object
          required: [compatibility, changed, review_slots]
          properties:
            compatibility: { type: string }
            changed: { type: array, items: { type: string } }
            review_slots: { type: array, items: { type: string } }
    EmployeeDraft:
      type: object
      required: [tenant_id, employee_id, owner_id, status, readiness, version, current_step, brief, created_at, updated_at]
      properties:
        tenant_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        status: { type: string, const: draft }
        readiness: { type: string, const: incomplete }
        version: { type: integer, minimum: 1 }
        current_step: { type: string, enum: [brief, launch_plan] }
        brief:
          type: object
          description: Подтверждённо сохранённые поля или пустой незавершённый Brief
          properties:
            purpose: { type: string }
            name: { type: string }
            languages: { type: array, items: { type: string } }
            time_zone: { type: string }
            working_hours:
              type: object
              properties:
                days: { type: array, items: { type: string } }
                start: { type: string }
                end: { type: string }
            desired_channels: { type: array, items: { type: string } }
            primary_tasks: { type: array, items: { type: string } }
        domain_pack: { $ref: '#/components/schemas/DomainPackPin' }
        review_slots: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EmployeeWithPlan:
      type: object
      required: [employee, launch_plan]
      properties:
        employee: { $ref: '#/components/schemas/EmployeeDraft' }
        launch_plan:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [complete, incomplete, blocked] }
              reason: { type: string }
    Role: { type: string, enum: [owner, configurator, operator, expert_qa, integration_admin] }
    Scope: { type: string, enum: [configuration, integrations, operations, review, technical_expertise, claims, audit] }
    ChangeReason: { type: string, enum: [access_adjustment, security_response] }
    RevokeReason: { type: string, enum: [offboarding, security_response] }
    Membership:
      type: object
      required: [tenant_id, roles, scopes, status, version]
      properties:
        tenant_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        status: { type: string, enum: [pending, expired, active, revoked] }
        version: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
    InviteInput:
      type: object
      additionalProperties: false
      required: [email, roles, scopes]
      properties:
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
    ChangeInput:
      type: object
      additionalProperties: false
      required: [roles, scopes, version, reason]
      properties:
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        version: { type: integer, minimum: 1 }
        reason: { $ref: '#/components/schemas/ChangeReason' }
    TenantCreated:
      type: object
      additionalProperties: false
      required: [tenant_id, name, role, workspace_url]
      properties:
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, const: Owner }
        workspace_url: { type: string }
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string, format: uuid }
        retryable: { type: boolean }
        field_errors: { type: object, additionalProperties: { type: string } }
  responses:
    Problem:
