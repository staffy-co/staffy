      operationId: recordCorrection
      summary: 'Записать операторскую коррекцию факта (первый срез 2.15): пин ТОЧНОЙ версии [1..версий] (оптимистическая конкурентность AC-8: вторая коррекция той же версии — вторая строка и вторая версия факта, молчаливой перезаписи нет); proposed_value — материальная дисциплина фактов 2.2 (одно каноническое JSON-значение); spans 0..8 × 1..200 рун — байт-в-байт выдержки источника (0 = события кейса, summary_no >= 1 = текст ТОЧНОЙ сводки — анти-фантазийный зонд 2.8); reason 1..200 рун обязательный; ИСХОД — НЕ поле запроса: матричный гейт домена решает по material_key якоря (price/availability/order_status → disputed БЕЗ записи факта — значение Owning System не переписывается; прочий ключ → applied = заливка НОВОЙ версии факта существующим record_fact-контуром, source_id correction:<id>, НИКОГДА не автоподтверждение — конфликт читается read-time, разрешение = confirm_fact_version человеком); коррекция НЕ гейтится владением разговором (долг корректности — доступна оператору review|configuration при любом владельце); correction_no — СЕРВЕРНАЯ истина под advisory-локами case+conversation+факт-ключи; append-only строка + outbox case.correction_recorded идентификаторами и словарными словами (proposed_value и spans НИКОГДА); терминальный кейс — 400 work-rule (чтение честно отдаёт материал); PRG-форма «Исправить» на строке факта страницы кейса ведёт тем же контуром (303 → GET #decision-context)'
