            resolution_id: { type: string, format: uuid }
            decision: { type: string, enum: [same_client, separate] }
            note: { type: string }
            actor_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    CaseRecord:
      type: object
      required: [tenant_id, case_id, case_no, employee_id, state, created_at]
