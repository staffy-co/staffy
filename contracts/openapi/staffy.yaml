        '200': { description: Повтор идемпотентного ключа (replay исходной записи), content: { application/json: { schema: { $ref: '#/components/schemas/WorkOutcome' } } } }
        '400': { description: 'Гварды: слово вне словаря / отсутствует / promised_at в теле запроса / promise_no в теле (strict decode) / закрытый раунд зеркалом слов стора / терминальный кейс', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'Гейт прав ДО стражей: обещание требует review или configuration (audit-only — честный 403)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'Гонка номера обещания (stale_version — проигравший локов) / тот же ключ с иным материалом — command_key_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/tenants/{tenant_id}/cases/{case_id}/work-items/{work_item_id}/commitments:
