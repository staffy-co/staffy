    post:
      operationId: recordDeliveryEvidence
      summary: 'Записать наблюдение доставки исходящего ответа (первый срез 2-12): оператор передаёт наблюдение коннектора (словарь delivered_confirmed/delivery_unknown/provider_failed — машина никогда не изобретает исход); ответ обязан принадлежать этому кейсу; append-only событие с монотонным event_no + outbox client_reply_delivery_evidence (reply/event_no/kind — content никогда); состояние доставки — read-time деривация: dispatched без событий = unknown (слово delivered только у квитанции), последнее событие решает; слепой повтор структурно невозможен (drain однозаписен, retry-команды нет — повторная отправка это новый ответ, решение человека)'
