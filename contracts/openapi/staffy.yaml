        work_item_id: { type: string, format: uuid }
        version: { type: integer }
        state: { type: string }
        type: { type: string }
        title: { type: string }
        event_id: { type: string, format: uuid }
        target_ids: { type: array, items: { type: string, format: uuid } }
        source_ids: { type: array, items: { type: string, format: uuid } }
        merged_into: { type: string, format: uuid }
        fact_id: { type: string, format: uuid }
        fact_version: { type: integer }
        fact_status: { type: string, enum: [confirmed, conflicting, unverified] }
        exception_id: { type: string, format: uuid }
        verification_id: { type: string, format: uuid }
        verification_kind: { type: string, enum: [identity, authority] }
        verification_outcome: { type: string, enum: [passed, failed, expired, cancelled, ambiguous] }
        assurance_level: { type: string, enum: [none, basic, verified] }
        binding_id: { type: string, format: uuid }
        duplicate_candidate_id: { type: string, format: uuid }
        duplicate_decision: { type: string, enum: [same_client, separate] }
        confirmation_text: { type: string }
        epoch: { type: integer, description: 'Epoch термина владения перехода' }
        transfer_request_id: { type: string, format: uuid }
        transfer_decision: { type: string, enum: [acknowledged, declined, cancelled] }
        reply_id: { type: string, format: uuid }
        reply_state: { type: string, enum: [prepared] }
        reply_class: { type: string, enum: [sales, neutral, protected_request] }
        mode_term_id: { type: string, format: uuid }
        mode_version: { type: integer, minimum: 1 }
        mode_scope: { type: string, enum: [conversation, work_item] }
        disclosure_id: { type: string, format: uuid }
        disclosure_no: { type: integer, minimum: 1 }
        delivery_kind: { type: string, enum: [generated, sent, playback_acknowledged, playback_estimated, customer_confirmed, interrupted] }
        gate_owner_kind: { type: string, enum: [human, staffy] }
        gate_owner_name: { type: string }
        gate_current_epoch: { type: integer }
        gate_permitted_path: { type: string }
        proposal_id: { type: string, format: uuid, description: 'Предложение подачи/оценки (Story 2.6)' }
        outcome_id: { type: string, format: uuid, description: 'Записанный исход оценки (Story 2.6)' }
        outcome_no: { type: integer, minimum: 1 }
        outcome_class: { type: string, enum: [commercial_answer, informational_answer, clarify, mode_blocked, degraded_mode, fail_closed] }
        policy_outcome_id: { type: string, format: uuid, description: 'Действующий исход продажного ответа (сервер выбирает по якорю WI; запрос поле не несёт)' }
        observation_id: { type: string, format: uuid, description: 'Записанное наблюдение чтения (Story 2.7)' }
        observation_status: { type: string, enum: [ok, failed, unknown] }
        observation_reason: { type: string, enum: [provider_timeout, malformed_response, insufficient_scope, read_error] }
        observation_external_id: { type: string, description: 'Внешний ID носителя значения (только ok)' }
        observation_external_version: { type: string, description: 'Версия значения провайдера (только ok)' }
        link_id: { type: string, format: uuid, description: 'Ссылка продолжения команды (Story 2.10)' }
        continuation_issued: { type: boolean, description: 'Маска выдачи ссылок продолжения: токен никогда в исходе' }
