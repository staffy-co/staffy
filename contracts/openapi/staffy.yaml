      - $ref: '#/components/parameters/CaseID'
      - $ref: '#/components/parameters/TransferRequestID'
    post:
      operationId: resolveTransfer
      summary: 'Решение запроса (acknowledge — только цель, атомарно: resolution + термин + outbox; decline/cancel — цель или автор; опоздание — honest request_expired)'
      x-staffy-principal-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
