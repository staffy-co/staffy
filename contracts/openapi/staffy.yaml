        priority_note: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/ConnectorField' } }
    CapabilityDeclaration:
      type: object
      required: [id, title, direction, operation, timeout_ms, ordering, rate_limit, size_limit, idempotent, receipt, receipt_level, cancel_compensation, reconciliation, reconciliation_owner, probe_allowed]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        direction: { type: string, enum: [outbound, inbound] }
        operation: { type: string, enum: [query, command, event] }
        timeout_ms: { type: integer, minimum: 1 }
        ordering: { type: string }
        rate_limit: { type: string }
        size_limit: { type: string }
        idempotent: { type: boolean }
        receipt: { type: string }
        receipt_level: { type: string, enum: [accepted, delivered, committed] }
        cancel_compensation: { type: string }
        reconciliation: { type: string }
        reconciliation_owner: { type: string }
        probe_allowed: { type: boolean }
    CapabilityBlock:
      type: object
      required: [required, gate, owner]
      additionalProperties: false
      properties:
        required: { type: string, description: 'Требуемый архитектурный capability, например Action Gateway (Epic 3)' }
        gate: { type: string, description: 'Архитектурный гейт, например AG-4' }
        owner: { type: string, description: 'Ответственный, например Technical Lead + Security' }
    CapabilityEvidenceSummary:
      type: object
      required: [evidence_id, outcome, delivery_level, probe_kind, checked_at, expires_at, redacted_request, redacted_result]
      additionalProperties: false
      properties:
        evidence_id: { type: string, format: uuid }
        outcome: { type: string, enum: [verified, failed, unknown] }
        delivery_level: { type: string, enum: [accepted, delivered, committed, unknown] }
        probe_kind: { type: string, enum: [read_only_probe] }
        checked_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        redacted_request: { type: string, description: 'Редаксированная сводка запроса: без секрета и сырых данных' }
        redacted_result: { type: string, description: 'Редаксированная сводка результата: без сырого ответа провайдера' }
    CapabilityReport:
      type: object
      required: [id, title, direction, operation, timeout_ms, ordering, rate_limit, size_limit, idempotent, receipt, receipt_level, cancel_compensation, reconciliation, reconciliation_owner, probe_allowed, state, state_reason, can_verify]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        direction: { type: string, enum: [outbound, inbound] }
        operation: { type: string, enum: [query, command, event] }
        timeout_ms: { type: integer, minimum: 1 }
        ordering: { type: string }
        rate_limit: { type: string }
        size_limit: { type: string }
        idempotent: { type: boolean }
        receipt: { type: string }
        receipt_level: { type: string, enum: [accepted, delivered, committed] }
        cancel_compensation: { type: string }
        reconciliation: { type: string }
        reconciliation_owner: { type: string }
        probe_allowed: { type: boolean }
        state: { type: string, enum: [unverified, verifying, verified, unsupported, failed, unknown, stale] }
        state_reason: { type: string }
        checked_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        evidence: { $ref: '#/components/schemas/CapabilityEvidenceSummary' }
        block: { $ref: '#/components/schemas/CapabilityBlock' }
        can_verify: { type: boolean }
    Connection:
      type: object
      additionalProperties: false
      required: [tenant_id, connection_id, connector_id, connector_version, label, environment, status, authentication_state, transport_state, config, secret_active, owner_id, version, created_at, updated_at]
      properties:
        tenant_id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        connector_id: { type: string }
        connector_version: { type: string }
        label: { type: string }
        environment: { type: string, enum: [sandbox, test] }
        status: { type: string, enum: [draft, connected_unverified, failed, revoked] }
        authentication_state: { type: string, enum: [pending, verified, failed] }
        transport_state: { type: string, enum: [pending, verified, failed] }
        config: { type: object, additionalProperties: { type: string } }
        secret_id: { type: string, format: uuid, description: Opaque SecretStore reference; исходное значение недоступно }
        secret_hint: { type: string, description: Короткий отпечаток для подтверждения человеком без раскрытия значения }
        secret_active: { type: boolean }
        owner_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConnectionVersion:
      allOf:
        - $ref: '#/components/schemas/Connection'
        - type: object
          additionalProperties: false
          required: [actor_id, change_summary]
          properties:
            actor_id: { type: string, format: uuid }
            change_summary: { type: string }
  responses:
    Problem:
      description: Безопасная ошибка
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
