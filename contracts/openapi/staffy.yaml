openapi: 3.1.0
info:
  title: Staffy API
  version: 0.1.0
  description: >-
    Application contract behind a trusted PrincipalResolver. The external login/session
    transport is intentionally deployment-neutral and is not defined by Story 1.1.
paths:
  /v1/tenants/{tenant_id}/connectors:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listConnectorDefinitions
      summary: Каталог Connector definitions со статусами поддержки и schema полей
      x-staffy-principal-required: true
      responses:
        '200':
          description: Tenant-scoped каталог, сгруппированный на клиенте по типам
          content:
            application/json:
              schema:
                type: object
                required: [connectors]
                properties:
                  connectors: { type: array, items: { $ref: '#/components/schemas/ConnectorDefinition' } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/connections:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      operationId: createConnection
      summary: Создать tenant-scoped draft Connection; production заблокирован до AG-4
      x-staffy-principal-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connector_id, connector_version, label, environment, config]
              properties:
                connector_id: { type: string }
                connector_version: { type: string }
                label: { type: string, minLength: 1, maxLength: 120 }
                environment: { type: string, enum: [sandbox, test] }
                config: { type: object, additionalProperties: { type: string } }
      responses:
        '201':
          description: Новый draft Connection
          headers:
            Location: { schema: { type: string } }
            Idempotency-Replayed: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listConnections
      summary: Текущие подключения Tenant
      x-staffy-principal-required: true
      responses:
        '200':
          description: Tenant-scoped подключения
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/connections/{connection_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ConnectionID'
    get:
      operationId: readConnection
      summary: Чтение Connection; секрет возвращается только opaque reference и отпечатком
      x-staffy-principal-required: true
      responses:
        '200':
          description: Подключение
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveConnection
      summary: Сохранить новую версию конфигурации с CAS; проверочные статусы сбрасываются
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, label, config, change_summary]
              properties:
                version: { type: integer, minimum: 1 }
                label: { type: string, minLength: 1, maxLength: 120 }
                config: { type: object, additionalProperties: { type: string } }
                change_summary: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: Обновлённое подключение
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/connections/{connection_id}/versions:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ConnectionID'
    get:
      operationId: readConnectionVersions
      summary: Неизменяемая история версий Connection
      x-staffy-principal-required: true
      responses:
        '200':
          description: Версии подключения
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/ConnectionVersion' } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/connections/{connection_id}/capabilities:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ConnectionID'
    get:
      operationId: readCapabilityState
      summary: 'Capability State: заявленные контрактом и доказанные для аккаунта возможности'
      description: >-
        Состояние каждой capability выводится из фактов при чтении (без второй
        таблицы состояний): заявленные — из пинн-версии контракта Connection,
        доказанные — из применимой immutable evidence (совпадение connection,
        активного secret_id, среды, версии контракта, сборки адаптера, срока).
        Истёкшая/неприменимая evidence читается как stale с точной причиной;
        мутирующая capability несёт управляемую блокировку до Action Gateway.
      x-staffy-principal-required: true
      responses:
        '200':
          description: Derived capability state подключения
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, contract_version, adapter_build, capabilities]
                properties:
                  connection_id: { type: string, format: uuid }
                  contract_version: { type: string }
                  adapter_build: { type: string }
                  capabilities:
                    type: array
                    items: { $ref: '#/components/schemas/CapabilityReport' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/connections/{connection_id}/capabilities/{capability_id}/verify:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ConnectionID'
      - name: capability_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: verifyCapability
      summary: Запустить безопасный read-only probe одной заявленной capability
      description: >-
        Проверяется только завершённая outbound read-only probe-capability
        подключения в состоянии connected/unverified. Мутирующие capability
        отклоняются fail-closed с блокировкой (Action Gateway, AG-4); входящие
        события — честным отказом «путь не реализован в срезе». Timeout даёт
        unknown с владельцем reconciliation; повтор вслепую исключён. Повтор
        команды с тем же ключом replay-ится тем же результатом; тот же ключ
        с другими данными — конфликт 409.
      x-staffy-principal-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200':
          description: Состояние capability после проверки (derived из фактов)
          headers:
            Idempotency-Replayed: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [capability, replayed]
                properties:
                  capability: { $ref: '#/components/schemas/CapabilityReport' }
                  replayed: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/connections/{connection_id}/connect:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ConnectionID'
    post:
      operationId: connectConnection
      summary: Принять секрет один раз и выполнить разрешённую синтетическую базовую проверку
      description: >-
        Секрет записывается в SecretStore и сохраняется только как непрозрачная ссылка.
        Исходное значение недоступно после приёма. Успешная проверка не подтверждает
        capabilities: статус остаётся connected/unverified.
      x-staffy-principal-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
          description: >-
            Повтор той же команды после сетевого сбоя читается как replay её
            результата (заголовок ответа Idempotency-Replayed: true), а не как
            «изменено другим участником»; тот же ключ с другими данными — конфликт 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, secrets]
              properties:
                version: { type: integer, minimum: 1 }
                secrets: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Подключение с отдельными состояниями authentication и transport
          headers:
            Idempotency-Replayed: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/connections/{connection_id}/rotate:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ConnectionID'
    post:
      operationId: rotateConnectionSecret
      summary: 'Ротация секрета: новая версия Connection, прежняя ссылка отзывается'
      x-staffy-principal-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
          description: >-
            Повтор той же команды после сетевого сбоя читается как replay её
            результата (заголовок ответа Idempotency-Replayed: true), а не как
            «изменено другим участником»; тот же ключ с другими данными — конфликт 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, secrets]
              properties:
                version: { type: integer, minimum: 1 }
                secrets: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Подключение с новой версией и отозванным прежним seal
          headers:
            Idempotency-Replayed: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/connections/{connection_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ConnectionID'
    post:
      operationId: revokeConnection
      summary: Терминальный отзыв подключения и секрета
      x-staffy-principal-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
          description: >-
            Повтор той же команды после сетевого сбоя читается как replay её
            результата (заголовок ответа Idempotency-Replayed: true), а не как
            «изменено другим участником»; тот же ключ с другими данными — конфликт 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 290, description: Ограничено так, чтобы хранимая сводка «revoked: <причина>» укладывалась в лимит истории 300 символов }
      responses:
        '200':
          description: Отозванное подключение
          headers:
            Idempotency-Replayed: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/voice-profiles:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listVoiceProfiles
      summary: Каталог допустимых голосов и точный статус synthetic preview
      x-staffy-principal-required: true
      responses:
        '200':
          description: Tenant-scoped каталог
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles: { type: array, items: { $ref: '#/components/schemas/VoiceProfile' } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/voice:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: readVoiceVersions
      summary: Неизменяемая история голоса и словаря
      x-staffy-principal-required: true
      responses:
        '200':
          description: Версии настройки
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/VoiceVersion' } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveVoiceVersion
      summary: Сохранить новую версию голоса с CAS
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoiceCommand' }
      responses:
        '200':
          description: Новая версия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/voice/preview:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    post:
      operationId: previewVoice
      summary: Только разрешённый синтетический маршрут; ошибка capability не выдаёт аудио
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [voice_version, text, synthetic_data_confirmed]
              properties:
                voice_version: { type: integer, minimum: 1 }
                text: { type: string, minLength: 1, maxLength: 300 }
                slow: { type: boolean }
                synthetic_data_confirmed: { type: boolean, const: true, description: Explicit confirmation that this preview uses fictional test data; no automatic PII detection is performed. }
      responses:
        '200':
          description: Синтетическое аудио с точным текстом и версиями
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoicePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/voice/assessments:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: readVoiceAssessments
      summary: Оценки точных synthetic preview со статусом stale
      x-staffy-principal-required: true
      responses:
        '200':
          description: Tenant-scoped оценки
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessments: { type: array, items: { $ref: '#/components/schemas/VoiceAssessment' } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: assessVoicePreview
      summary: Оценить конкретный успешный preview текущей версии
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preview_id, voice_version, verdict]
              properties:
                preview_id: { type: string, format: uuid }
                voice_version: { type: integer, minimum: 1 }
                verdict: { type: string, enum: [approved, needs_revision] }
      responses:
        '200':
          description: Неизменяемая оценка; телефонное качество всё ещё требует человека
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceAssessment' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/behavior:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: readBehaviorVersions
      summary: Неизменяемая история поведения черновика
      x-staffy-principal-required: true
      responses:
        '200':
          description: Tenant-scoped версии поведения
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/BehaviorVersion' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveBehaviorVersion
      summary: Сохранить новую версию безопасного поведения
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BehaviorCommand' }
      responses:
        '200':
          description: Новая версия черновика; публикация не изменяется
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BehaviorVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/behavior/preview:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    post:
      operationId: previewBehavior
      summary: Синтетическая проверка правил и claims без внешних действий
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BehaviorCommand' }
      responses:
        '200':
          description: Режим, claims, блокеры и human fallback; всегда не publishable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BehaviorPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    get:
      operationId: listKnowledgeSources
      summary: Список источников знаний черновика
      x-staffy-principal-required: true
      responses:
        '200': { description: Tenant-scoped источники и состояние актуальности }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createKnowledgeSource
      summary: Создать источник в состоянии processing после выбора Domain Pack
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeSourceCreate' }
      responses:
        '201': { description: Источник создан; содержимое ещё не обработано }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/ingest:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
    post:
      operationId: ingestKnowledgeSource
      summary: Зарегистрировать HTTPS-страницу или TXT/PDF; синтетическую фикстуру поставить в processing
      description: Реальная страница остаётся в карантине без сетевого запроса. Реальный файл не сохраняется и получает failed с требованием повторной загрузки после появления scanner и safe extraction. Синтетический источник переходит из processing в непубликуемый preview только через отдельный вызов ingest-fixture. MIME клиента не является основанием для допуска. Файл до 2 МиБ; TXT UTF-8 до 256 КиБ; одна публичная HTTPS-страница.
      x-staffy-principal-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeIngest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/KnowledgeIngestMultipart' }
      responses:
        '201': { description: Источник в quarantined, failed или синтетическом processing; publishable=false }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenant_id}/employees/{employee_id}/knowledge-sources/{source_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/EmployeeID'
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readKnowledgeSource
      summary: Просмотреть provenance и неизменяемые версии с фрагментами
      x-staffy-principal-required: true
      responses:
        '200': { description: Источник и версии с текстом, checksum и position }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
