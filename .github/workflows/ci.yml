name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: staffy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: staffy-admin-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d staffy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Journeys spec files threshold
        run: |
          count=$(git ls-files 'tests/journeys/*.spec.ts' | wc -l)
          echo "journeys spec files: ${count} (threshold: >= 48)"
          test "$count" -ge 48
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: tests/journeys/package-lock.json
      - name: Domain Pack registry baseline (append-only drift)
        run: |
          rm -f /tmp/pack-registry-baseline.json
          git fetch --no-tags origin main || true
          if git show origin/main:internal/employee/packs/registry/index.json > /tmp/pack-registry-baseline.json 2>/dev/null; then
            echo "pack registry baseline: origin/main $(git rev-parse --short origin/main)"
          else
            rm -f /tmp/pack-registry-baseline.json
            echo "pack registry baseline: отсутствует (первая ревизия реестра) — append-only-сверка пропущена"
          fi
      - name: Go checks
        env:
          STAFFY_REGISTRY_BASELINE: /tmp/pack-registry-baseline.json
        run: |
          go test ./...
          go vet ./...
      - name: PostgreSQL integration checks
        env:
          STAFFY_TEST_DATABASE_URL: postgres://postgres:staffy-admin-test@127.0.0.1:5432/staffy?sslmode=disable
        run: go test -tags=integration ./tests/integration/... -v
      - name: Browser dependencies
        working-directory: tests/journeys
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser journeys
        working-directory: tests/journeys
        run: npm test
