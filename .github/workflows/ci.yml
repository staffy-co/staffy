name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: staffy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: staffy-admin-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d staffy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: tests/journeys/package-lock.json
      - name: Go checks
        run: |
          go test ./...
          go vet ./...
      - name: PostgreSQL integration checks
        env:
          STAFFY_TEST_DATABASE_URL: postgres://postgres:staffy-admin-test@127.0.0.1:5432/staffy?sslmode=disable
        run: go test -tags=integration ./tests/integration/... -v
      - name: Browser dependencies
        working-directory: tests/journeys
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser journeys
        working-directory: tests/journeys
        run: npm test
